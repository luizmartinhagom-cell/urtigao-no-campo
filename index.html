/* ---- Previsão do tempo (Open-Meteo: gratuito, sem chave, por GPS) ---- */
const CLIMA_LOCAIS_FIXOS = [
  { key:"caarapo", nome:"Caarapó (cidade)", lat:-22.634, lng:-54.822 },
  { key:"dourados", nome:"Dourados (cidade)", lat:-22.221, lng:-54.806 }
];
const WMO = {0:["☀️","Céu limpo"],1:["🌤️","Poucas nuvens"],2:["⛅","Parcialmente nublado"],3:["☁️","Nublado"],45:["🌫️","Neblina"],48:["🌫️","Neblina"],
  51:["🌦️","Garoa fraca"],53:["🌦️","Garoa"],55:["🌧️","Garoa forte"],56:["🌧️","Garoa"],57:["🌧️","Garoa"],61:["🌦️","Chuva fraca"],63:["🌧️","Chuva"],65:["🌧️","Chuva forte"],
  66:["🌧️","Chuva"],67:["🌧️","Chuva forte"],80:["🌦️","Pancadas"],81:["🌧️","Pancadas"],82:["⛈️","Pancadas fortes"],95:["⛈️","Trovoadas"],96:["⛈️","Trovoadas c/ granizo"],99:["⛈️","Trovoadas c/ granizo"]};
function wmo(c){ return WMO[c] || ["🌡️","—"]; }
function climaLocais(){
  const doCampo = STATE.campos.filter(c=>c.lat!=null && c.lng!=null)
    .map(c=>({ key:'c_'+c.id, nome:`${c.fazenda||'Campo'}${c.produtor?' · '+c.produtor:''}`, lat:c.lat, lng:c.lng }));
  return CLIMA_LOCAIS_FIXOS.concat(doCampo);
}
function tplClima(){
  const locais = climaLocais();
  if(!locais.some(l=>l.key===STATE.climaLocal)) STATE.climaLocal = locais[0].key;
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="hstack" style="justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <div class="section-title" style="margin:0;">🌦️ Previsão do tempo</div>
        <select id="climaLocalSel" style="flex:1;min-width:150px;max-width:260px;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;background:#fff;">
          ${locais.map(l=>`<option value="${esc(l.key)}" ${l.key===STATE.climaLocal?'selected':''}>${esc(l.nome)}</option>`).join('')}
        </select>
      </div>
      <div id="climaBox" style="margin-top:8px;"><div class="field-hint">Carregando previsão...</div></div>
    </div>`;
}
function wireClima(){
  const sel = document.getElementById('climaLocalSel');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    STATE.climaLocal = sel.value;
    try{ localStorage.setItem('urtigao_clima_local', sel.value); }catch(e){}
    carregarClima();
  });
  carregarClima();
}
async function carregarClima(){
  const local = climaLocais().find(l=>l.key===STATE.climaLocal) || CLIMA_LOCAIS_FIXOS[0];
  const chave = `${local.lat.toFixed(3)},${local.lng.toFixed(3)}`;
  const cache = STATE.climaCache[chave];
  if(cache && (Date.now()-cache.t) < 30*60*1000){ desenharClima(cache.data, local); return; }
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${local.lat}&longitude=${local.lng}`+
      `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`+
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max`+
      `&timezone=America%2FCampo_Grande&forecast_days=7`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    STATE.climaCache[chave] = { t:Date.now(), data };
    desenharClima(data, local);
  }catch(err){
    console.error("Previsão do tempo:", err);
    const box = document.getElementById('climaBox');
    if(box) box.innerHTML = `<div class="field-hint">Não foi possível carregar a previsão agora — verifique a internet.</div>`;
  }
}
function desenharClima(data, local){
  const box = document.getElementById('climaBox');
  if(!box || !data || !data.daily) return;
  const d = data.daily, cur = data.current||{};
  const diasSem = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const chuva7 = (d.precipitation_sum||[]).reduce((a,b)=>a+(b||0),0);
  box.innerHTML = `
    ${cur.temperature_2m!=null ? `<div class="hstack" style="gap:10px;margin-bottom:8px;flex-wrap:wrap;font-size:13px;">
      <span style="font-size:26px;line-height:1;">${wmo(cur.weather_code)[0]}</span>
      <span><b style="font-size:20px;">${fmt(cur.temperature_2m,0)}°C</b> agora · ${wmo(cur.weather_code)[1]}</span>
      <span style="color:var(--ink-soft);">💧 ${fmt(cur.relative_humidity_2m,0)}% · 💨 ${fmt(cur.wind_speed_10m,0)} km/h</span>
    </div>` : ''}
    <div class="clima-dias">
      ${d.time.map((t,i)=>{
        const dt = new Date(t+"T12:00:00");
        const rot = i===0 ? 'Hoje' : `${diasSem[dt.getDay()]} ${String(dt.getDate()).padStart(2,'0')}`;
        const mm = d.precipitation_sum?.[i] ?? 0, prob = d.precipitation_probability_max?.[i];
        return `<div class="clima-dia" title="${esc(wmo(d.weather_code[i])[1])} · vento até ${fmt(d.wind_speed_10m_max?.[i],0)} km/h">
          <div style="font-size:11.5px;font-weight:700;color:var(--ink-soft);">${rot}</div>
          <div style="font-size:22px;line-height:1.3;">${wmo(d.weather_code[i])[0]}</div>
          <div style="font-size:13px;"><b>${fmt(d.temperature_2m_max[i],0)}°</b> <span style="color:var(--ink-soft);">${fmt(d.temperature_2m_min[i],0)}°</span></div>
          <div style="font-size:11.5px;color:#2453A8;font-weight:600;">${mm>=0.1?fmt(mm,mm<10?1:0)+' mm':'—'}</div>
          <div style="font-size:10.5px;color:var(--ink-soft);">${prob!=null?prob+'%':''}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="field-hint" style="margin-top:6px;">${fmt(chuva7,0)} mm previstos em 7 dias · ${esc(local.nome)} · fonte: Open-Meteo (modelos meteorológicos globais), atualizada a cada 30 min.</div>`;
}

/* ---------------------------------------------------------------
   BACKUP E RESTAURAÇÃO
   Gera um arquivo .json com TODOS os dados (campos de todas as safras,
   listas de materiais do protocolo, tabela de desconto e, se quiser, as
   fotos). Guarde o arquivo no Google Drive/e-mail. A restauração regrava
   os campos do arquivo (recria os apagados e volta os alterados ao estado
   do backup); campos criados depois do backup não são apagados.
------------------------------------------------------------------*/
const LS_BACKUP = 'urtigao_ultimo_backup';
function ultimoBackup(){ try{ return localStorage.getItem(LS_BACKUP); }catch(e){ return null; } }
function diasDesdeBackup(){ const u = ultimoBackup(); return u ? Math.floor((Date.now()-new Date(u).getTime())/86400000) : null; }
function semUndefined(o){ return JSON.parse(JSON.stringify(o)); }
async function gerarBackup(incluirFotos){
  if(STATE.db && !navigator.onLine) throw new Error('offline');
  const dados = { app:'urtigao-no-campo', versao:1, geradoEm:new Date().toISOString(), geradoPor:STATE.consultor, campos:[], config:[], fotos:[] };
  if(STATE.db){
    const sc = await STATE.db.collection(FIRESTORE_COLLECTION).get();
    dados.campos = sc.docs.map(d=>({ id:d.id, ...d.data() }));
    const cf = await STATE.db.collection(CATALOGO_COLLECTION).get();
    dados.config = cf.docs.map(d=>({ id:d.id, ...d.data() }));
    const sf = await STATE.db.collection(FOTOS_COLLECTION).get();
    dados.fotos = sf.docs.map(d=>({ id:d.id, ...d.data() })).filter(f=> incluirFotos || f.refItem); // base de referência sempre vai
  } else {
    dados.campos = STATE.campos.map(c=>semUndefined(c));
    dados.config = Object.entries(STATE.catalogoLocalPorSafra||{}).map(([sf,itens])=>({ id:docCatalogo(sf), itens, safra:sf }))
      .concat([{ id:DESCONTO_CONFIG_DOC, linhas:STATE.tabelaDesconto||[] }]);
  }
  const blob = new Blob([JSON.stringify(dados)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup_urtigao_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  try{ localStorage.setItem(LS_BACKUP, new Date().toISOString()); }catch(e){}
  return { campos:dados.campos.length, config:dados.config.length, fotos:dados.fotos.length, mb: blob.size/1048576 };
}
async function gravarEmLotes(colecao, docs, tamanho){
  for(let i=0;i<docs.length;i+=tamanho){
    const lote = STATE.db.batch();
    docs.slice(i,i+tamanho).forEach(({ id, ...dados })=>lote.set(STATE.db.collection(colecao).doc(id), dados));
    await lote.commit();
  }
}
async function restaurarBackup(dados){
  if(STATE.db && !navigator.onLine) throw new Error('Sem internet — para restaurar é preciso estar conectado.');
  if(!dados || dados.app!=='urtigao-no-campo' || !Array.isArray(dados.campos)) throw new Error('Arquivo não é um backup do Urtigão no Campo');
  if(STATE.db){
    await gravarEmLotes(FIRESTORE_COLLECTION, dados.campos, 100);
    await gravarEmLotes(CATALOGO_COLLECTION, dados.config||[], 100);
    await gravarEmLotes(FOTOS_COLLECTION, dados.fotos||[], 20); // fotos são grandes: lotes pequenos
  } else {
    dados.campos.forEach(c=>{ const i = STATE.campos.findIndex(x=>x.id===c.id); if(i>=0) STATE.campos[i] = c; else STATE.campos.push(c); });
    (dados.config||[]).forEach(c=>{ if(Array.isArray(c.itens) && c.safra){ STATE.catalogoLocalPorSafra = STATE.catalogoLocalPorSafra||{}; STATE.catalogoLocalPorSafra[c.safra] = c.itens; } if(c.id===DESCONTO_CONFIG_DOC) STATE.tabelaDesconto = c.linhas||[]; });
    aplicarCatalogoLocal((STATE.catalogoLocalPorSafra||{})[STATE.safraAtual]||[], STATE.catalogoDono);
    renderAll();
  }
  return dados.campos.length;
}
function abrirBackup(){
  const d = diasDesdeBackup();
  openModal(`
    <h3>💾 Backup</h3>
    <p class="field-hint" style="margin-bottom:10px;">Os dados ficam guardados no servidor (Firebase/Google), mas o backup protege contra exclusão por engano. Baixe o arquivo uma vez por mês e guarde no Google Drive ou mande para o seu e-mail.</p>
    <div class="field-hint" style="margin-bottom:10px;">Último backup neste aparelho: <b>${d==null?'nunca':d===0?'hoje':`há ${d} dia(s)`}</b></div>
    <label class="hstack" style="gap:8px;font-size:13px;margin-bottom:10px;"><input type="checkbox" id="bkFotos"> Incluir as fotos das avaliações (arquivo fica bem maior)</label>
    <button class="btn btn-primary btn-block" id="bkBaixar">⬇️ Baixar backup completo</button>
    ${ehResponsavel() ? `<div class="section-title">Restaurar</div>
    <div class="field-hint" style="margin-bottom:6px;">Regrava os campos do arquivo (recria os apagados e volta os alterados ao estado do backup). Campos criados depois do backup continuam.</div>
    <input type="file" id="bkArquivo" accept=".json,application/json" style="margin-bottom:8px;">
    <div class="field"><label>Senha do responsável (${RESPONSAVEL})</label><input type="password" id="bkSenha" placeholder="Sua senha"></div>
    <button class="btn btn-danger btn-block" id="bkRestaurar">♻️ Restaurar backup</button>` : `<div class="field-hint" style="margin-top:10px;">Restaurar um backup é feito pelo responsável (${RESPONSAVEL}).</div>`}
    <div class="field-hint" id="bkStatus" style="margin-top:8px;"></div>
    <button class="btn btn-block" style="margin-top:10px;" id="bkFechar">Fechar</button>`);
  const st = document.getElementById('bkStatus');
  document.getElementById('bkFechar').addEventListener('click', closeModal);
  document.getElementById('bkBaixar').addEventListener('click', async ()=>{
    const b = document.getElementById('bkBaixar'); b.disabled = true; b.textContent = 'Gerando...';
    try{ const r = await gerarBackup(document.getElementById('bkFotos').checked);
      st.innerHTML = `✓ Backup gerado: ${r.campos} campo(s), ${r.config} configuração(ões), ${r.fotos} foto(s) · ${fmt(r.mb,1)} MB.`; toast("Backup baixado ✓");
    }catch(e){ console.error(e); st.textContent = e.message==='offline' ? '📴 Para baixar o backup completo é preciso estar com internet.' : 'Erro ao gerar o backup — verifique a conexão.'; }
    b.disabled = false; b.textContent = '⬇️ Baixar backup completo';
  });
  document.getElementById('bkRestaurar')?.addEventListener('click', async ()=>{
    const f = document.getElementById('bkArquivo').files[0];
    if(!f){ toast("Escolha o arquivo de backup"); return; }
    if(!ehResponsavel() || !(await conferirSenhaDe(STATE.consultor, document.getElementById('bkSenha').value))){ st.innerHTML = '<span style="color:var(--danger);">Senha incorreta.</span>'; return; }
    let dados;
    try{ dados = JSON.parse(await f.text()); }catch(e){ st.textContent = 'Arquivo inválido.'; return; }
    if(!confirm(`Restaurar ${dados.campos?.length||0} campo(s) do backup de ${dados.geradoEm?new Date(dados.geradoEm).toLocaleString('pt-BR'):'?'}?`)) return;
    const b = document.getElementById('bkRestaurar'); b.disabled = true; b.textContent = 'Restaurando...';
    try{ const n = await restaurarBackup(dados); st.innerHTML = `✓ ${n} campo(s) restaurado(s).`; toast("Backup restaurado ✓"); }
    catch(e){ console.error(e); st.textContent = e.message || 'Erro ao restaurar.'; }
    b.disabled = false; b.textContent = '♻️ Restaurar backup';
  });
}

/* ---------------------------------------------------------------
   APP INSTALÁVEL (iPhone e Android) + funcionamento sem sinal
------------------------------------------------------------------*/
function rodandoComoApp(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function ehIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); STATE.promptInstalar = e; });
window.addEventListener('appinstalled', ()=>{ STATE.promptInstalar = null; toast("App instalado ✓"); renderAll(); });
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Service worker:', err)); });
}
async function instalarApp(){
  if(STATE.promptInstalar){
    STATE.promptInstalar.prompt();
    const r = await STATE.promptInstalar.userChoice.catch(()=>null);
    STATE.promptInstalar = null;
    if(r && r.outcome==='accepted') toast("Instalando...");
    renderAll(); return;
  }
  abrirComoInstalar();
}

/* ---- Filtros e agrupamentos da aba Resultados ---- */
function quinzenaPlantio(iso){
  if(!iso) return { k:'zz', label:'Sem data de plantio' };
  const [a,m,d] = iso.split('-').map(Number);
  const q = d<=15 ? 1 : 2;
  return { k:`${a}-${String(m).padStart(2,'0')}-${q}`, label:`${q}ª quinzena ${MESES_ABREV[m-1]}/${String(a).slice(2)}` };
}
function grupoDoCampo(campo, por){
  if(por==='epoca') return quinzenaPlantio(campo.dataPlantio);
  if(por==='potencial'){
    const o = POTENCIAL_PRODUTIVO_OPCOES.find(x=>x.v===campo.potencialProdutivo);
    const ordem = { alto:'1', medio:'2', baixo:'3' };
    return o ? { k:ordem[o.v], label:o.label } : { k:'9', label:'Potencial não informado' };
  }
  return { k:'geral', label:'Geral' };
}
function tplFiltrosResultados(doTipo){
  const f = STATE.filtro;
  const vals = campo => Array.from(new Set(doTipo.map(c=>c[campo]).filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
  const materiais = Array.from(new Set(doTipo.flatMap(c=>materiaisAtivos(c).map(m=>m.nome)))).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
  const ativos = ['fazenda','produtor','consultor','safra','material','potencial','plantioDe','plantioAte'].filter(k=>f[k]).length;
  const sel = (id, k, rot, lista, map) => `<div class="field" style="margin:0;"><label>${rot}</label><select id="${id}"><option value="">Todos</option>${lista.map(v=>{ const [val,txt] = map?map(v):[v,v]; return `<option value="${esc(val)}" ${f[k]===val?'selected':''}>${esc(txt)}</option>`; }).join('')}</select></div>`;
  return `

        ${sel('rfFazenda','fazenda','Fazenda',vals('fazenda'))}
        ${sel('rfProdutor','produtor','Produtor',vals('produtor'))}
        ${sel('rfConsultor','consultor','Consultor',vals('consultor'))}
        ${sel('rfMaterial','material','Material',materiais)}
        <div class="field" style="margin:0;"><label>Plantio de</label><input type="date" id="rfDe" value="${esc(f.plantioDe)}"></div>
        <div class="field" style="margin:0;"><label>Plantio até</label><input type="date" id="rfAte" value="${esc(f.plantioAte)}"></div>
      </div>
      ${ativos?`<button type="button" class="btn btn-sm btn-ghost" id="rfLimpar" style="padding:6px 0;">Limpar filtros</button>`:''}

// Tabela material × grupo (época de plantio, potencial produtivo ou safra) para a variável escolhida
function tplComparativoGrupos(campos, por, varKey){
  const V = VARS[varKey];
  const grupos = {};
  campos.forEach(c=>{
    const g = por==='safra' ? { k:c.safra||SAFRA_PADRAO, label:c.safra||SAFRA_PADRAO } : grupoDoCampo(c, por);
    (grupos[g.k] = grupos[g.k] || { ...g, campos:[] }).campos.push(c);
  });
  const lista = Object.values(grupos).sort((a,b)=>a.k.localeCompare(b.k));
  const statsG = lista.map(g=>({ g, stats: statsVar(g.campos, varKey) }));
  const geral = statsVar(campos, varKey);
  if(!geral.length) return `<div class="empty-state">Sem dados de ${esc(V.label.toLowerCase())} com os filtros atuais.</div>`;
  const melhor = statsG.map(x=>x.stats.length ? Math.max(...x.stats.map(s=>s.media)) : NaN);
  const titulo = { epoca:'Por época de plantio (quinzena)', potencial:'Por potencial produtivo', safra:'Comparação entre safras' }[por];
  const ultimos = statsG.filter(x=>x.stats.length).slice(-2);
  const delta = por==='safra' && ultimos.length===2;
  const cores = [COR_A, COR_B, COR_C, COR_D];
  const chart = statsG.length<=4 ? svgBarrasAgrupadas(geral.slice(0,15).map(s=>s.nome),
      statsG.map((x,i)=>({ nome:x.g.label, cor:cores[i], valores: geral.slice(0,15).map(sg=>{ const st = x.stats.find(s=>s.nome===sg.nome); return st ? st.media : NaN; }) })), { casas:V.casas }) : '';
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="section-title" style="margin-top:0;">🗂️ ${titulo} — ${esc(V.label)} (${esc(V.un)})</div>
      ${por==='safra' ? `<div class="hstack" style="gap:8px;flex-wrap:wrap;margin-bottom:6px;">${statsG.map(x=>{ const vals = x.stats.map(s=>s.media); return `<span class="chip-opt" style="cursor:default;">${esc(x.g.label)}: <b>${fmtVar(media(vals),varKey)}</b> · ${x.g.campos.length} campo(s)</span>`; }).join('')}</div>` : ''}
      ${chart}
      <div class="table-scroll"><table class="data-table">
        <thead><tr><th>Material</th>${statsG.map(x=>`<th>${esc(x.g.label)}<br><span style="font-weight:400;">${x.g.campos.length} campo(s)</span></th>`).join('')}${delta?`<th>Variação<br><span style="font-weight:400;">${esc(ultimos[0].g.label)} → ${esc(ultimos[1].g.label)}</span></th>`:''}<th>Geral</th></tr></thead>
        <tbody>${geral.map(sg=>{
          const cel = statsG.map((x,i)=>{ const st = x.stats.find(s=>s.nome===sg.nome);
            return st ? `<td style="${st.media===melhor[i]?'font-weight:800;color:var(--green-dark);':''}">${fmtVar(st.media,varKey)} <span style="color:var(--ink-soft);font-weight:400;">n=${st.n}</span></td>` : '<td style="color:var(--ink-soft);">—</td>'; }).join('');
          let dl = '';
          if(delta){ const a = ultimos[0].stats.find(s=>s.nome===sg.nome), b = ultimos[1].stats.find(s=>s.nome===sg.nome);
            dl = (a&&b) ? `<td style="color:${b.media>=a.media?'var(--green-dark)':'var(--danger)'};font-weight:700;">${b.media>=a.media?'+':''}${fmt((b.media/a.media-1)*100,1)}%</td>` : '<td>—</td>'; }
          return `<tr><td><b>${esc(sg.nome)}</b></td>${cel}${dl}<td>${fmtVar(sg.media,varKey)}</td></tr>`; }).join('')}</tbody>
      </table></div>
      <div class="vstack" style="gap:2px;margin-top:8px;">${statsG.filter(x=>x.stats.length).map(x=>`<div style="font-size:12.5px;">🏆 <b>${esc(x.g.label)}:</b> ${esc(x.stats[0].nome)} (${fmtVar(x.stats[0].media,varKey)} ${esc(V.un)})</div>`).join('')}</div>
      ${por==='safra'?'<div class="field-hint" style="margin-top:6px;">Compare com cuidado: o clima de cada safra muda o resultado — veja também 🌧️ Chuva × produtividade.</div>':''}
    </div>`;
}

function chuvaNoCiclo(campo){
  // soma da chuva lançada do plantio até a última colheita do campo (ou hoje)
  const colheitas = materiaisAtivos(campo).map(m=>m.colheita?.pesoColhidoKg ? m.colheita.data : null).filter(Boolean).sort();
  const fim = colheitas.length ? colheitas[colheitas.length-1] : todayISO();
  const ini = campo.dataPlantio || '0000';
  const lanc = (campo.chuvas||[]).filter(c=>c.data>=ini && c.data<=fim);
  if(lanc.length) return { mm: lanc.reduce((a,c)=>a+(num(c.mm)||0),0), fonte:'pluviômetro', ini, fim };
  return { mm: NaN, fonte:'sem chuva lançada', ini, fim };
}

function renderResultados(){
  const el = document.getElementById('view-resultados');
  const tipoDif = STATE.resTipo==='difusao';
  const doTipo = tipoDif ? camposDifusao() : camposProtocolo();
  const campos = doTipo.filter(campoMatchesFiltro);
  const varsDisp = Object.entries(VARS).filter(([k,v])=>!(tipoDif && v.aval));
  if(!varsDisp.some(([k])=>k===STATE.resVar)) STATE.resVar = 'scHa';
  const varKey = STATE.resVar, V = VARS[varKey];
  const vista = STATE.resVista || null; // null = painel com os blocos de análise
  const parcelas = campos.reduce((a,c)=>a+materiaisAtivos(c).length,0);
  const colhidas = campos.reduce((a,c)=>a+materiaisAtivos(c).filter(m=>m.colheita?.pesoColhidoKg).length,0);
  const pct = parcelas ? colhidas/parcelas*100 : 0;
  const stats = statsVar(campos, varKey);
  const VISTAS = [['ranking','🏆','Ranking'],['epoca','🗓️','Época de plantio'],['potencial','⛰️','Potencial produtivo'],['safra','📅','Comparar safras'],['duelo','🆚','L × L'],['estabilidade','📊','Estabilidade'],['chuva','🌧️','Chuva × produtividade']];
  const vistaInfo = VISTAS.find(v=>v[0]===vista);

  let corpo = '';
  if(!vista){
    // ---- Painel: resumo + um bloco para cada análise ----
    const mediaGeral = media(campos.flatMap(c=>materiaisEstat(c).map(m=>V.get(c,m)).filter(v=>v!=null && !isNaN(v))));
    const lider = stats[0];
    const comDados = campos.filter(c=>statsVar([c], varKey).length);
    const nEpocas = new Set(comDados.map(c=>quinzenaPlantio(c.dataPlantio).k)).size;
    const nPot = new Set(comDados.map(c=>grupoDoCampo(c,'potencial').k)).size;
    const nSafras = new Set(doTipo.map(c=>c.safra||SAFRA_PADRAO)).size;
    const est = stats.length>=2 ? estabilidadeVar(campos, varKey) : null;
    const nChuva = campos.filter(c=>!isNaN(chuvaNoCiclo(c).mm) && statsVar([c], varKey).length).length;
    const resumo = {
      ranking: lider ? `1º ${esc(lider.nome)} · ${fmtVar(lider.media,varKey)} ${esc(V.un)}` : 'Sem dados ainda',
      epoca: nEpocas ? `${nEpocas} época(s) de plantio` : 'Sem dados ainda',
      potencial: nPot ? `${nPot} grupo(s) de potencial` : 'Sem dados ainda',
      safra: `${nSafras} safra(s) com campos`,
      duelo: stats.length>=2 ? `Material contra material, lado a lado (${stats.length} materiais)` : 'Precisa de 2 materiais',
      estabilidade: est ? `${est.resultado.length} material(is) em ${est.ambientes} locais` : 'Precisa de 3 locais colhidos',
      chuva: nChuva ? `${nChuva} campo(s) com pluviômetro` : 'Lance a chuva na aba 🌧️'
    };
    corpo = `
      <div class="stat-row">
        <div class="stat"><b>${fmtVar(mediaGeral,varKey)}</b><span>Média geral ${esc(V.un)}</span></div>
        <div class="stat"><b>${lider?fmtVar(lider.media,varKey):'—'}</b><span>Maior média</span></div>
        <div class="stat"><b>${stats.length}</b><span>Materiais</span></div>
        <div class="stat"><b>${comDados.length}</b><span>Locais com dados</span></div>
      </div>
      <div class="tile-grid">
        ${VISTAS.map(([k,ic,t])=>`<button type="button" class="tile" data-resvista="${k}"><span class="tile-ic">${ic}</span><b>${t}</b><span>${resumo[k]}</span></button>`).join('')}
      </div>`;
  } else if(!stats.length && vista!=='safra'){
    corpo = `<div class="empty-state"><div class="big">📈</div>Sem dados de ${esc(V.label.toLowerCase())} com os filtros atuais.${varKey==='scHa'?' As estatísticas aparecem assim que a primeira parcela for colhida.':''}</div>`;
  } else if(vista==='ranking'){
    const anova = anovaVar(campos, varKey);
    const letraDe = nome => anova ? (anova.ranking.find(r=>r.nome===nome)?.letra||'') : '';
    const todos = stats.flatMap(s=>Array(s.n).fill(0)).length;
    const mediaGeral = media(campos.flatMap(c=>materiaisEstat(c).map(m=>VARS[varKey].get(c,m)).filter(v=>v!=null && !isNaN(v))));
    const max = Math.max(...stats.map(s=>s.media)), min0 = varKey==='ciclo' ? Math.min(...stats.map(s=>s.media))*0.9 : 0;
    const W = v => max>min0 ? (v-min0)/(max-min0)*100 : 0;
    corpo = `
      <div class="stat-row">
        <div class="stat"><b>${fmtVar(mediaGeral,varKey)}</b><span>Média geral ${esc(V.un)}</span></div>
        <div class="stat"><b>${fmtVar(max,varKey)}</b><span>Maior média</span></div>
        <div class="stat"><b>${stats.length}</b><span>Materiais</span></div>
        <div class="stat"><b>${todos}</b><span>Observações</span></div>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div class="section-title" style="margin-top:0;">🏆 ${esc(V.label)} por material (${esc(V.un)})</div>
        <div class="field-hint" style="margin-bottom:8px;">Linha tracejada = média geral. ${anova?`Letras iguais = não diferem (Tukey 5%). ANOVA: p = ${fmtP(anova.p)}${anova.modelo==='blocos'?' · locais como blocos':''}.`:''}</div>
        ${stats.map((s,i)=>{ const n = tipoDif ? null : numeroCatalogo(s.nome);
          return `<div class="rank-row" title="${esc(s.nome)}: ${fmtVar(s.media,varKey)} ${esc(V.un)} · ${s.n} local(is)${!isNaN(s.cv)?' · CV '+fmt(s.cv,0)+'%':''}">
            <div style="font-size:12.5px;line-height:1.25;overflow-wrap:anywhere;"><b>${i+1}º</b> ${n!=null?`<span style="color:var(--ink-soft);">${n} ·</span> `:''}${esc(s.nome)}</div>

              <div class="field-hint" style="margin:2px 0 0;">${x.rk.length}/${x.at} colhidos · 1º ${esc(x.rk[0].nome)} (${fmt(x.rk[0].scHa,1)} sc/ha)</div></div>

    const nomes = stats.map(s=>s.nome);
    if(!nomes.includes(STATE.dueloA)) STATE.dueloA = nomes[0];

        </div>

        ${svgDivergente(d.pares.map(p=>({ label:p.campo.fazenda||'?', v:p.d })), { nomeA:STATE.dueloA, nomeB:STATE.dueloB })}
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Local</th><th>A</th><th>B</th><th>A − B</th></tr></thead>

        <tbody>${linhas.map(x=>`<tr><td>${esc(x.c.fazenda||'')}</td><td>${fmtDate(x.ch.ini)} a ${fmtDate(x.ch.fim)}</td><td>${isNaN(x.ch.mm)?'—':fmtInt(x.ch.mm)}</td><td>${esc(x.ch.fonte)}</td><td>${fmtVar(x.v,varKey)}</td></tr>`).join('')}</tbody></table></div>

  el.innerHTML = `

      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${colhidas>0 && pct<100 ? `<div class="field-hint" style="margin-top:6px;">⏳ Prévia parcial — médias e posições ainda podem mudar com as próximas colheitas.</div>` : ''}

    <div class="hstack" style="gap:8px;margin-top:4px;">
      <button class="btn btn-sm btn-primary grow" id="resCompleto">🧪 Relatório estatístico</button>
      <button class="btn btn-sm" id="resXlsx">📊 Excel</button>
    </div>
    <button class="btn btn-yellow btn-block" id="resRede" style="margin-top:8px;">📄 Relatório da rede (PDF) — todos os locais</button>`;
  document.querySelectorAll('[data-restipo]').forEach(b=>b.addEventListener('click', ()=>{ STATE.resTipo=b.dataset.restipo; renderResultados(); }));

function parseFormulacao(txt){
  const p = String(txt||'').split(/[^0-9.,]+/).filter(Boolean).map(x=>num(x));
  return { N:p[0]||0, P2O5:p[1]||0, K2O:p[2]||0, ok:p.length>=3 && p.slice(0,3).every(v=>!isNaN(v)) };
}
function parseListaNumeros(txt){
  return String(txt||'').split(/[\s;]+|,(?=\s)|\n/).map(x=>num(x)).filter(v=>!isNaN(v) && v>0);
}

  return `<div class="calc-box">${itens.map(([v,l])=>`<div class="calc-item"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;

const FERR_WIRE = {
  regulagem(){
    const calc = ()=>{
      const dose = ferrNum('rg_dose'), esp = ferrNum('rg_esp'), metros = ferrNum('rg_metros');
      const mlin = metrosLinearesHa(esp), gM = dose*1000/mlin;
      const box = document.getElementById('rg_res');
      if(!(dose>0 && esp>0)){ box.innerHTML = `<div class="field-hint">Informe a dose e o espaçamento.</div>`; return; }
      box.innerHTML = `
        <div class="destaque"><span>Em ${fmt(metros,0)} m de linha devem cair</span><b>${fmtInt(gM*metros)} g</b><span>${fmt(gM,1)} g por metro</span></div>
        <div class="passos">
          <div><b>1.</b> 1 hectare = <b>10.000 m²</b></div>
          <div><b>2.</b> Metros lineares por hectare = 10.000 ÷ ${fmt(esp/100,2)} m = <b>${fmtInt(mlin)} m</b></div>
          <div><b>3.</b> ${fmt(dose,0)} kg = ${fmtInt(dose*1000)} g ÷ ${fmtInt(mlin)} m = <b>${fmt(gM,1)} g/m</b></div>
          <div><b>4.</b> ${fmt(gM,1)} g × ${fmt(metros,0)} m = <b>${fmtInt(gM*metros)} g por linha</b></div>
        </div>
        <details style="margin-top:8px;"><summary class="field-hint" style="cursor:pointer;font-weight:700;">📏 Metros lineares por hectare em outros espaçamentos</summary>
        <div class="table-scroll"><table class="data-table">
          <thead><tr><th>Espaçamento</th><th>m lineares/ha</th><th>g/m</th><th>g em ${fmt(metros,0)} m</th></tr></thead>
          <tbody>${Array.from(new Set([40,45,50,60,70,80,90,esp])).sort((a,b)=>a-b).map(e=>{ const ml=metrosLinearesHa(e), g=dose*1000/ml;
            return `<tr ${e===esp?'style="background:var(--yellow-soft);font-weight:700;"':''}><td>${fmt(e,0)} cm</td><td>${fmtInt(ml)}</td><td>${fmt(g,1)}</td><td>${fmtInt(g*metros)}</td></tr>`; }).join('')}</tbody>
        </table></div></details>`;
    };
    ['rg_dose','rg_esp','rg_metros'].forEach(id=>document.getElementById(id).addEventListener('input', calc));
    calc();
  },
  coleta(){
    const valores = STATE.coletaValores || (STATE.coletaValores = []);
    const montarLinhas = ()=>{
      const n = Math.max(1, Math.min(40, Math.round(ferrNum('cl_n')||1)));
      document.getElementById('cl_linhas').innerHTML = Array.from({length:n},(_,i)=>`
        <div class="field" style="margin:0;"><label>Linha ${i+1}</label><input type="number" step="any" inputmode="decimal" data-clinha="${i}" value="${valores[i]??''}" placeholder="g"></div>`).join('');
      document.querySelectorAll('[data-clinha]').forEach(inp=>inp.addEventListener('input', ()=>{ valores[+inp.dataset.clinha] = inp.value; calc(); }));
    };
    const calc = ()=>{
      const dose = ferrNum('rg_dose'), esp = ferrNum('rg_esp'), metros = ferrNum('rg_metros');
      const n = Math.max(1, Math.min(40, Math.round(ferrNum('cl_n')||1)));
      const pesos = valores.slice(0,n).map(v=>num(v)).map((v,i)=>({ i, v })).filter(x=>x.v>0);
      const box = document.getElementById('cl_res');
      const gEsperado = (dose>0&&esp>0&&metros>0) ? dose*1000/metrosLinearesHa(esp)*metros : NaN;
      if(!pesos.length){ box.innerHTML = `<div class="field-hint" style="margin-top:8px;">Esperado por linha: <b>${!isNaN(gEsperado)?fmtInt(gEsperado)+' g':'—'}</b> em ${fmt(metros,0)} m. Digite o peso de cada linha.</div>`; return; }
      const kgHaDe = g => g/metros/(esp/100)*10;
      const vals = pesos.map(p=>p.v), m = media(vals), sd = desvioPadrao(vals, m), cv = vals.length>1 ? sd/m*100 : NaN;
      const kgMedio = kgHaDe(m), difDose = dose>0 ? (kgMedio/dose-1)*100 : NaN;
      const vCv = isNaN(cv) ? '' : cv<=10 ? veredito('ok', `Variação entre linhas <b>aceitável</b> (CV ${fmt(cv,1)}%).`)
        : cv<=15 ? veredito('atencao', `Variação entre linhas <b>no limite</b> (CV ${fmt(cv,1)}%) — confira as linhas destacadas.`)
        : veredito('ruim', `Variação entre linhas <b>não aceitável</b> (CV ${fmt(cv,1)}%) — revise dosadores (desgaste, entupimento, mangueiras, adubo empedrado).`);
      const vDose = isNaN(difDose) ? '' : Math.abs(difDose)<=5 ? veredito('ok', `Média ${fmtInt(kgMedio)} kg/ha — dentro de ±5% da dose desejada.`)
        : Math.abs(difDose)<=10 ? veredito('atencao', `Média ${fmtInt(kgMedio)} kg/ha — ${difDose>0?'acima':'abaixo'} ${fmt(Math.abs(difDose),1)}% da dose. Ajuste fino recomendado.`)
        : veredito('ruim', `Média ${fmtInt(kgMedio)} kg/ha — ${difDose>0?'acima':'abaixo'} ${fmt(Math.abs(difDose),1)}% da dose. Regule a relação motora × movida.`);
      box.innerHTML = `
        ${resultadoHTML([[fmtInt(m)+' g','Média por linha (esperado '+(!isNaN(gEsperado)?fmtInt(gEsperado):'—')+' g)'],[fmtInt(kgMedio)+' kg/ha','Média por hectare'],[!isNaN(cv)?fmt(cv,1)+'%':'—','CV entre linhas'],[`${fmtInt(Math.min(...vals))}–${fmtInt(Math.max(...vals))} g`,'Menor – maior linha']])}
        <div style="margin-top:10px;">${vDose}${vCv}</div>
        <div class="table-scroll" style="margin-top:8px;"><table class="data-table">
          <thead><tr><th>Linha</th><th>g</th><th>kg/ha</th><th>vs média</th></tr></thead>
          <tbody>${pesos.map(p=>{ const d=(p.v/m-1)*100; const fora=Math.abs(d)>10;
            return `<tr ${fora?'style="background:#FBE9E7;"':''}><td>${p.i+1}</td><td>${fmtInt(p.v)}</td><td>${fmtInt(kgHaDe(p.v))}</td><td style="color:${fora?'var(--danger)':'var(--ink)'};font-weight:${fora?700:400};">${d>=0?'+':''}${fmt(d,1)}%</td></tr>`; }).join('')}</tbody>
        </table></div>
        <div class="field-hint" style="margin-top:6px;">Referência: CV entre linhas até 10% = aceitável; 10–15% = limite; acima de 15% = distribuição desuniforme (critérios usuais em avaliação de distribuidores e dosadores de fertilizante, como os da norma ASABE S341). Linhas com mais de ±10% em relação à média ficam destacadas.</div>
        ${!isNaN(difDose) && Math.abs(difDose)>5 ? `<button type="button" class="btn btn-sm btn-block" id="cl_irMotora" style="margin-top:8px;">⚙️ Acertar com motora × movida (${fmtInt(kgMedio)} → ${fmtInt(dose)} kg/ha)</button>` : ''}`;
      const ir = document.getElementById('cl_irMotora');
      if(ir) ir.addEventListener('click', ()=>{ STATE.ferrTool='motora'; renderFerramentas(); document.getElementById('rm_atual').value=Math.round(kgMedio); document.getElementById('rm_desej').value=Math.round(dose); document.getElementById('rm_atual').dispatchEvent(new Event('input')); window.scrollTo(0,0); });
    };
    document.getElementById('cl_n').addEventListener('input', ()=>{ montarLinhas(); calc(); });
    ['rg_dose','rg_esp','rg_metros'].forEach(id=>document.getElementById(id).addEventListener('input', calc));
    montarLinhas(); calc();
  },
  nutrientes(){
    let cult = 'soja', cob = 'nao';
    const preencherCoef = ()=>{ const c = COEF_NUTRIENTES[cult];
      ['N','P2O5','K2O'].forEach(n=>{ document.getElementById('coef_ext_'+n).value = c.extracao[n]; document.getElementById('coef_exp_'+n).value = c.exportacao[n]; }); };
    const calc = ()=>{
      const f = parseFormulacao(document.getElementById('nu_form').value);
      const dose = ferrNum('nu_dose'), prod = ferrNum('nu_prod');
      const box = document.getElementById('nu_res');
      if(!f.ok || !(dose>0)){ box.innerHTML = `<div class="field-hint">Informe a formulação (ex: 04-30-10) e a dose.</div>`; return; }
      const base = { N:f.N*dose/100, P2O5:f.P2O5*dose/100, K2O:f.K2O*dose/100 };
      let kCob = 0, txtCob = '';
      if(cob==='sim'){
        const sel = document.getElementById('nu_cobProd').value;
        const pct = sel==='outro' ? ferrNum('nu_cobPct') : num(sel);
        const dc = ferrNum('nu_cobDose');
        kCob = (pct>0 && dc>0) ? dc*pct/100 : 0;
        txtCob = `${fmt(dc,0)} kg/ha × ${fmt(pct,0)}% = ${fmt(kCob,0)} kg/ha de K₂O`;
      }
      const tot = { N:base.N, P2O5:base.P2O5, K2O:base.K2O+kCob };
      const tHa = prod>0 ? prod*60/1000 : NaN;
      const rot = { N:'N', P2O5:'P₂O₅', K2O:'K₂O' };
      const linhas = ['N','P2O5','K2O'].map(n=>{
        const exp = num(document.getElementById('coef_exp_'+n).value)*tHa, ext = num(document.getElementById('coef_ext_'+n).value)*tHa;
        let sit, nivel;
        if(n==='N' && cult==='soja'){ sit='Fixação biológica (inoculação) supre o N'; nivel='info'; }
        else if(isNaN(exp)){ sit='—'; nivel='info'; }
        else if(tot[n] >= ext){ sit='Supre a extração'; nivel='ok'; }
        else if(tot[n] >= exp){ sit='Repõe a exportação'; nivel='ok'; }
        else { sit=`Falta ${fmt(exp-tot[n],0)} kg/ha para repor`; nivel='ruim'; }
        return { n, exp, ext, sit, nivel };
      });
      const k = linhas.find(l=>l.n==='K2O');
      box.innerHTML = `
        ${resultadoHTML([[`${fmt(base.N,0)} · ${fmt(base.P2O5,0)} · ${fmt(base.K2O,0)}`,'kg/ha de N · P₂O₅ · K₂O no plantio'],[cob==='sim'?fmt(kCob,0)+' kg/ha':'Não','K₂O em cobertura'],[fmt(tHa,1)+' t/ha','Produção esperada ('+fmt(prod,0)+' sc)']])}
        ${cob==='sim'?`<div class="field-hint" style="margin-top:4px;">Cobertura: ${txtCob}. K₂O total = ${fmt(base.K2O,0)} + ${fmt(kCob,0)} = <b>${fmt(tot.K2O,0)} kg/ha</b>.</div>`:''}
        <div class="table-scroll" style="margin-top:10px;"><table class="data-table">
          <thead><tr><th>Nutriente</th><th>Aplicado</th><th>Sai nos grãos</th><th>Planta extrai</th><th>Situação</th></tr></thead>
          <tbody>${linhas.map(l=>`<tr><td><b>${rot[l.n]}</b></td><td>${fmt(tot[l.n],0)}</td><td>${fmt(l.exp,0)}</td><td>${fmt(l.ext,0)}</td>
            <td><span class="badge ${l.nivel==='ok'?'badge-colheita':l.nivel==='ruim'?'badge-danger':'badge-estande'}">${l.sit}</span></td></tr>`).join('')}</tbody>
        </table></div>
        <div style="margin-top:8px;">${k.nivel==='ruim'
          ? veredito('ruim', `K₂O vai faltar: aplicado ${fmt(tot.K2O,0)} kg/ha para ${fmt(k.exp,0)} kg/ha que saem nos grãos.${cob==='nao'?' Considere cobertura com KCl.':''}`)
          : veredito('ok', `K₂O ${cob==='sim'?'com a cobertura ':''}${k.sit.toLowerCase()} (${fmt(tot.K2O,0)} kg/ha aplicados).`)}</div>
        <div class="field-hint" style="margin-top:6px;">kg/ha. "Sai nos grãos" é o mínimo para não empobrecer o solo (manutenção); a recomendação final depende da análise de solo.</div>`;
    };
    ligarChips('data-nucult', v=>{ cult=v; document.getElementById('nu_prod').value = PRODUT_PADRAO[v]; preencherCoef(); calc(); });
    ligarChips('data-nucob', v=>{ cob=v; document.getElementById('nu_cobBox').style.display = v==='sim'?'':'none'; calc(); });
    document.getElementById('nu_cobProd').addEventListener('change', e=>{ document.getElementById('nu_cobPctBox').style.display = e.target.value==='outro'?'':'none'; calc(); });
    preencherCoef();
    ['nu_form','nu_dose','nu_prod','nu_cobDose','nu_cobPct','coef_ext_N','coef_ext_P2O5','coef_ext_K2O','coef_exp_N','coef_exp_P2O5','coef_exp_K2O']
      .forEach(id=>document.getElementById(id).addEventListener('input', calc));
    calc();
  },
  motora(){
    let tipo = 'adubo';
    const calc = ()=>{
      const mot = ferrNum('rm_mot'), mov = ferrNum('rm_mov'), atual = ferrNum('rm_atual'), desej = ferrNum('rm_desej');
      const un = tipo==='adubo' ? 'kg/ha' : 'sem/m', casas = tipo==='adubo' ? 0 : 1;
      const box = document.getElementById('rm_res');
      if(!(mot>0&&mov>0&&atual>0&&desej>0)){ box.innerHTML = `<div class="field-hint">Preencha os quatro campos.</div>`; return; }
      const rA = mot/mov, rN = rA*desej/atual;
      const lerLista = id => Array.from(new Set(parseListaNumeros(document.getElementById(id).value.replace(/,/g,' ')).map(Math.round)));
      const motoras = lerLista('rm_listMot'), movidas = lerLista('rm_listMov');
      const combos = [];
      motoras.forEach(a=>movidas.forEach(b=>{ const q = atual*(a/b)/rA; combos.push({ a, b, q, erro:(q/desej-1)*100, trocas:(a!==mot?1:0)+(b!==mov?1:0) }); }));
      combos.sort((x,y)=>Math.abs(x.erro)-Math.abs(y.erro) || x.trocas-y.trocas);
      const uma = combos.filter(c=>c.trocas===1)[0], top = combos.filter(c=>c.trocas>0).slice(0,5);
      box.innerHTML = `
        ${uma?`<div class="destaque"><span>Trocando só uma engrenagem</span><b>Motora ${uma.a} × Movida ${uma.b}</b><span>vai cair ≈ ${fmt(uma.q,casas)} ${un} (${uma.erro>=0?'+':''}${fmt(uma.erro,1)}%)</span></div>`:''}
        <div class="passos"><div>Relação atual: ${mot} ÷ ${mov} = <b>${fmt(rA,3)}</b></div><div>Relação necessária: ${fmt(rA,3)} × ${fmt(desej,casas)} ÷ ${fmt(atual,casas)} = <b>${fmt(rN,3)}</b></div></div>
        ${top.length?`<div class="section-title">Outras opções</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Motora</th><th>Movida</th><th>Vai cair</th><th>Erro</th></tr></thead>
          <tbody>${top.map(c=>`<tr><td><b>${c.a}</b></td><td><b>${c.b}</b></td><td>${fmt(c.q,casas)} ${un}</td><td style="color:${Math.abs(c.erro)<=3?'var(--green-dark)':'var(--danger)'};">${c.erro>=0?'+':''}${fmt(c.erro,1)}%</td></tr>`).join('')}</tbody></table></div>`:''}
        <div class="field-hint" style="margin-top:6px;">Depois de trocar, faça nova coleta para confirmar.</div>`;
    };
    ligarChips('data-rmtipo', v=>{ tipo=v; document.getElementById('rm_lblA').textContent = v==='adubo'?'Está caindo (kg/ha)':'Está caindo (sementes/m)'; document.getElementById('rm_lblD').textContent = v==='adubo'?'Preciso que caia (kg/ha)':'Preciso que caia (sementes/m)'; calc(); });
    ['rm_mot','rm_mov','rm_atual','rm_desej','rm_listMot','rm_listMov'].forEach(id=>document.getElementById(id).addEventListener('input', calc));
    calc();
  },
  cv(){
    let cult = 'soja';
    const vals = STATE.cvValores || (STATE.cvValores = []);
    const lista = ()=>{
      document.getElementById('cv_lista').innerHTML = vals.length
        ? vals.map((v,i)=>`<button type="button" class="chip-opt cv-chip" data-cvrm="${i}" title="Toque para apagar">${fmt(v, v%1?1:0)}</button>`).join('')
        : '<span class="field-hint">Nenhuma medida ainda.</span>';
      document.getElementById('cv_n').textContent = `${vals.length} medida(s)`;
      document.querySelectorAll('[data-cvrm]').forEach(b=>b.addEventListener('click', ()=>{ vals.splice(+b.dataset.cvrm,1); lista(); calc(); }));
    };
    const adicionar = ()=>{
      const inp = document.getElementById('cv_val');
      // aceita várias de uma vez separadas por espaço, ";" ou "/" — a vírgula é decimal
      const novos = String(inp.value).split(/[\s;\/]+/).map(x=>num(x)).filter(v=>!isNaN(v) && v>0);
      if(!novos.length){ toast("Digite a distância em cm"); inp.focus(); return; }
      vals.push(...novos); inp.value = ''; inp.focus(); lista(); calc();
    };
    const calc = ()=>{
      const sem = ferrNum('cv_sem'), esp = ferrNum('cv_esp');
      const d = vals.slice();
      const box = document.getElementById('cv_res');
      const xref = sem>0 ? 100/sem : NaN;
      if(d.length<2){ box.innerHTML = resultadoHTML([[!isNaN(xref)?fmt(xref,1)+' cm':'—','Distância ideal entre plantas'],[sem>0&&esp>0?fmtInt(calcPopTeoricaHa(sem,esp))+'/ha':'—','População teórica']]) + `<div class="field-hint" style="margin-top:6px;">Adicione pelo menos 2 medidas para calcular o CV (o ideal é 20 ou mais).</div>`; return; }
      const m = media(d), sd = desvioPadrao(d,m), cv = sd/m*100;
      const duplos = d.filter(x=>x<0.5*xref).length, falhos = d.filter(x=>x>1.5*xref).length, aceit = d.length-duplos-falhos;
      const pA = aceit/d.length*100, pD = duplos/d.length*100, pF = falhos/d.length*100;
      const plM = 100/m, efic = sem>0 ? plM/sem*100 : NaN;
      const nivelA = pA>=90?['ok','Ótimo']:pA>=75?['ok','Bom']:pA>=50?['atencao','Regular']:['ruim','Ruim'];
      const nivel3 = (v, a, b)=> v<=a ? ['ok','Aceitável'] : v<=b ? ['atencao','Atenção'] : ['ruim','Ruim'];
      const nF = nivel3(pF,5,10), nD = nivel3(pD,5,10), nCV = nivel3(cv,30,50);
      const nE = isNaN(efic) ? null : efic>=90 ? ['ok','Aceitável'] : efic>=80 ? ['atencao','Atenção'] : ['ruim','Ruim'];

          ${tolItem('Duplas (&lt; '+fmt(0.5*xref,1)+' cm)', fmt(pD,0)+'%', 'até 5% aceitável · 5–10% atenção · &gt; 10% ruim', nD)}
          ${tolItem('CV das distâncias', fmt(cv,1)+'%', 'até 30% aceitável · 30–50% atenção · &gt; 50% ruim', nCV)}

          <span><span class="dot" style="background:var(--green);"></span> Aceitáveis ${fmt(pA,0)}%</span>
          <span><span class="dot" style="background:#E0A800;"></span> Duplas ${fmt(pD,0)}%</span>
          <span><span class="dot" style="background:var(--danger);"></span> Falhas ${fmt(pF,0)}%</span></div>
        ${resultadoHTML([[fmt(plM,1)+' pl/m','Plantas por metro'],[esp>0?fmtInt(plM*10000/(esp/100))+'/ha':'—','População estimada']])}
        <div class="field-hint" style="margin-top:6px;">Aceitáveis, falhas e duplas pelo critério de Kurachi et al. (1989): aceitável entre 0,5 e 1,5 × a distância ideal. As faixas de falhas, duplas, CV e plantas/m são referências práticas de campo para regulagem.${cult==='milho'?' No milho, falhas e duplas pesam mais — busque ≥ 90% de aceitáveis.':''}${d.length<20?' <b>Faça pelo menos 20 medidas para um resultado confiável.</b>':''}</div>`;
    };
    ligarChips('data-cvcult', v=>{ cult=v; document.getElementById('cv_sem').value = SEMENTES_PADRAO[v]; document.getElementById('cv_esp').value = v==='milho'?50:45; calc(); });

      { k:'f1',  nome:'Formulado 1', form:'04-30-10', extra:'' },

      </div>${f.extra?`<div class="field-hint" style="margin:-2px 0 4px;">${f.extra}</div>`:''}`).join('');
    const salvar = ()=>{ const o = {};
      FONTES.forEach(f=>{ o[f.k] = document.querySelector(`[data-fopreco="${f.k}"]`).value; o[f.k+'_form'] = document.querySelector(`[data-foform="${f.k}"]`).value; o[f.k+'_nome'] = document.querySelector(`[data-fonome="${f.k}"]`).value; });

    const calc = ()=>{
      salvar();

      const progs = [];

        const g = parseFormulacao(document.querySelector(`[data-foform="${f.k}"]`).value);
        const preco = num(document.querySelector(`[data-fopreco="${f.k}"]`).value);
        const nome = document.querySelector(`[data-fonome="${f.k}"]`).value || f.nome;

        const doseKcl = kFalta>0 ? kFalta/0.60 : 0;
        const custo = (preco>0 ? dose*preco/1000 : NaN) + (doseKcl>0 ? (pKcl>0 ? doseKcl*pKcl/1000 : NaN) : 0);
        progs.push({ nome, form: document.querySelector(`[data-foform="${f.k}"]`).value, dose, doseKcl, n: dose*g.N/100, p: nP, k: kEntregue + doseKcl*0.6,
          custo, rsP: preco>0 ? preco/1000/(g.P2O5/100) : NaN, extra:f.extra, semPreco: !(preco>0) || (doseKcl>0 && !(pKcl>0)) });
      });
      const comPreco = progs.filter(p=>!isNaN(p.custo)).sort((a,b)=>a.custo-b.custo);
      const semPreco = progs.filter(p=>isNaN(p.custo));
      const melhor = comPreco[0];
      res.innerHTML = `
        <div class="passos">Necessidade para ${fmt(prod,0)} sc/ha (${fmt(tHa,1)} t/ha): <b>${fmtInt(nP)} kg/ha de P₂O₅</b> e <b>${fmtInt(nK||0)} kg/ha de K₂O</b> ${base==='export'?'(reposição do que sai nos grãos)':'(dose informada)'}</div>
        ${melhor ? `<div class="destaque"><span>Mais barato para esta produção</span><b>${esc(melhor.nome)}${melhor.doseKcl>0?' + KCl':''}</b><span>R$ ${fmt(melhor.custo,2)}/ha${saca>0?` · ${fmt(melhor.custo/saca,2)} sc/ha`:''}${prod>0?` · R$ ${fmt(melhor.custo/prod,2)} por saca produzida`:''}</span></div>` : `<div class="field-hint" style="margin:8px 0;">Preencha os preços (R$/t) para comparar o custo.</div>`}
        <div class="tol-list">${comPreco.concat(semPreco).map((p,i)=>`<div class="tol-item ${p===melhor?'tol-ok':''}">
          <div class="tol-top"><span>${p===melhor?'🏆 ':(isNaN(p.custo)?'':(i+1)+'º ')}<b style="display:inline;font-size:14px;">${esc(p.nome)}</b> <span style="color:var(--ink-soft);">${esc(p.form)}</span>${p.doseKcl>0?' + KCl':''}</span>
            <span style="font-weight:800;white-space:nowrap;">${isNaN(p.custo)?'<span class="field-hint">sem preço</span>':'R$ '+fmt(p.custo,2)+'/ha'}</span></div>
          <small>Dose: <b style="display:inline;font-size:12px;">${fmtInt(p.dose)} kg/ha</b>${p.doseKcl>0?` + <b style="display:inline;font-size:12px;">${fmtInt(p.doseKcl)} kg/ha KCl</b>`:''} · entrega N ${fmtInt(p.n)} · P₂O₅ ${fmtInt(p.p)} · K₂O ${fmtInt(p.k)}</small>
          <small>${isNaN(p.rsP)?'':'R$ '+fmt(p.rsP,2)+' por kg de P₂O₅'}${!isNaN(p.custo)&&saca>0?' · '+fmt(p.custo/saca,2)+' sc/ha':''}${!isNaN(p.custo)&&melhor&&p!==melhor?` · <b style="display:inline;font-size:12px;color:var(--danger);">+ R$ ${fmt(p.custo-melhor.custo,2)}/ha</b> que o melhor`:''}</small>
        </div>`).join('')}</div>
        <div class="field-hint" style="margin-top:6px;">A dose de cada fonte é calculada para entregar o P₂O₅ necessário; o K₂O que faltar é completado com KCl (60% K₂O). Formulados saem numa única aplicação; fontes simples + KCl precisam de mistura ou duas operações. O superfosfato simples também fornece enxofre e cálcio, e MAP/DAP fornecem nitrogênio — considere isso na escolha. Preços ficam salvos neste celular.</div>`;
    };
    ligarChips('data-focult', v=>{ cult=v; document.getElementById('fo_prod').value = PRODUT_PADRAO[v]; calc(); });
    ligarChips('data-fobase', v=>{ base=v; calc(); });
    document.querySelectorAll('#ferrCorpo input').forEach(el=>el.addEventListener('input', calc));
    calc();
  },
  pulverizador(){
    const valores = STATE.bicosValores || (STATE.bicosValores = []);
    let qAlvo = NaN;
    const calc = ()=>{
      const taxa = ferrNum('pv_taxa'), vel = ferrNum('pv_vel'), esp = ferrNum('pv_esp'), tanque = ferrNum('pv_tanque');
      qAlvo = (taxa>0&&vel>0&&esp>0) ? taxa*vel*(esp/100)/600 : NaN;
      const seg = ferrNum('pv_seg');
      document.getElementById('pv_res').innerHTML = `
        <div class="destaque"><span>Cada bico deve soltar</span><b>${!isNaN(qAlvo)?fmt(qAlvo,2)+' L/min':'—'}</b><span>${!isNaN(qAlvo)&&seg>0?fmtInt(qAlvo*1000*seg/60)+' mL em '+fmt(seg,0)+' s':''}</span></div>
        ${resultadoHTML([[tanque>0&&taxa>0?fmt(tanque/taxa,1)+' ha':'—','Área por tanque']])}
        <div class="field-hint" style="margin-top:6px;">Vazão = taxa × velocidade × espaçamento (m) ÷ 600.</div>`;
      calcBicos();
    };
    const montarBicos = ()=>{
      const n = Math.max(1, Math.min(60, Math.round(ferrNum('pv_n')||1)));
      document.getElementById('pv_bicos').innerHTML = Array.from({length:n},(_,i)=>`
        <div class="field" style="margin:0;"><label>Bico ${i+1}</label><input type="number" step="any" inputmode="decimal" data-bico="${i}" value="${valores[i]??''}" placeholder="mL"></div>`).join('');
      document.querySelectorAll('[data-bico]').forEach(inp=>inp.addEventListener('input', ()=>{ valores[+inp.dataset.bico] = inp.value; calcBicos(); }));
    };
    const calcBicos = ()=>{
      const n = Math.max(1, Math.min(60, Math.round(ferrNum('pv_n')||1)));
      const seg = ferrNum('pv_seg'), vel = ferrNum('pv_vel'), esp = ferrNum('pv_esp'), taxa = ferrNum('pv_taxa');
      const box = document.getElementById('pv_res2');
      const b = valores.slice(0,n).map((v,i)=>({ i, ml:num(v) })).filter(x=>x.ml>0);
      if(!b.length || !(seg>0)){ box.innerHTML = `<div class="field-hint" style="margin-top:6px;">Colete cada bico no mesmo tempo e digite o volume (mL).</div>`; return; }
      b.forEach(x=>{ x.q = (x.ml/1000)/(seg/60); });
      const qs = b.map(x=>x.q), m = media(qs), sd = desvioPadrao(qs,m), cv = qs.length>1 ? sd/m*100 : NaN;
      const taxaReal = (vel>0&&esp>0) ? m*600/(vel*(esp/100)) : NaN;
      const difTaxa = taxa>0 && !isNaN(taxaReal) ? (taxaReal/taxa-1)*100 : NaN;
      const ref = !isNaN(qAlvo) ? qAlvo : m;
      const trocar = b.filter(x=>Math.abs(x.q/ref-1)>0.10);
      box.innerHTML = `
        ${resultadoHTML([[fmt(m,2)+' L/min','Média por bico'],[!isNaN(cv)?fmt(cv,1)+'%':'—','CV entre bicos'],[!isNaN(taxaReal)?fmtInt(taxaReal)+' L/ha':'—','Taxa real aplicada'],[`${trocar.length} de ${b.length}`,'Bicos fora de ±10%']])}
        <div style="margin-top:8px;">
          ${isNaN(cv)?'':cv<=10?veredito('ok',`Variação entre bicos <b>aceitável</b> (CV ${fmt(cv,1)}%).`):veredito('ruim',`Variação entre bicos <b>não aceitável</b> (CV ${fmt(cv,1)}%) — revise pontas, filtros e pressão.`)}
          ${trocar.length?veredito('ruim',`Trocar ou limpar ponta(s): <b>${trocar.map(x=>'bico '+(x.i+1)).join(', ')}</b> (mais de 10% de diferença da vazão ${!isNaN(qAlvo)?'desejada':'média'}).`):veredito('ok','Todos os bicos dentro de ±10%.')}
          ${!isNaN(difTaxa)?(Math.abs(difTaxa)<=5?veredito('ok',`Taxa real ${fmtInt(taxaReal)} L/ha — dentro de ±5% do desejado.`):veredito('atencao',`Taxa real ${fmtInt(taxaReal)} L/ha — ${difTaxa>0?'+':''}${fmt(difTaxa,1)}% do desejado: ajuste pressão ou velocidade.`)):''}
        </div>
        <div class="table-scroll" style="margin-top:6px;"><table class="data-table">
          <thead><tr><th>Bico</th><th>mL</th><th>L/min</th><th>vs ${!isNaN(qAlvo)?'desejada':'média'}</th></tr></thead>
          <tbody>${b.map(x=>{ const d=(x.q/ref-1)*100, fora=Math.abs(d)>10; return `<tr ${fora?'style="background:#FBE9E7;"':''}><td>${x.i+1}</td><td>${fmtInt(x.ml)}</td><td>${fmt(x.q,2)}</td><td style="color:${fora?'var(--danger)':'var(--ink)'};font-weight:${fora?700:400};">${d>=0?'+':''}${fmt(d,1)}%</td></tr>`; }).join('')}</tbody>
        </table></div>
        <div class="field-hint" style="margin-top:6px;">Referência usual em calibração: ponta com vazão mais de 10% diferente da nominal (ou da média da barra) deve ser trocada; CV entre bicos até 10% indica barra uniforme.</div>`;
    };
    document.getElementById('pv_n').addEventListener('input', ()=>{ montarBicos(); calcBicos(); });
    ['pv_taxa','pv_vel','pv_esp','pv_tanque','pv_seg'].forEach(id=>document.getElementById(id).addEventListener('input', calc));
    montarBicos(); calc();
  },

  calagem(){
    let metodo = 'v';
    const calc = ()=>{
      const prnt = ferrNum('ca_prnt'), prof = ferrNum('ca_prof'), area = ferrNum('ca_area');
      const fator = (prnt>0 ? 100/prnt : NaN) * (prof>0 ? prof/20 : 1);
      let nc = NaN, conta = '';
      if(metodo==='v'){
        const T = ferrNum('ca_T'), v1 = ferrNum('ca_V1');
        const sel = document.getElementById('ca_V2sel').value;
        const v2 = sel==='outro' ? ferrNum('ca_V2') : num(sel);
        document.getElementById('ca_V2box').style.display = sel==='outro' ? '' : 'none';
        if(T>0 && !isNaN(v1) && v2>0){ const base = (v2-v1)*T/100; nc = base*fator;
          conta = `NC = (V2 − V1) × T ÷ 100 × (100 ÷ PRNT) × (prof. ÷ 20) = (${fmt(v2,0)} − ${fmt(v1,0)}) × ${fmt(T,2)} ÷ 100 × ${fmt(100/prnt,2)} × ${fmt(prof/20,2)}`; }
      } else {
        const al = ferrNum('ca_Al'), cam = ferrNum('ca_CaMg'), arg = ferrNum('ca_arg');
        const Y = arg<15 ? 1 : arg<=35 ? 2 : arg<=60 ? 3 : 4;
        if(!isNaN(al) && !isNaN(cam) && arg>0){ const base = Y*al + Math.max(0, 2-cam); nc = base*fator;
          conta = `NC = Y × Al + (2 − (Ca+Mg)) = ${Y} × ${fmt(al,2)} + ${fmt(Math.max(0,2-cam),2)} · Y = ${Y} (${fmt(arg,0)}% de argila) · × (100 ÷ PRNT) × (prof. ÷ 20)`; }
      }
      const mg = ferrNum('ca_Mg');
      const box = document.getElementById('ca_res');
      if(isNaN(nc)){ box.innerHTML = `<div class="field-hint">Preencha os dados da análise de solo (camada 0–20 cm).</div>`; }
      else if(nc<=0.05){ box.innerHTML = veredito('ok','<b>Não precisa de calcário</b> — a análise já atende a meta.'); }
      else box.innerHTML = `
        <div class="destaque"><span>Calcário com PRNT ${fmt(prnt,0)}%</span><b>${fmt(nc,2)} t/ha</b><span>${area>0?`${fmt(nc*area,1)} t para ${fmt(area,1)} ha`:''}</span></div>
        <div class="passos" style="font-size:12px;">${conta}</div>
        ${!isNaN(mg) ? (mg<0.5 ? veredito('atencao',`Mg baixo (${fmt(mg,2)} cmolc/dm³) — prefira calcário <b>dolomítico</b>.`) : veredito('ok',`Mg ${fmt(mg,2)} cmolc/dm³ — calcário calcítico ou magnesiano pode ser usado.`)) : ''}`;
      // Gessagem (camada 20–40 cm) — Embrapa Cerrados
      const gCa = ferrNum('ge_Ca'), gAl = ferrNum('ge_Al'), gM = ferrNum('ge_m'), gArg = ferrNum('ge_arg');
      const motivos = [];
      if(!isNaN(gCa) && gCa<=0.5) motivos.push(`Ca ≤ 0,5 cmolc/dm³ (${fmt(gCa,2)})`);
      if(!isNaN(gAl) && gAl>0.5) motivos.push(`Al > 0,5 cmolc/dm³ (${fmt(gAl,2)})`);
      if(!isNaN(gM) && gM>20) motivos.push(`saturação por Al > 20% (${fmt(gM,0)}%)`);
      const boxG = document.getElementById('ge_res');
      if(isNaN(gCa) && isNaN(gAl) && isNaN(gM)){ boxG.innerHTML = `<div class="field-hint">Preencha a análise da camada 20–40 cm.</div>`; return; }
      if(!motivos.length){ boxG.innerHTML = veredito('ok','<b>Gessagem não indicada</b> — subsuperfície sem limitação de Ca/Al pelos critérios.'); return; }
      const ng = gArg>0 ? 50*gArg : NaN;
      boxG.innerHTML = `${veredito('atencao',`<b>Gessagem indicada:</b> ${motivos.join('; ')}.`)}
        ${!isNaN(ng)?`<div class="destaque"><span>Gesso agrícola (culturas anuais)</span><b>${fmtInt(ng)} kg/ha</b><span>${area>0?`${fmt(ng*area/1000,1)} t para ${fmt(area,1)} ha · `:''}50 × ${fmt(gArg,0)}% de argila</span></div>`:`<div class="field-hint">Informe a argila (%) para calcular a dose.</div>`}`;
    };
    ligarChips('data-cametodo', v=>{ metodo=v; document.getElementById('ca_boxV').style.display = v==='v'?'':'none'; document.getElementById('ca_boxAl').style.display = v==='al'?'':'none'; calc(); });
    document.querySelectorAll('#ferrCorpo input, #ferrCorpo select').forEach(el=>el.addEventListener('input', calc));
    document.getElementById('ca_V2sel').addEventListener('change', calc);
    calc();
  }

};

/* ---------------------------------------------------------------
   7e) CHUVA — lançamento rápido no dashboard (produtor → fazenda →
   data → mm), resumo acumulado/mensal e relatório em PDF.
------------------------------------------------------------------*/
const MESES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function labelMes(ym){ const [a,m] = ym.split('-'); return `${MESES_ABREV[parseInt(m,10)-1]}/${a.slice(2)}`; }
function totalChuva(campo){ return (campo.chuvas||[]).reduce((a,c)=>a+(num(c.mm)||0),0); }
function chuvaPorMes(chuvas){
  const porMes = {};
  (chuvas||[]).forEach(c=>{ if(!c.data) return; const k = c.data.slice(0,7); porMes[k] = (porMes[k]||0) + (num(c.mm)||0); });
  return Object.keys(porMes).sort().map(k=>({ mes:k, label:labelMes(k), mm:porMes[k] }));
}
function rotuloCampoChuva(c, lista){
  const repetida = lista.filter(x=>(x.fazenda||'')===(c.fazenda||'')).length>1;
  return `${c.fazenda||'(sem fazenda)'}${ehDifusao(c)?' (difusão)':''}${repetida&&c.safra?' · '+c.safra:''}`;
}
function tplResumoChuva(campo){
  const meses = chuvaPorMes(campo.chuvas);
  return `
    <div class="card" style="margin-top:14px;">
      <div class="hstack" style="justify-content:space-between;">
        <div class="section-title" style="margin:0;">🌧️ Chuva</div>
        <b style="color:var(--green-dark);">${fmt(totalChuva(campo),0)} mm acumulados</b>
      </div>

}
function tplLancarChuva(){
  const campos = STATE.campos.filter(daSafra);
  const produtores = Array.from(new Set(campos.map(c=>c.produtor||''))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(!produtores.includes(STATE.chuvaProdutor)) STATE.chuvaProdutor = produtores.length===1 ? produtores[0] : null;
  const doProdutor = STATE.chuvaProdutor==null ? [] : campos.filter(c=>(c.produtor||'')===STATE.chuvaProdutor)
    .sort((a,b)=>(a.fazenda||'').localeCompare(b.fazenda||'','pt-BR'));
  if(!doProdutor.some(c=>c.id===STATE.chuvaCampoId)) STATE.chuvaCampoId = doProdutor.length===1 ? doProdutor[0].id : null;
  const campo = doProdutor.find(c=>c.id===STATE.chuvaCampoId);
  const rasc = STATE.chuvaRascunho || {};
  const meses = campo ? chuvaPorMes(campo.chuvas) : [];
  const ultimos = campo ? (campo.chuvas||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,5) : [];
  const podeRemover = c => campo && (podeEditar(campo) || mesmoConsultor(c.consultor, STATE.consultor));
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="section-title" style="margin-top:0;">🌧️ Lançar chuva</div>
      ${campos.length===0 ? `<div class="field-hint">Cadastre um campo para lançar chuva.</div>` : `
      <div class="grid2">
        <div class="field"><label>Produtor</label>
          <select id="ch_prod"><option value="__">— Selecione —</option>${produtores.map(p=>`<option value="${esc(p)}" ${p===STATE.chuvaProdutor?'selected':''}>${esc(p||'(sem produtor)')}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Fazenda</label>
          <select id="ch_campo" ${doProdutor.length?'':'disabled'}><option value="">${doProdutor.length?'— Selecione —':'Escolha o produtor'}</option>${doProdutor.map(c=>`<option value="${c.id}" ${c.id===STATE.chuvaCampoId?'selected':''}>${esc(rotuloCampoChuva(c, doProdutor))}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>Data</label><input type="date" id="ch_data" max="${todayISO()}" value="${esc(rasc.data||todayISO())}"></div>
        <div class="field"><label>Chuva (mm)</label><input type="number" id="ch_mm" step="any" min="0" inputmode="decimal" placeholder="Ex: 22" value="${esc(rasc.mm||'')}"></div>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="btnLancarChuva">+ Lançar chuva</button>
      ${campo ? `
        <div class="hstack" style="justify-content:space-between;margin-top:12px;">
          <span style="font-size:13px;"><b>${esc(campo.fazenda||'')}</b></span>
          <b style="color:var(--green-dark);">${fmt(totalChuva(campo),0)} mm acumulados</b>
        </div>
        ${meses.length?`<div class="chip-select" style="margin-top:6px;">${meses.map(m=>`<span class="chip-opt" style="cursor:default;">${m.label}: <b>${fmt(m.mm,0)} mm</b></span>`).join('')}</div>`:''}
        ${ultimos.length?`<div style="margin-top:6px;">${ultimos.map(c=>`
          <div class="hstack" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px;">
            <span>${fmtDate(c.data)} — <b>${fmt(num(c.mm),num(c.mm)%1?1:0)} mm</b>${c.consultor?` <span style="color:var(--ink-soft);font-size:11.5px;">· ${esc(c.consultor)}</span>`:''}</span>
            ${podeRemover(c)?`<button type="button" class="btn btn-sm btn-ghost" data-rmchuva="${esc(c.id)}" style="padding:2px 6px;color:var(--danger);">✕</button>`:''}
          </div>`).join('')}</div>`:''}
      `:''}
      <button type="button" class="btn btn-sm btn-block" id="btnRelChuva" style="margin-top:10px;">📄 Relatório de chuvas (PDF)</button>
      `}
    </div>`;
}
function wireLancarChuva(){
  const selP = document.getElementById('ch_prod');
  if(!selP) return;
  const guardarRascunho = ()=>{ STATE.chuvaRascunho = { data: document.getElementById('ch_data').value, mm: document.getElementById('ch_mm').value }; };
  selP.addEventListener('change', ()=>{ guardarRascunho(); STATE.chuvaProdutor = selP.value==='__' ? null : selP.value; STATE.chuvaCampoId = null; renderChuva(); });
  document.getElementById('ch_campo').addEventListener('change', e=>{ guardarRascunho(); STATE.chuvaCampoId = e.target.value||null; renderChuva(); });
  ['ch_data','ch_mm'].forEach(id=>document.getElementById(id).addEventListener('input', guardarRascunho));
  document.getElementById('btnLancarChuva').addEventListener('click', async ()=>{
    const campo = STATE.campos.find(c=>c.id===STATE.chuvaCampoId);
    const data = document.getElementById('ch_data').value;
    const mm = num(document.getElementById('ch_mm').value);
    if(!campo){ toast("Selecione o produtor e a fazenda"); return; }
    if(!data){ toast("Informe a data"); return; }
    if(data > todayISO()){ toast("Não é possível lançar chuva em data futura"); return; }
    if(isNaN(mm) || mm<0){ toast("Informe a chuva em mm"); return; }
    let chuvas = (campo.chuvas||[]).slice();
    const mesmoDia = chuvas.find(c=>c.data===data);
    if(mesmoDia){
      if(!confirm(`Já existe ${fmt(num(mesmoDia.mm),0)} mm lançado em ${fmtDate(data)} para ${campo.fazenda}. Substituir por ${fmt(mm,0)} mm?`)) return;
      chuvas = chuvas.filter(c=>c.data!==data);
    }
    chuvas.push({ id:uid(), data, mm, consultor:STATE.consultor });
    const btn = document.getElementById('btnLancarChuva'); btn.disabled = true;
    try{
      await salvarChuva(campo, chuvas);
      STATE.chuvaRascunho = { data, mm:'' };
      toast(`Chuva de ${fmt(mm,0)} mm lançada ✓`);
      renderChuva();
    }catch(err){ console.error(err); toast("Erro ao salvar — verifique sua conexão"); btn.disabled = false; }
  });
  document.querySelectorAll('[data-rmchuva]').forEach(b=>b.addEventListener('click', async ()=>{
    const campo = STATE.campos.find(c=>c.id===STATE.chuvaCampoId);
    if(!campo || !confirm("Remover este lançamento de chuva?")) return;
    await salvarChuva(campo, (campo.chuvas||[]).filter(c=>c.id!==b.dataset.rmchuva));
    toast("Lançamento removido"); renderChuva();
  }));
  document.getElementById('btnRelChuva').addEventListener('click', gerarRelatorioChuvasPDF);
}
function gerarRelatorioChuvasPDF(){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF não carregou — verifique sua conexão"); return; }
  const campos = STATE.campos.filter(c=>(c.chuvas||[]).length)
    .sort((a,b)=>(a.produtor||'').localeCompare(b.produtor||'','pt-BR') || (a.fazenda||'').localeCompare(b.fazenda||'','pt-BR'));
  if(!campos.length){ toast("Nenhuma chuva lançada ainda"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"pt" });
  const meses = Array.from(new Set(campos.flatMap(c=>chuvaPorMes(c.chuvas).map(m=>m.mes)))).sort();
  doc.setFontSize(16); doc.setTextColor(11,89,48);
  doc.text("Relatório de chuvas (pluviometria)", 30, Y0);
  doc.setFontSize(9); doc.setTextColor(90,107,98);
  doc.text(`${campos.length} fazenda(s) · período ${labelMes(meses[0])} a ${labelMes(meses[meses.length-1])} · valores em mm`, 30, Y0+16);
  doc.autoTable({
    head:[["Produtor","Fazenda", ...meses.map(labelMes), "Total acumulado"]],
    body: campos.map(c=>{
      const pm = Object.fromEntries(chuvaPorMes(c.chuvas).map(m=>[m.mes,m.mm]));
      return [c.produtor||'—', rotuloCampoChuva(c, campos), ...meses.map(m=>pm[m]!=null?fmt(pm[m],0):'—'), fmt(totalChuva(c),0)];
    }),
    startY:Y0+28, margin:MARGEM_PDF, styles:{ fontSize:9, cellPadding:4 },
    headStyles:{ fillColor:[11,89,48], textColor:255 }, alternateRowStyles:{ fillColor:[231,247,239] },
    columnStyles: Object.fromEntries([...meses.map((_,i)=>[i+2,{halign:'right'}]), [meses.length+2,{halign:'right',fontStyle:'bold'}]])
  });
  // Detalhe diário por fazenda, com acumulado do mês
  campos.forEach(c=>{
    let y = doc.lastAutoTable.finalY + 26;
    if(y > 500){ doc.addPage(); y = Y0; }
    doc.setFontSize(11); doc.setTextColor(11,89,48); doc.setFont(undefined,'bold');
    doc.text(`${c.fazenda||'(sem fazenda)'} — ${c.produtor||''} · total ${fmt(totalChuva(c),0)} mm`, 30, y);
    doc.setFont(undefined,'normal');
    const ord = (c.chuvas||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    const acumMes = {};
    doc.autoTable({
      head:[["Data","Chuva (mm)","Acumulado no mês (mm)","Acumulado total (mm)"]],
      body: ord.reduce((rows,ch)=>{ const k=(ch.data||'').slice(0,7); acumMes[k]=(acumMes[k]||0)+(num(ch.mm)||0);
        const tot=(rows.tot||0)+(num(ch.mm)||0); rows.tot=tot; rows.push([fmtDate(ch.data), fmt(num(ch.mm),num(ch.mm)%1?1:0), fmt(acumMes[k],0), fmt(tot,0)]); return rows; }, []),
      startY:y+8, margin:MARGEM_PDF, tableWidth:420, styles:{ fontSize:8.5, cellPadding:3 },
      headStyles:{ fillColor:[18,51,33], textColor:255 }, alternateRowStyles:{ fillColor:[247,251,249] },
      columnStyles:{ 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'} }
    });
  });
  rodapePDF(doc);
  doc.save(`relatorio_chuvas_${todayISO()}.pdf`);
  toast("Relatório de chuvas gerado ✓");
}

function campoCardHTML(campo){
  const materiais = materiaisAtivos(campo);
  const excluidos = materiaisExcluidos(campo).length;
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;
  const progress = materiais.length ? Math.round(colhidos/materiais.length*100) : 3;
  const situacao = getSituacaoCampo(campo);
  const area = areaTotalCampo(campo);
  const atrasado = temEtapaAtrasada(campo);
  return `
    <div class="campo-card" data-id="${campo.id}">
      <div class="campo-top">
        <div>
          <div class="campo-material">${esc(campo.fazenda||'(sem fazenda)')}</div>
          <div class="campo-sub">${esc(campo.produtor||'—')} · ${esc(campo.safra||'—')}</div>
        </div>
        <span class="hstack" style="gap:4px;flex:none;">
          ${atrasado ? `<span class="badge badge-danger">⚠️ Avaliação atrasada</span>` : ""}
          <span class="badge ${situacao.cls}">${situacao.label}</span>
        </span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="campo-meta">
        <span>👤 ${esc(campo.consultor||'—')}</span>
        <span>🌱 ${materiais.length} material(is)</span>
        ${area>0 ? `<span>📐 ${fmtAreaStat(area)}</span>` : ""}
        ${campo.dataPlantio ? `<span>🗓️ ${fmtDate(campo.dataPlantio)}</span>` : ""}
        ${excluidos>0 ? `<span>🚫 ${excluidos} sem semente</span>` : ""}
      </div>
      ${(()=>{ const p = proximaAvaliacao(campo); if(!p) return '';
        const cor = p.status==='atrasado' ? 'var(--danger)' : p.status==='no_prazo' ? '#6B2FA8' : 'var(--green-dark)';
        return `<div style="font-size:12.5px;font-weight:700;color:${cor};">📅 Próxima: ${esc(p.label)} · ${fmtDate(p.inicio)} a ${fmtDate(p.fim)}${p.status==='atrasado'?' (atrasada)':p.status==='previsao'?' (previsão)':''}</div>`; })()}
    </div>
  `;
}

async function abrirNovoCampo(tipo){
  const id = await criarCampo({ tipo: tipo==="difusao" ? "difusao" : "protocolo" });
  STATE.origemLista = tipo==="difusao" ? "difusao" : "protocolos";
  STATE.campoAbertoId = id;
  STATE.telaAtual = "campo";
  renderAll();
}
function abrirCampo(id){
  const c = STATE.campos.find(x=>x.id===id);
  STATE.origemLista = ehDifusao(c) ? "difusao" : "protocolos";
  STATE.campoAbertoId = id;
  STATE.telaAtual = "campo";
  renderAll();
}
function voltarDashboard(){
  STATE.telaAtual = STATE.origemLista || "protocolos";
  STATE.campoAbertoId = null;
  renderAll();
}
function abrirMaterial(materialId){
  STATE.materialAbertoId = materialId;
  STATE.tabAtiva = "estande";
  STATE.fotosNovas = [];
  STATE.sanDraft = null;
  STATE.telaAtual = "material";
  renderAll();
}
function voltarCampo(){
  STATE.telaAtual = "campo";
  STATE.materialAbertoId = null;
  renderAll();
}

function renderCampoDetail(){
  const campo = STATE.campos.find(c=>c.id===STATE.campoAbertoId);
  const el = document.getElementById('view-campo');
  if(!campo){
    el.innerHTML = `<div class="empty-state">Campo não encontrado.</div>`;
    return;
  }
  const editavel = podeEditar(campo);
  const materiais = materiaisAtivos(campo);
  const excluidos = materiaisExcluidos(campo);
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;

  el.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-sm" id="btnVoltar">← Voltar</button>
      <h1>${esc(campo.fazenda || 'Novo campo')}${ehDifusao(campo)?' <span class="badge badge-estande" style="vertical-align:middle;">Difusão</span>':''}</h1>
      ${editavel ? `<button class="btn btn-sm btn-danger" id="btnExcluir">Excluir</button>` : `<span class="badge badge-implantacao">Somente leitura</span>`}
    </div>
    ${!editavel ? `<div class="field-hint" style="margin-bottom:10px;">Este campo foi criado por <b>${esc(campo.consultor)}</b> — apenas ele(a) pode editar. Você pode visualizar os dados.</div>` : ""}

    <div id="dadosLocalWrap"></div>
    ${tplCronograma(campo)}
    <div id="pluviometriaWrap"></div>
    ${tplRankingCampo(campo)}

    <div class="hstack" style="justify-content:space-between;margin:20px 0 8px;">
      <div class="section-title" style="margin:0;">Materiais (${materiais.length}${materiais.length?` · ${colhidos} colhidos`:''}) · ordem por nº</div>
    </div>
    <div class="hstack" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      ${editavel && !ehDifusao(campo) ? `<button class="btn btn-sm btn-primary grow" id="btnSelecionarMateriais">🌱 Materiais do campo</button>` : ""}
      ${editavel && ehDifusao(campo) ? `<button class="btn btn-sm btn-primary grow" id="btnAddMaterialDifusao">+ Adicionar material</button>` : ""}
      <button class="btn btn-sm btn-yellow" id="btnCroqui">📐 Croqui do plantio (PDF)</button>
      <button class="btn btn-sm" id="btnRelatorioCampo">📄 PDF final da colheita</button>
    </div>
    <div id="listaMateriais"></div>
  `;

  document.getElementById('btnVoltar').addEventListener('click', voltarDashboard);
  if(editavel){
    document.getElementById('btnExcluir').addEventListener('click', async ()=>{
      const ok = await pedirSenha("Excluir campo", `Excluir o campo <b>${esc(campo.fazenda||'sem nome')}</b> e todos os seus materiais, avaliações e chuvas? Não tem como desfazer.`, "Excluir campo");
      if(ok){ await excluirCampo(campo.id); toast("Campo excluído"); }
    });
    const bSel = document.getElementById('btnSelecionarMateriais');
    if(bSel) bSel.addEventListener('click', ()=>abrirModalSelecionarMateriais(campo));
    const bAdd = document.getElementById('btnAddMaterialDifusao');
    if(bAdd) bAdd.addEventListener('click', ()=>abrirModalMaterialDifusao(campo));
  }
  document.getElementById('btnCroqui').addEventListener('click', ()=>gerarCroquiPDF(STATE.campos.find(c=>c.id===campo.id)||campo));
  document.getElementById('btnRelatorioCampo').addEventListener('click', ()=>abrirModalRelatorioCampo(campo));

  document.getElementById('dadosLocalWrap').innerHTML = tplDadosLocal(campo, editavel);
  wireDadosLocal(campo, editavel);

  document.getElementById('pluviometriaWrap').innerHTML = tplResumoChuva(campo);

  const listaEl = document.getElementById('listaMateriais');
  // Materiais excluídos ("sem semente") não aparecem mais na lista do campo.
  if(materiais.length===0){
    listaEl.innerHTML = `<div class="empty-state"><div class="big">🌾</div>${ehDifusao(campo) ? 'Nenhum material ainda. Toque em "+ Adicionar material".' : 'Nenhum material selecionado ainda neste campo. Toque em "Materiais do protocolo" para começar.'}</div>`;
  }else{
    listaEl.innerHTML = materiais.map(m=>materialRowHTML(campo, m)).join('');
    listaEl.querySelectorAll('.campo-card').forEach(row=>{
      row.addEventListener('click', ()=>abrirMaterial(row.dataset.matid));
    });
  }
}

function wireDadosLocal(campo, editavel){
  STATE.tempCoords = (campo.lat!=null) ? { lat:campo.lat, lng:campo.lng, precisaoM: campo.gpsPrecisaoM||null } : null;
  if(STATE.tempCoords){ atualizarTextoLocal(); initMiniMap(STATE.tempCoords.lat, STATE.tempCoords.lng, { editavel:false }); }
