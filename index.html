<style>

:root{
  --green:#0AA759;
  --green-dark:#0B5930;
  --green-light:#E7F7EF;
  --yellow:#FCE23B;
  --yellow-soft:#FFF6C4;
  --ink:#16241C;
  --ink-soft:#5A6B62;
  --line:#E2E8E4;
  --bg:#F6F9F7;
  --card:#FFFFFF;
  --danger:#D6483A;
  --radius:14px;
  --shadow:0 1px 3px rgba(16,29,25,.08), 0 1px 2px rgba(16,29,25,.06);
  --shadow-lg:0 8px 24px rgba(16,29,25,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%;}
button,input,select,textarea{font-family:inherit;font-size:16px;}
button{cursor:pointer;}
a{color:var(--green-dark);}
[hidden]{display:none!important;}

/* ---------- Layout shell ---------- */
.app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--bg);}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--ink);
  background:linear-gradient(135deg,#0E2318,#123321 60%,var(--green-dark));
  color:#fff;
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
}
.topbar img{height:34px;display:block;}
.topbar .spacer{flex:1;}
.consultor-chip{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:6px 10px;border-radius:999px;
  font-size:13px;
}
.consultor-chip button{
  background:none;border:none;color:var(--yellow);
  font-size:12px;padding:0;text-decoration:underline;
}
.consultor-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);}
.online-dot{width:8px;height:8px;border-radius:50%;background:#38C172;box-shadow:0 0 0 2px rgba(56,193,114,.25);}
.online-dot.off{background:#C13838;box-shadow:0 0 0 2px rgba(193,56,56,.25);}

main{padding:14px 14px 100px;}
.main-tabs{
  position:sticky;top:0;z-index:19;
  background:var(--bg);padding:10px 14px 0;margin:0;
  border-bottom:1px solid var(--line);
}
.main-tabs .tab{flex:1;justify-content:center;}
.main-tabs .tab.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}

.hstack{display:flex;align-items:center;gap:8px;}
.vstack{display:flex;flex-direction:column;gap:8px;}
.grow{flex:1;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);
  padding:10px 14px;font-weight:600;font-size:14px;
  transition:transform .05s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-yellow{background:var(--yellow);border-color:var(--yellow);color:var(--green-dark);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--green-dark);}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;pointer-events:none;}
.fab{
  position:fixed;right:18px;bottom:22px;z-index:30;
  width:56px;height:56px;border-radius:50%;
  background:var(--green);color:#fff;border:none;
  box-shadow:var(--shadow-lg);
  font-size:28px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  max-width:calc(900px - 36px);
}
.fab-wrap{max-width:900px;margin:0 auto;position:relative;}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
}
.section-title{
  font-size:13px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);font-weight:700;margin:18px 0 8px;
}
.section-title:first-child{margin-top:0;}

/* ---------- Name gate ---------- */
.gate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0E2318,#123321 55%,var(--green-dark));
  padding:24px;text-align:center;
}
.gate img{width:min(320px,80vw);margin-bottom:8px;}
.gate-card{
  background:#fff;border-radius:16px;padding:22px;width:100%;max-width:360px;
  box-shadow:var(--shadow-lg);margin-top:18px;
}
.gate-card h2{margin:0 0 4px;font-size:18px;color:var(--ink);}
.gate-card p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--green);
}
.field textarea{resize:vertical;min-height:60px;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.field-computed{
  background:var(--green-light);border:1px dashed var(--green);
  border-radius:10px;padding:8px 10px;font-size:13px;color:var(--green-dark);font-weight:600;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:420px){.grid2{grid-template-columns:1fr;}}

/* ---------- Dashboard ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
.filters select,.filters input{
  border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;
  font-size:13px;white-space:nowrap;flex:none;min-width:120px;
}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;}
.searchbar input{border:none;flex:1;outline:none;padding:0;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
.stat b{display:block;font-size:18px;color:var(--green-dark);}
.stat span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(2,1fr);}}

.campo-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;
}
.campo-card:active{transform:scale(.995);}
.campo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.campo-material{font-weight:700;font-size:15.5px;}
.campo-sub{font-size:12.5px;color:var(--ink-soft);}
.badge{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
}
.badge-implantacao{background:#FFF6C4;color:#8A6D00;}
.badge-estande{background:#E7F0FF;color:#2453A8;}
.badge-dev{background:#F1E7FF;color:#6B2FA8;}
.badge-colheita{background:var(--green-light);color:var(--green-dark);}
.badge-danger{background:#F3E3E1;color:#8A3B2E;}
.progress-track{height:5px;border-radius:999px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--green);}
.campo-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-soft);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty-state div.big{font-size:34px;margin-bottom:6px;}

/* ---------- Campo detail ---------- */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.detail-header h1{font-size:17px;margin:0;flex:1;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.tab{
  flex:none;padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.tab.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}
.tab .num{
  width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--ink-soft);
  font-size:10.5px;display:flex;align-items:center;justify-content:center;
}
.tab.active .num{background:var(--yellow);color:var(--green-dark);}
.tab.done .num{background:var(--green);color:#fff;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.calc-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
@media (max-width:420px){.calc-box{grid-template-columns:1fr;}}
.calc-item{background:var(--green-light);border-radius:10px;padding:8px 10px;}
.calc-item b{display:block;font-size:16px;color:var(--green-dark);}
.calc-item span{font-size:11px;color:var(--ink-soft);}
.avaliacao-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#FAFCFB;}
.avaliacao-item .hstack{justify-content:space-between;}
.sanidade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
@media (max-width:420px){.sanidade-grid{grid-template-columns:1fr;}}
.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-opt{
  border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;
  background:#fff;color:var(--ink-soft);font-weight:600;
}
.chip-opt.sel{background:var(--green);border-color:var(--green);color:#fff;}
.chip-opt.sel-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.map-pin-box{
  border:1.5px dashed var(--green);border-radius:12px;padding:10px;background:var(--green-light);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
#miniMap{width:100%;height:180px;border-radius:10px;margin-top:8px;display:none;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
@media (min-width:640px){.modal-backdrop{align-items:center;}}
.modal{
  background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
@media (min-width:640px){.modal{border-radius:18px;}}
.modal.wide{max-width:720px;}
.modal h3{margin:0 0 4px;font-size:16px;}
.modal .close{position:absolute;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;}
.data-table{border-collapse:collapse;width:100%;font-size:12.5px;}
.data-table th,.data-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.data-table th{background:var(--green-light);color:var(--green-dark);font-weight:700;}
.data-table tr:last-child td{border-bottom:none;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;box-shadow:var(--shadow-lg);z-index:99;opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.toast.show{opacity:1;}

.footer-note{text-align:center;font-size:11px;color:var(--ink-soft);padding:18px 0 6px;}

</style>

</head>

/* ---------------------------------------------------------------

------------------------------------------------------------------*/
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function num(v){
  if(v===null||v===undefined||v==="") return NaN;
  const n = parseFloat(String(v).replace(',','.'));
  return n;
}
function fmt(n, casas){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return n.toLocaleString('pt-BR',{minimumFractionDigits:casas??1, maximumFractionDigits:casas??1});
}
function fmtInt(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return Math.round(n).toLocaleString('pt-BR');
}
function avisoDivergenciaPct(pct, contexto){
  if(isNaN(pct)) return '';
  if(contexto==='sobrevivencia' && pct > 100){
    return `⚠️ Sobrevivência acima de 100% não é esperada — confira os metros avaliados, as plantas contadas e o espaçamento entrelinhas (erro de digitação nesses três campos é a causa mais comum de divergência).`;
  }
  if(contexto==='estabelecimento' && pct > 130){
    return `⚠️ Estabelecimento muito acima de 100% é incomum — confira sementes por metro, espaçamento entrelinhas e a contagem de plantas.`;
  }
  return '';
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR');
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---- Cálculos agronômicos ---- */
function calcAreaHa(comprimentoM, larguraM){
  const c = num(comprimentoM), l = num(larguraM);
  if(isNaN(c)||isNaN(l)||c<=0||l<=0) return NaN;
  return (c*l)/10000;
}
function calcLarguraM(numeroLinhas, espacamentoCm){
  const n = num(numeroLinhas), e = num(espacamentoCm);
  if(isNaN(n)||isNaN(e)||n<=0||e<=0) return NaN;
  return n*(e/100);
}
function fmtAreaStat(areaHa){
  if(!areaHa || areaHa<=0 || isNaN(areaHa)) return "—";
  return areaHa>=1 ? `${fmt(areaHa,2)} ha` : `${fmt(areaHa*10000,0)} m²`;
}
function fmtArea(areaHa){
  // parcelas de avaliação costumam ser pequenas — mostra em m² (mais intuitivo)
  // e, quando a área já é grande (>=0.5ha), mostra em hectares também.
  if(isNaN(areaHa)) return "—";
  const m2 = areaHa*10000;
  return areaHa>=0.5 ? `${fmt(m2,0)} m² (${fmt(areaHa,2)} ha)` : `${fmt(m2,0)} m²`;
}
function calcPopTeoricaHa(sementesPorMetro, espacamentoCm){
  const s = num(sementesPorMetro), e = num(espacamentoCm);
  if(isNaN(s)||isNaN(e)||e<=0) return NaN;
  const metrosLinearesPorHa = 10000/(e/100);
  return s * metrosLinearesPorHa;
}
function calcPlantasHa(plantasContadas, metrosAvaliados, espacamentoCm){
  const p = num(plantasContadas), m = num(metrosAvaliados), e = num(espacamentoCm);
  if(isNaN(p)||isNaN(m)||isNaN(e)||m<=0||e<=0) return NaN;
  const metrosLinearesPorHa = 10000/(e/100);
  return (p/m) * metrosLinearesPorHa;
}
function calcPesoCorrigido(pesoColhidoKg, umidadePct, umidadeBase){
  const p = num(pesoColhidoKg), u = num(umidadePct);
  const base = umidadeBase ?? UMIDADE_BASE_PADRAO;
  if(isNaN(p)||isNaN(u)) return NaN;
  return p * (100-u) / (100-base);
}
/* Aplica desconto por tabela (umidade% x impureza%) em vez da fórmula padrão,
   caso uma tabela esteja configurada e o consultor opte por usá-la — ver
   função obterDescontoTabela() e a seção "Colheita" para a UI de escolha. */
function calcPesoComDesconto(pesoColhidoKg, descontoPct){
  const p = num(pesoColhidoKg), d = num(descontoPct);
  if(isNaN(p)||isNaN(d)) return NaN;
  return p * (100-d) / 100;
}
/* Peso corrigido de um material colhido, respeitando o método escolhido
   (fórmula padrão ou tabela de desconto) — usado em qualquer lugar que
   precise da produtividade (lista de materiais, resumo, exports). */
function calcCorrigidoColheita(co){
  co = co || {};
  const metodo = co.metodoCorrecao || 'formula';
  if(metodo === 'tabela'){
    const desconto = obterDescontoTabela(co.umidadePct, co.impurezaPct);
    return !isNaN(desconto) ? calcPesoComDesconto(co.pesoColhidoKg, desconto) : NaN;
  }
  return calcPesoCorrigido(co.pesoColhidoKg, co.umidadePct, UMIDADE_BASE_PADRAO);
}
function diasDesdePlantio(dataPlantioISO){
  if(!dataPlantioISO) return NaN;
  const d = new Date(dataPlantioISO+"T00:00:00");
  if(isNaN(d.getTime())) return NaN;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

/* ---- Cronograma sugerido de avaliações (a partir da data de plantio) ---- */
function cronogramaCampo(campo){
  const dias = diasDesdePlantio(campo.dataPlantio);
  const materiais = materiaisAtivos(campo);
  if(isNaN(dias) || materiais.length===0) return [];
  return CRONOGRAMA_SUGERIDO.map(etapa=>{
    const pendentes = materiais.filter(m=>!etapa.done(m)).length;
    let status;
    if(pendentes===0) status = "feito";
    else if(dias < etapa.diasMin) status = "futuro";
    else if(dias <= etapa.diasMax) status = "no_prazo";
    else status = "atrasado";
    return { ...etapa, dias, pendentes, status };
  });
}
function temEtapaAtrasada(campo){
  return cronogramaCampo(campo).some(e=>e.status==="atrasado");
}
function tplCronograma(campo){
  const etapas = cronogramaCampo(campo);
  if(!campo.dataPlantio) return "";
  if(etapas.length===0) return "";
  const statusInfo = {
    feito: { icon:"✅", label:"Concluído", cls:"badge-colheita" },
    no_prazo: { icon:"🔔", label:"No prazo", cls:"badge-dev" },
    atrasado: { icon:"⚠️", label:"Atrasado", cls:"badge-danger" },
    futuro: { icon:"⏳", label:"Ainda não chegou", cls:"badge-implantacao" }
  };
  return `
    <div class="card vstack" style="margin-top:14px;">
      <div class="section-title" style="margin-top:0;">📅 Cronograma sugerido de avaliações</div>
      <div class="field-hint" style="margin-bottom:4px;">Estimativa a partir da data de plantio (${fmtDate(campo.dataPlantio)}) — ajuste pela observação visual do estágio da cultura, pois o ciclo varia com cultivar e clima.</div>
      ${etapas.map(e=>{
        const s = statusInfo[e.status];
        return `
          <div class="hstack" style="justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);gap:8px;">
            <div style="flex:1;">
              <b style="font-size:13px;">${esc(e.label)}</b>
              <div class="field-hint" style="margin:2px 0 0;">${esc(e.dica)} · janela: ${e.diasMin}–${e.diasMax} dias após o plantio</div>
              ${e.status!=="feito" && e.pendentes>0 ? `<div class="field-hint" style="margin-top:2px;">${e.pendentes} material(is) pendente(s)</div>` : ""}
            </div>
            <span class="badge ${s.cls}">${s.icon} ${s.label}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
/* ---------------------------------------------------------------
   6b) PLUVIOMETRIA DO CAMPO — lançamentos separados por dia de chuva
------------------------------------------------------------------*/
// Lançar chuva é liberado para qualquer consultor (é uma observação do
// tempo naquele dia, não um dado de propriedade do ensaio) — só remover um
// lançamento continua restrito a quem criou o campo, para evitar apagar
// dado de outra pessoa por engano.
function tplPluviometria(campo, opts){
  opts = opts || {};
  const chuvas = (campo.chuvas||[]).slice().sort((a,b)=> (a.data||'') < (b.data||'') ? 1 : -1);
  const total = chuvas.reduce((a,c)=>a+(num(c.mm)||0),0);
  const podeRemover = podeEditar(campo);
  const prefixoIds = opts.prefixoIds || '';
  return `
    <div class="card vstack" ${opts.semMargemTopo ? '' : 'style="margin-top:14px;"'}>
      <div class="hstack" style="justify-content:space-between;align-items:center;">
        <div class="section-title" style="margin-top:0;">🌧️ Pluviometria</div>
        <b style="font-size:15px;color:var(--green-dark);">${fmt(total,0)} mm acumulados</b>
      </div>
      <div class="field-hint" style="margin-bottom:4px;">Lance a chuva separadamente para cada dia que choveu neste campo. Qualquer consultor pode lançar.</div>
      <div id="${prefixoIds}listaChuvas">
        ${chuvas.length===0 ? `<div class="field-hint">Nenhum lançamento de chuva ainda.</div>` : chuvas.map((c,i)=>`
          <div class="hstack" style="justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);">
            <span style="font-size:13px;">${fmtDate(c.data)} — <b>${fmt(c.mm,0)} mm</b></span>
            ${podeRemover?`<button type="button" class="btn btn-sm btn-ghost" data-rmchuva="${esc(c.id)}" style="padding:2px 6px;color:var(--danger);">✕</button>`:''}
          </div>
        `).join('')}
      </div>
      <div class="grid2" style="margin-top:10px;">
        <div class="field"><label>Data</label><input type="date" id="${prefixoIds}pl_data" value="${todayISO()}"></div>
        <div class="field"><label>Chuva (mm)</label><input type="number" step="any" id="${prefixoIds}pl_mm" placeholder="Ex: 22"></div>
      </div>
      <button type="button" class="btn btn-sm btn-primary" id="${prefixoIds}btnAddChuva">+ Lançar chuva do dia</button>
    </div>
  `;
}

function wirePluviometria(campo, opts){
  opts = opts || {};
  const prefixoIds = opts.prefixoIds || '';
  const podeRemover = podeEditar(campo);
  if(podeRemover){
    document.querySelectorAll(`#${prefixoIds}listaChuvas [data-rmchuva]`).forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const chuvas = (campo.chuvas||[]).filter(c=> c.id !== btn.dataset.rmchuva);
        await salvarChuva(campo, chuvas);
        toast("Lançamento removido");
      });
    });
  }
  const btnAdd = document.getElementById(`${prefixoIds}btnAddChuva`);
  if(btnAdd) btnAdd.addEventListener('click', async ()=>{
    const data = document.getElementById(`${prefixoIds}pl_data`).value;
    const mm = num(document.getElementById(`${prefixoIds}pl_mm`).value);
    if(!data){ toast("Informe a data"); return; }
    if(isNaN(mm) || mm<0){ toast("Informe a chuva em mm"); return; }
    const chuvas = (campo.chuvas||[]).concat([{ id:uid(), data, mm }]);
    btnAdd.disabled = true;
    try{
      await salvarChuva(campo, chuvas);
      toast("Chuva lançada ✓");
    }catch(err){
      console.error(err);
      toast("Erro ao salvar — verifique sua conexão");
    }finally{
      if(document.getElementById(`${prefixoIds}btnAddChuva`)) document.getElementById(`${prefixoIds}btnAddChuva`).disabled = false;
    }
  });
}

/* ---------------------------------------------------------------
   6d) ABA "🌧️ Pluviometria" — acesso a TODAS as fazendas num só
   lugar, para lançar a chuva do dia sem precisar abrir cada campo.
------------------------------------------------------------------*/
function pluviometriaCampoMatchesBusca(campo){
  const t = (STATE.pluvBusca||"").trim().toLowerCase();
  if(!t) return true;
  const hay = [campo.fazenda, campo.produtor, campo.safra].join(' ').toLowerCase();
  return hay.includes(t);
}

function renderPluviometriaGeral(){
  const el = document.getElementById('view-pluviometria');
  const campos = STATE.campos
    .filter(pluviometriaCampoMatchesBusca)
    .slice()
    .sort((a,b)=> (a.fazenda||'').localeCompare(b.fazenda||''));
  const totalGeralMm = STATE.campos.reduce((acc,c)=> acc + (c.chuvas||[]).reduce((a,ch)=>a+(num(ch.mm)||0),0), 0);

  el.innerHTML = `
    <div class="detail-header">
      <div class="grow">
        <h1 style="margin-bottom:2px;">🌧️ Pluviometria</h1>
        <div class="campo-sub">Acesso a todas as fazendas — lance a chuva do dia direto daqui, sem precisar abrir cada campo. Qualquer consultor pode lançar.</div>
      </div>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <input id="pluvBuscaInput" placeholder="🔍 Buscar por fazenda ou produtor" value="${esc(STATE.pluvBusca)}">
    </div>
    ${STATE.campos.length>0 ? `<div class="field-hint" style="margin-bottom:12px;">${fmt(totalGeralMm,0)} mm acumulados somando todas as fazendas.</div>` : ''}
    ${campos.length===0 ? `<div class="empty-state">${STATE.campos.length===0 ? 'Nenhum campo cadastrado ainda.' : 'Nenhuma fazenda encontrada com essa busca.'}</div>` : `
      <div class="vstack" id="listaPluvCampos" style="gap:8px;">
        ${campos.map(campo=>{
          const aberto = STATE.pluvCampoAbertoId === campo.id;
          const total = (campo.chuvas||[]).reduce((a,c)=>a+(num(c.mm)||0),0);
          return `
            <div class="card" style="padding:12px;">
              <div class="hstack pluv-campo-toggle" data-pluvtoggle="${campo.id}" style="justify-content:space-between;align-items:center;cursor:pointer;">
                <div>
                  <b>${esc(campo.fazenda||'(sem fazenda)')}</b>
                  <div class="campo-sub">${esc(campo.produtor||'—')} · ${esc(campo.safra||'—')}</div>
                </div>
                <span class="hstack" style="gap:8px;align-items:center;">
                  <b style="font-size:14px;color:var(--green-dark);">${fmt(total,0)} mm</b>
                  <span>${aberto?'▲':'▼'}</span>
                </span>
              </div>
              ${aberto ? `<div style="margin-top:10px;" id="pluvFormWrap-${campo.id}"></div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  const buscaInput = document.getElementById('pluvBuscaInput');
  if(buscaInput){
    buscaInput.addEventListener('input', ()=>{
      STATE.pluvBusca = buscaInput.value;
      renderPluviometriaGeral();
      // mantém o foco e o cursor no campo de busca após o re-render
      const novo = document.getElementById('pluvBuscaInput');
      if(novo){ novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
    });
  }
  document.querySelectorAll('[data-pluvtoggle]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.pluvtoggle;
      STATE.pluvCampoAbertoId = STATE.pluvCampoAbertoId===id ? null : id;
      renderPluviometriaGeral();
    });
  });
  const campoAberto = campos.find(c=>c.id===STATE.pluvCampoAbertoId);
  if(campoAberto){
    const wrap = document.getElementById(`pluvFormWrap-${campoAberto.id}`);
    if(wrap){
      const prefixoIds = `pluv_${campoAberto.id}_`;
      wrap.innerHTML = tplPluviometria(campoAberto, { prefixoIds, semMargemTopo:true });
      wirePluviometria(campoAberto, { prefixoIds });
    }
  }
}

/* ---------------------------------------------------------------
   6c) RANKING DE PRODUTIVIDADE DENTRO DE UM ÚNICO CAMPO
------------------------------------------------------------------*/
function rankingCampo(campo){
  const materiais = materiaisAtivos(campo).filter(m=>m.colheita?.pesoColhidoKg);
  const linhas = materiais.map(m=>{
    const r = materialResumo(campo, m);
    return { nome: m.nome||'(sem nome)', scHa: r.produtividadeScHa, pmsG: r.pmsG, umidadePct: r.umidadePct, populacaoFinalHa: r.populacaoFinalHa };
  }).filter(l=> l.scHa!=='' && !isNaN(l.scHa));
  linhas.sort((a,b)=>b.scHa-a.scHa);
  return linhas;
}
function tplRankingCampo(campo){
  const linhas = rankingCampo(campo);
  if(linhas.length===0) return '';
  return `
    <div class="card vstack" style="margin-bottom:14px;">
      <div class="section-title" style="margin-top:0;">🏆 Ranking de produtividade deste campo</div>
      ${linhas.map((l,i)=>`
        <div class="hstack" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);">
          <span style="font-size:13px;"><b>${i+1}º</b> ${esc(l.nome)}</span>
          <b style="font-size:13px;color:var(--green-dark);">${fmt(l.scHa,1)} sc/ha</b>
        </div>
      `).join('')}
    </div>
  `;
}

function media(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : NaN; }
function desvioPadrao(arr, m){
  if(arr.length<2) return NaN;
  const mm = m ?? media(arr);
  const variancia = arr.reduce((a,b)=>a+Math.pow(b-mm,2),0)/(arr.length-1);
  return Math.sqrt(variancia);
}

async function adicionarAoCatalogo(nome){
  nome = String(nome||"").trim();
  if(!nome) return false;
  if(STATE.catalogoMateriais.some(n=>normNome(n)===normNome(nome))) return false;
  if(!STATE.db){
    STATE.catalogoMateriais.push(nome);
    STATE.catalogoMateriais.sort();
    renderAll();
    return true;
  }
  const ref = STATE.db.collection(CATALOGO_COLLECTION).doc(CATALOGO_DOC);
  await ref.set({ nomes: firebase.firestore.FieldValue.arrayUnion(nome) }, { merge:true });
  return true;
}

async function adicionarVariosAoCatalogo(nomes){
  const novos = [];
  const vistos = new Set(STATE.catalogoMateriais.map(n=>normNome(n)));
  nomes.forEach(nome=>{
    nome = String(nome||"").trim();
    if(!nome) return;
    const nn = normNome(nome);
    if(vistos.has(nn)) return;
    vistos.add(nn);
    novos.push(nome);
  });
  if(novos.length===0) return 0;
  if(!STATE.db){
    STATE.catalogoMateriais = STATE.catalogoMateriais.concat(novos).sort();
    renderAll();
    return novos.length;
  }
  const ref = STATE.db.collection(CATALOGO_COLLECTION).doc(CATALOGO_DOC);
  await ref.set({ nomes: firebase.firestore.FieldValue.arrayUnion(...novos) }, { merge:true });
  return novos.length;
}

/* ---- Importar materiais do protocolo a partir de um PDF ----
   Extrai o texto embutido no PDF (não faz OCR — não funciona em PDF que é
   uma imagem escaneada) e reconstrói linhas agrupando os itens de texto por
   posição vertical (Y) na página, já que a getTextContent() do pdf.js não
   entrega linhas prontas de forma confiável em todo PDF. */
async function extrairLinhasPDF(arrayBuffer){
  if(typeof pdfjsLib==="undefined"){
    throw new Error("Biblioteca de leitura de PDF não carregou — verifique sua conexão");
  }
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const linhas = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const porY = new Map();
    content.items.forEach(item=>{
      if(!item.str || !item.str.trim()) return;
      const y = Math.round(item.transform[5]);
      // agrupa posições de Y muito próximas (mesma linha visual) numa única chave
      let chave = y;
      for(const k of porY.keys()){ if(Math.abs(k-y)<=2){ chave = k; break; } }
      if(!porY.has(chave)) porY.set(chave, []);
      porY.get(chave).push(item);
    });
    const ys = Array.from(porY.keys()).sort((a,b)=>b-a);
    ys.forEach(y=>{
      const itens = porY.get(y).sort((a,b)=>a.transform[4]-b.transform[4]);
      // Divide a mesma linha em "células" quando há um espaço horizontal
      // grande entre um item e o próximo — sinal comum de colunas lado a
      // lado (ex: lista de materiais em 2 colunas), para não juntar duas
      // colunas numa linha só.
      let celulas = [], atual = [], xFimAnterior = null;
      itens.forEach(item=>{
        const xIni = item.transform[4];
        if(xFimAnterior!==null && (xIni - xFimAnterior) > 25){
          celulas.push(atual);
          atual = [];
        }
        atual.push(item.str);
        xFimAnterior = xIni + (item.width || item.str.length*5);
      });
      if(atual.length) celulas.push(atual);
      celulas.forEach(cel=>{
        const texto = cel.join(' ').replace(/\s+/g,' ').trim();
        if(texto) linhas.push(texto);
      });
    });
  }
  return linhas;
}

// Heurística só para decidir a marcação inicial (✓/✗) de cada linha na tela
// de revisão — nunca filtra nada de verdade, é sempre o consultor quem
// confirma a lista final antes de importar.
function pareceNomeDeMaterial(linha){
  const t = linha.trim();
  if(t.length<2 || t.length>50) return false;
  if(/^\d+$/.test(t)) return false; // número de página isolado
  if(/^(p[aá]gina|protocolo|safra|cultivar|materia|observ|total|data)/i.test(t)) return false;
  const palavras = t.split(/\s+/);
  if(palavras.length>6) return false; // provável frase/parágrafo, não nome de cultivar
  return true;
}

function obterDescontoTabela(umidadePct, impurezaPct){
  const u = num(umidadePct), i = num(impurezaPct);
  if(isNaN(u)) return NaN;
  const iEfetivo = isNaN(i) ? 0 : i;
  const linhas = STATE.tabelaDesconto||[];
  const match = linhas.find(l=> u>=l.umidadeMin && u<=l.umidadeMax && iEfetivo>=l.impurezaMin && iEfetivo<=l.impurezaMax);
  return match ? match.descontoPct : NaN;
}

/* ---- Fotos de sanidade — guardadas numa coleção à parte (fotos_urtigao) para
   não estourar o limite de 1MB por documento do Firestore, já que um campo
   pode ter ~20 materiais com várias avaliações cada ---- */
function comprimirImagem(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error("Não foi possível ler a imagem"));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error("Não foi possível ler o arquivo"));
    reader.readAsDataURL(file);
  });
}

async function salvarFotosSanidade(base64Array, meta){
  // Retorna referências para guardar na avaliação: { id } quando salva no
  // Firestore (fotos_urtigao), ou { base64 } em modo local (sem Firebase).
  const refs = [];
  for(const base64 of base64Array){
    if(!STATE.db){
      refs.push({ base64 });
      continue;
    }
    const doc = await STATE.db.collection(FOTOS_COLLECTION).add({
      base64,
      campoId: meta.campoId||null,
      materialId: meta.materialId||null,
      consultor: STATE.consultor||null,
      criadoEm: new Date().toISOString()
    });
    refs.push({ id: doc.id });
  }
  return refs;
}

async function buscarFotoBase64(ref){
  if(ref.base64) return ref.base64;
  if(!ref.id) return null;
  if(STATE.fotoCache[ref.id]) return STATE.fotoCache[ref.id];
  if(!STATE.db) return null;
  try{
    const doc = await STATE.db.collection(FOTOS_COLLECTION).doc(ref.id).get();
    const base64 = doc.exists ? doc.data().base64 : null;
    if(base64) STATE.fotoCache[ref.id] = base64;
    return base64;
  }catch(e){
    console.error("Erro ao buscar foto:", e);
    return null;
  }
}

function blankCampo(){

  return {
    consultor: STATE.consultor,
    safra: STATE.safraAtual,
    fazenda: "",
    produtor: "",
    dataPlantio: "",
    lat: null,
    lng: null,
    adubacaoFormulacao: "",
    adubacaoDose: null,
    espacamentoCm: null,
    sementesPorMetroPadrao: null,
    culturaAntecessora: "",
    culturaAntecessoraOutra: "",
    potencialProdutivo: "",
    chuvas: [],
    observacoes: "",
    createdAt: now,
    updatedAt: now,
    materiais: []
  };
}

async function criarCampo(dadosIniciais){
  const campo = Object.assign(blankCampo(), dadosIniciais||{});
  if(!STATE.db){
    // modo local sem Firebase configurado — guarda só na memória/sessão
    campo.id = uid();
    STATE.campos.unshift(campo);
    renderAll();
    return campo.id;
  }
  const ref = await STATE.db.collection(FIRESTORE_COLLECTION).add(campo);
  return ref.id;
}

function normNome(n){ return String(n||"").trim().toLowerCase(); }
function podeEditar(campo){
  return campo && normNome(campo.consultor) === normNome(STATE.consultor);
}

// Grava só o array de chuvas — deliberadamente SEM a trava de podeEditar(),
// já que qualquer consultor pode registrar a chuva do dia em qualquer
// campo (é uma observação do tempo, não um dado do ensaio de propriedade
// de quem cadastrou o campo).
async function salvarChuva(campo, chuvas){
  const idx = STATE.campos.findIndex(c=>c.id===campo.id);
  if(idx===-1) return;
  const alvo = STATE.campos[idx];
  const patch = { chuvas, updatedAt: new Date().toISOString() };
  if(!STATE.db){
    Object.assign(alvo, patch);
    renderAll();
    return;
  }
  await STATE.db.collection(FIRESTORE_COLLECTION).doc(campo.id).update(patch);
}

async function salvarCampo(id, patch){
  const idx = STATE.campos.findIndex(c=>c.id===id);
  if(idx===-1) return;
  const campo = STATE.campos[idx];
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — edição bloqueada.");
    return;
  }
  patch.updatedAt = new Date().toISOString();
  if(!STATE.db){
    Object.assign(campo, patch);
    renderAll();
    return;
  }
  await STATE.db.collection(FIRESTORE_COLLECTION).doc(id).update(patch);
}

async function salvarMaterial(campo, materialId, patch){
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — edição bloqueada.");
    return;
  }
  const materiais = (campo.materiais||[]).map(m => m.id===materialId ? Object.assign({}, m, patch) : m);
  await salvarCampo(campo.id, { materiais });
}

async function excluirCampo(id){
  const campo = STATE.campos.find(c=>c.id===id);
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — exclusão bloqueada.");
    return;
  }
  if(!STATE.db){
    STATE.campos = STATE.campos.filter(c=>c.id!==id);
    STATE.telaAtual = "dashboard";
    renderAll();
    return;
  }
  await STATE.db.collection(FIRESTORE_COLLECTION).doc(id).delete();
  STATE.telaAtual = "dashboard";
  renderAll();
}

async function excluirMaterial(campo, materialId){
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — exclusão bloqueada.");
    return;
  }
  const materiais = (campo.materiais||[]).filter(m=>m.id!==materialId);
  await salvarCampo(campo.id, { materiais });
  voltarCampo();
}

function initGate(){
  const saved = loadConsultorLocal();
  if(saved && saved.nome){
    STATE.consultor = saved.nome;
    STATE.safraAtual = saved.safra || "2025/26";
    showApp();
    return;
  }
  document.getElementById('gateBtn').addEventListener('click', onGateSubmit);
  document.getElementById('gateName').addEventListener('keydown', e=>{ if(e.key==='Enter') onGateSubmit(); });
}
function onGateSubmit(){
  const nome = document.getElementById('gateName').value.trim();
  const safra = document.getElementById('gateSafra').value.trim() || "2025/26";
  if(!nome){ toast("Informe seu nome para continuar"); return; }
  STATE.consultor = nome;
  STATE.safraAtual = safra;
  saveConsultorLocal({ nome, safra });
  showApp();
}
function showApp(){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('consultorLabel').textContent = STATE.consultor;
  document.getElementById('trocarConsultorBtn').addEventListener('click', trocarConsultor);
  document.getElementById('fabNovo').addEventListener('click', abrirNovoCampo);

    btn.addEventListener('click', ()=>{
      const tab = btn.dataset.maintab;

      else voltarDashboard();
    });
  });
  initFirestore();
  renderAll();
}
function trocarConsultor(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  location.reload();
}

------------------------------------------------------------------*/
function renderAll(){
  if(document.getElementById('app').hidden) return;
  const dash = document.getElementById('view-dashboard');
  const campoView = document.getElementById('view-campo');
  const matView = document.getElementById('view-material');
  const lancView = document.getElementById('view-lancamento');
  const pluvView = document.getElementById('view-pluviometria');
  dash.hidden = STATE.telaAtual !== "dashboard";
  campoView.hidden = STATE.telaAtual !== "campo";
  matView.hidden = STATE.telaAtual !== "material";
  lancView.hidden = STATE.telaAtual !== "lancamento";
  pluvView.hidden = STATE.telaAtual !== "pluviometria";
  // Views escondidas são esvaziadas para evitar IDs duplicados no DOM
  // (ex: #m_sementes existe tanto na aba de material quanto no lançamento em lote).
  [dash, campoView, matView, lancView, pluvView].forEach(v=>{ if(v.hidden) v.innerHTML = ""; });
  document.getElementById('fabNovo').hidden = STATE.telaAtual !== "dashboard";
  const mainTabDash = document.querySelector('#mainTabs [data-maintab="dashboard"]');
  const mainTabLanc = document.querySelector('#mainTabs [data-maintab="lancamento"]');
  const mainTabPluv = document.querySelector('#mainTabs [data-maintab="pluviometria"]');
  if(mainTabDash) mainTabDash.classList.toggle('active', STATE.telaAtual !== "lancamento" && STATE.telaAtual !== "pluviometria");
  if(mainTabLanc) mainTabLanc.classList.toggle('active', STATE.telaAtual === "lancamento");
  if(mainTabPluv) mainTabPluv.classList.toggle('active', STATE.telaAtual === "pluviometria");
  if(STATE.telaAtual === "dashboard") renderDashboard();
  else if(STATE.telaAtual === "campo") renderCampoDetail();
  else if(STATE.telaAtual === "material") renderMaterialDetail();
  else if(STATE.telaAtual === "lancamento") renderLancamento();
  else if(STATE.telaAtual === "pluviometria") renderPluviometriaGeral();
}

/* ---------------------------------------------------------------
   7) DASHBOARD (lista de CAMPOS / locais)
------------------------------------------------------------------*/
function materiaisAtivos(campo){
  return (campo.materiais||[]).filter(m=>m.status!=='excluido');
}
function materiaisExcluidos(campo){
  return (campo.materiais||[]).filter(m=>m.status==='excluido');
}
function areaTotalCampo(campo){
  let total = 0;
  materiaisAtivos(campo).forEach(m=>{
    const larg = calcLarguraM(m.numeroLinhas, campo.espacamentoCm);
    const a = calcAreaHa(m.comprimentoM, larg);
    if(!isNaN(a)) total += a;
  });
  return total;
}

function getSituacaoCampo(campo){
  const materiais = materiaisAtivos(campo);
  if(materiais.length===0) return { key:"sem_materiais", label:"Sem materiais", cls:"badge-implantacao" };
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;
  if(colhidos===materiais.length) return { key:"completo", label:"Colheita completa", cls:"badge-colheita" };
  if(colhidos>0) return { key:"andamento", label:`${colhidos}/${materiais.length} colhidos`, cls:"badge-dev" };
  return { key:"andamento", label:`0/${materiais.length} colhidos`, cls:"badge-implantacao" };
}

function uniqueVals(field){
  const set = new Set();
  STATE.campos.forEach(c=>{ if(c[field]) set.add(c[field]); });
  return Array.from(set).sort();
}
function uniqueMaterialNames(){
  if(STATE.catalogoMateriais.length) return STATE.catalogoMateriais.slice().sort();
  const set = new Set();
  STATE.campos.forEach(c=>(c.materiais||[]).forEach(m=>{ if(m.nome) set.add(m.nome); }));
  return Array.from(set).sort();
}

function campoMatchesFiltro(campo){
  const f = STATE.filtro;
  if(f.fazenda && campo.fazenda!==f.fazenda) return false;
  if(f.produtor && campo.produtor!==f.produtor) return false;
  if(f.safra && campo.safra!==f.safra) return false;
  if(f.material && !materiaisAtivos(campo).some(m=>m.nome===f.material)) return false;
  if(f.situacao && getSituacaoCampo(campo).key!==f.situacao) return false;
  if(f.potencial && campo.potencialProdutivo!==f.potencial) return false;
  if(f.plantioDe && campo.dataPlantio && campo.dataPlantio < f.plantioDe) return false;
  if(f.plantioAte && campo.dataPlantio && campo.dataPlantio > f.plantioAte) return false;
  if(f.texto){
    const t = f.texto.toLowerCase();
    const nomesMateriais = materiaisAtivos(campo).map(m=>m.nome).join(' ');
    const hay = [campo.fazenda,campo.produtor,campo.consultor,nomesMateriais].join(' ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}

function campoCardHTML(campo){
  const materiais = materiaisAtivos(campo);
  const excluidos = materiaisExcluidos(campo).length;
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;
  const progress = materiais.length ? Math.round(colhidos/materiais.length*100) : 3;
  const situacao = getSituacaoCampo(campo);
  const area = areaTotalCampo(campo);
  const atrasado = temEtapaAtrasada(campo);
  return `
    <div class="campo-card" data-id="${campo.id}">
      <div class="campo-top">
        <div>
          <div class="campo-material">${esc(campo.fazenda||'(sem fazenda)')}</div>
          <div class="campo-sub">${esc(campo.produtor||'—')} · ${esc(campo.safra||'—')}</div>
        </div>
        <span class="hstack" style="gap:4px;flex:none;">
          ${atrasado ? `<span class="badge badge-danger">⚠️ Avaliação atrasada</span>` : ""}
          <span class="badge ${situacao.cls}">${situacao.label}</span>
        </span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="campo-meta">
        <span>👤 ${esc(campo.consultor||'—')}</span>
        <span>🌱 ${materiais.length} material(is)</span>
        ${area>0 ? `<span>📐 ${fmtAreaStat(area)}</span>` : ""}
        ${campo.dataPlantio ? `<span>🗓️ ${fmtDate(campo.dataPlantio)}</span>` : ""}
        ${excluidos>0 ? `<span>🚫 ${excluidos} sem semente</span>` : ""}
      </div>
    </div>
  `;
}

function renderCampoDetail(){
  const campo = STATE.campos.find(c=>c.id===STATE.campoAbertoId);
  const el = document.getElementById('view-campo');
  if(!campo){
    el.innerHTML = `<div class="empty-state">Campo não encontrado.</div>`;
    return;
  }
  const editavel = podeEditar(campo);
  const materiais = materiaisAtivos(campo);
  const excluidos = materiaisExcluidos(campo);
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;

  el.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-sm" id="btnVoltar">← Voltar</button>
      <h1>${esc(campo.fazenda || 'Novo campo')}</h1>
      ${editavel ? `<button class="btn btn-sm btn-danger" id="btnExcluir">Excluir</button>` : `<span class="badge badge-implantacao">Somente leitura</span>`}
    </div>
    ${!editavel ? `<div class="field-hint" style="margin-bottom:10px;">Este campo foi criado por <b>${esc(campo.consultor)}</b> — apenas ele(a) pode editar. Você pode visualizar os dados.</div>` : ""}

    <div id="pluviometriaWrap"></div>

    <div class="hstack" style="justify-content:space-between;margin:20px 0 8px;">
      <div class="section-title" style="margin:0;">Materiais (${materiais.length}${materiais.length?` · ${colhidos} colhidos`:''}${excluidos.length?` · ${excluidos.length} sem semente`:''})</div>
    </div>
    <div class="hstack" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      ${editavel ? `<button class="btn btn-sm btn-primary grow" id="btnSelecionarMateriais">✓ Selecionar materiais do protocolo</button>` : ""}
      <button class="btn btn-sm" id="btnRelatorioCampo">📄 Relatório do campo (PDF)</button>
    </div>
    <div id="listaMateriais"></div>
  `;

  document.getElementById('btnVoltar').addEventListener('click', voltarDashboard);
  if(editavel){
    document.getElementById('btnExcluir').addEventListener('click', ()=>{
      if(confirm(`Excluir o campo "${campo.fazenda||'sem nome'}" e todos os seus materiais? Essa ação não pode ser desfeita.`)){
        excluirCampo(campo.id);
      }
    });
    document.getElementById('btnSelecionarMateriais').addEventListener('click', ()=>abrirModalSelecionarMateriais(campo));
  }
  document.getElementById('btnRelatorioCampo').addEventListener('click', ()=>abrirModalRelatorioCampo(campo));

  document.getElementById('dadosLocalWrap').innerHTML = tplDadosLocal(campo, editavel);
  wireDadosLocal(campo, editavel);

  document.getElementById('pluviometriaWrap').innerHTML = tplPluviometria(campo);
  wirePluviometria(campo);

  const listaEl = document.getElementById('listaMateriais');
  if(materiais.length===0 && excluidos.length===0){
    listaEl.innerHTML = `<div class="empty-state"><div class="big">🌾</div>Nenhum material selecionado ainda neste campo. Toque em "Selecionar materiais do protocolo" para começar.</div>`;
  }else{
    listaEl.innerHTML = materiais.map(m=>materialRowHTML(m, campo.espacamentoCm)).join('') + excluidos.map(m=>materialRowHTML(m, campo.espacamentoCm)).join('');
    listaEl.querySelectorAll('.campo-card:not([data-excluido])').forEach(row=>{
      row.addEventListener('click', ()=>abrirMaterial(row.dataset.matid));
    });
    if(editavel){
      listaEl.querySelectorAll('[data-reincluir]').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          e.stopPropagation();
          await definirStatusMaterialCampo(campo, btn.dataset.reincluir, 'ok');
          toast("Material reincluído ✓");
        });
      });
    }
  }
}

function wireDadosLocal(campo, editavel){
  STATE.tempCoords = (campo.lat!=null) ? { lat:campo.lat, lng:campo.lng } : null;
  if(STATE.tempCoords) initMiniMap(STATE.tempCoords.lat, STATE.tempCoords.lng);
  if(!editavel) return;
  const btnGps = document.getElementById('btnBaterPonto');
  if(btnGps) btnGps.addEventListener('click', baterPonto);
  const culturaSel = document.getElementById('i_culturaAntecessora');
  const wrapOutra = document.getElementById('wrapCulturaOutra');
  if(culturaSel) culturaSel.addEventListener('change', ()=>{
    if(wrapOutra) wrapOutra.style.display = culturaSel.value==='Outros' ? '' : 'none';
  });
  document.getElementById('btnSalvarLocal').addEventListener('click', async ()=>{
    const patch = {
      fazenda: document.getElementById('i_fazenda').value.trim(),
      produtor: document.getElementById('i_produtor').value.trim(),
      safra: document.getElementById('i_safra').value.trim(),
      dataPlantio: document.getElementById('i_data').value,
      lat: STATE.tempCoords?.lat ?? null,
      lng: STATE.tempCoords?.lng ?? null,
      adubacaoFormulacao: document.getElementById('i_adubForm').value.trim(),
      adubacaoDose: num(document.getElementById('i_adubDose').value) || null,
      espacamentoCm: num(document.getElementById('i_espac').value) || null,
      sementesPorMetroPadrao: num(document.getElementById('i_sementesPadrao').value) || null,
      culturaAntecessora: document.getElementById('i_culturaAntecessora').value,
      culturaAntecessoraOutra: document.getElementById('i_culturaAntecessoraOutra').value.trim(),
      potencialProdutivo: document.getElementById('i_potencialProdutivo').value,
      observacoes: document.getElementById('i_obs').value.trim()
    };
    if(!patch.fazenda){ toast("Informe a fazenda"); return; }
    await salvarCampo(campo.id, patch);
    toast("Dados do local salvos ✓");
  });
}

function baterPonto(){
  if(!navigator.geolocation){ toast("Geolocalização não disponível neste dispositivo/navegador"); return; }
  const seguro = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if(!seguro){
    toast("Localização só funciona em HTTPS — abra o link publicado (GitHub Pages), não o arquivo local");
    return;
  }
  const btn = document.getElementById('btnBaterPonto');
  if(btn){ btn.disabled = true; btn.textContent = "Obtendo..."; }
  toast("Obtendo localização... isso pode levar alguns segundos a céu aberto");

  const onErro = (err)=>{
    if(btn){ btn.disabled = false; btn.textContent = "Bater ponto"; }
    console.error(err);
    const msgs = {
      1: "Permissão de localização negada — ative o GPS/localização para o navegador nas configurações do celular e tente de novo.",
      2: "Não foi possível determinar a localização agora — verifique se o GPS do celular está ligado e tente novamente a céu aberto.",
      3: "Tempo esgotado esperando o GPS — sinal fraco (comum embaixo de galpão/árvore). Tente novamente a céu aberto; pode levar até 30s no primeiro ponto do dia."
    };
    toast(msgs[err && err.code] || "Não foi possível obter a localização — verifique a permissão de GPS");
  };

  const onSucesso = (pos)=>{
    if(btn){ btn.disabled = false; btn.textContent = "Bater ponto"; }
    STATE.tempCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const txt = document.getElementById('i_localTexto');
    if(txt) txt.textContent = `${fmt(STATE.tempCoords.lat,5)}, ${fmt(STATE.tempCoords.lng,5)}`;
    initMiniMap(STATE.tempCoords.lat, STATE.tempCoords.lng);
    toast("Ponto marcado ✓");
  };

  // Primeira tentativa: alta precisão, tempo maior (GPS puro pode demorar a "esquentar" no campo).
  navigator.geolocation.getCurrentPosition(onSucesso, (err)=>{
    if(err && err.code === 3){
      // Timeout na alta precisão: tenta de novo com precisão normal (usa rede/Wi-Fi/último fix), mais rápido.
      toast("Sinal de GPS fraco — tentando localização aproximada...");
      navigator.geolocation.getCurrentPosition(onSucesso, onErro, { enableHighAccuracy:false, timeout:20000, maximumAge:60000 });
    } else {
      onErro(err);
    }
  }, { enableHighAccuracy:true, timeout:25000, maximumAge:0 });
}

function initMiniMap(lat, lng){
  const box = document.getElementById('miniMap');
  if(!box || typeof L === "undefined") return;
  box.style.display = "block";
  setTimeout(()=>{
    if(STATE.miniMapInstance){ STATE.miniMapInstance.remove(); STATE.miniMapInstance=null; }
    STATE.miniMapInstance = L.map('miniMap', { zoomControl:false, attributionControl:false }).setView([lat,lng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.miniMapInstance);
    L.marker([lat,lng]).addTo(STATE.miniMapInstance);
  }, 30);
}

function getEtapaMaterial(mat){
  const co = mat.colheita||{}, ei = mat.estandeInicial||{};
  const eng = mat.engalhamento||{}, san = mat.sanidadeAltura||{};
  if(co.pesoColhidoKg) return { key:"colheita", label:"Colheita", cls:"badge-colheita", progress:100 };
  if(san.nota!=null) return { key:"sanidadeAltura", label:"Sanidade e altura", cls:"badge-dev", progress:70 };
  if(eng.nota!=null) return { key:"engalhamento", label:"Engalhamento", cls:"badge-dev", progress:55 };
  if(ei.plantasContadas) return { key:"estande", label:"Estande inicial", cls:"badge-estande", progress:40 };
  if(mat.comprimentoM) return { key:"parcela", label:"Parcela definida", cls:"badge-implantacao", progress:20 };
  return { key:"novo", label:"Novo", cls:"badge-implantacao", progress:5 };
}

async function confirmarAddCatalogo(campo){
  const nome = document.getElementById('novoCatalogoNome').value.trim();
  if(!nome){ toast("Digite um nome"); return; }
  const added = await adicionarAoCatalogo(nome);
  if(!added){ toast("Esse material já está no catálogo"); return; }
  await definirStatusMaterialCampo(campo, nome, 'ok');
  toast("Material adicionado ✓");
  const campoAtual = STATE.campos.find(c=>c.id===campo.id) || campo;
  abrirModalSelecionarMateriais(campoAtual);
}

async function definirStatusMaterialCampo(campo, nome, status){
  if(!podeEditar(campo)){ toast("Sem permissão"); return; }
  let materiais = campo.materiais||[];
  const idx = materiais.findIndex(m=>normNome(m.nome)===normNome(nome));
  if(idx===-1){
    materiais = materiais.concat([{ id:uid(), nome, status, sementesPorMetro: campo.sementesPorMetroPadrao ?? null, estandeInicial:{}, colheita:{} }]);
  }else{
    materiais = materiais.map((m,i)=> i===idx ? Object.assign({}, m, { status }) : m);
  }
  await salvarCampo(campo.id, { materiais });
}

function avancarProximoMaterialLanc(campo, etapaKey, materialIdRecemSalvo){
  // Só atua dentro do lançamento em lote (aba Avaliações) — nas abas normais
  // de um material isolado, não existe "próximo material" para avançar.
  if(STATE.telaAtual !== "lancamento") return;
  const mats = materiaisAtivos(campo);
  const idx = mats.findIndex(m=>m.id===materialIdRecemSalvo);
  const depois = mats.slice(idx+1).find(m=>!tabTemDadosMaterial(m, etapaKey));
  const antes = mats.slice(0, Math.max(idx,0)).find(m=>!tabTemDadosMaterial(m, etapaKey));
  const proximo = depois || antes;
  if(!proximo){
    STATE.lancMaterialAberto = null;
    toast("Todos os materiais desta etapa foram lançados ✓");
  } else {
    STATE.lancMaterialAberto = proximo.id;
  }
  STATE.fotosNovas = [];
  renderLancamento();
}
function tabTemDadosMaterial(mat, key){
  if(key==="estande") return !!mat.estandeInicial?.plantasContadas;
  if(key==="engalhamento") return mat.engalhamento?.nota!=null;
  if(key==="sanidadeAltura") return mat.sanidadeAltura?.nota!=null;
  if(key==="colheita") return !!mat.colheita?.pesoColhidoKg;
  return false;
}

function renderTabContentMaterial(campo, mat, editavel){
  const wrap = document.getElementById('tabContentMat');
  if(STATE.tabAtiva==="estande") wrap.innerHTML = tplEstandeMaterial(campo, mat, editavel);
  else if(STATE.tabAtiva==="engalhamento") wrap.innerHTML = tplEngalhamento(mat, editavel);
  else if(STATE.tabAtiva==="sanidadeAltura") wrap.innerHTML = tplSanidadeAltura(mat, editavel);
  else if(STATE.tabAtiva==="colheita") wrap.innerHTML = tplColheita(campo, mat, editavel);
  wireTabEventsMaterial(campo, mat, editavel);
}

      </div>

/* ---------- TAB 4 — COLHEITA ---------- */
function tplColheita(campo, mat, editavel){
  const co = mat.colheita||{};
  const sf = co.standFinal||{};
  const dis = editavel?"":"disabled";
  const area = calcAreaHa(co.comprimentoM, co.larguraM);
  const metodo = co.metodoCorrecao || 'formula';
  const descontoTabela = obterDescontoTabela(co.umidadePct, co.impurezaPct);
  const corrigido = metodo==='tabela'
    ? (!isNaN(descontoTabela) ? calcPesoComDesconto(co.pesoColhidoKg, descontoTabela) : NaN)
    : calcPesoCorrigido(co.pesoColhidoKg, co.umidadePct, UMIDADE_BASE_PADRAO);
  const kgHa = (!isNaN(corrigido) && area) ? corrigido/area : NaN;
  const scHa = !isNaN(kgHa) ? kgHa/60 : NaN;
  const plantasHaFinal = calcPlantasHa(sf.plantasContadas, sf.metrosAvaliados, campo.espacamentoCm);
  const ei = mat.estandeInicial||{};
  const plantasHaInicial = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
  const pctSobrevivencia = (!isNaN(plantasHaFinal) && plantasHaInicial) ? (plantasHaFinal/plantasHaInicial*100) : NaN;
  const labelCorrigido = metodo==='tabela' ? 'Peso corrigido (tabela de desconto)' : `Peso corrigido a ${UMIDADE_BASE_PADRAO}% umidade`;
  return `
    <div class="card vstack">
      <div class="section-title" style="margin-top:0;">Área colhida</div>
      <div class="grid2">
        <div class="field"><label>Data da colheita</label><input ${dis} type="date" id="c_data" value="${esc(co.data||todayISO())}"></div>
        <div class="field"><label>Umidade (%)</label><input ${dis} type="number" step="any" id="c_umid" value="${co.umidadePct??''}" placeholder="Ex: 14.5"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Comprimento da área colhida (m)</label><input ${dis} type="number" step="any" id="c_comp" value="${co.comprimentoM??''}" placeholder="Ex: 10"></div>
        <div class="field"><label>Largura da área colhida (m)</label><input ${dis} type="number" step="any" id="c_larg" value="${co.larguraM??''}" placeholder="Ex: 4"></div>
      </div>

      <div class="section-title">Peso e qualidade</div>
      <div class="grid2">
        <div class="field"><label>Peso colhido (kg)</label><input ${dis} type="number" step="any" id="c_peso" value="${co.pesoColhidoKg??''}" placeholder="Ex: 32.4"></div>
        <div class="field"><label>PMS — peso de mil sementes (g)</label><input ${dis} type="number" step="any" id="c_pms" value="${co.pmsG??''}" placeholder="Ex: 165"></div>
      </div>
      <div class="field" style="max-width:260px;"><label>Impureza (%, opcional)</label><input ${dis} type="number" step="any" id="c_impureza" value="${co.impurezaPct??''}" placeholder="Ex: 1.2"></div>

      <div class="section-title">Correção do peso</div>
      <div class="hstack" style="justify-content:space-between;align-items:center;">
        <div class="field" style="flex:1;margin-bottom:0;">
          <label>Método de correção</label>
          <select ${dis} id="c_metodoCorrecao">
            <option value="formula" ${metodo==='formula'?'selected':''}>Fórmula padrão (${UMIDADE_BASE_PADRAO}% de umidade)</option>
            <option value="tabela" ${metodo==='tabela'?'selected':''}>Tabela de desconto (umidade × impureza)</option>
          </select>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" id="btnAbrirTabelaDesconto" style="margin-top:18px;">⚖️ Tabela</button>
      </div>
      <div class="field-hint" id="avisoSemFaixaDesconto" style="color:var(--danger);${(metodo==='tabela'&&isNaN(descontoTabela))?'':'display:none;'}">⚠️ Nenhuma faixa da tabela de desconto corresponde a essa umidade/impureza — toque em "⚖️ Tabela" para cadastrar/conferir as faixas, ou use a fórmula padrão.</div>

      <div class="calc-box">
        <div class="calc-item"><b id="calcAreaColhida">${fmtArea(area)}</b><span>Área colhida</span></div>
        <div class="calc-item"><b id="calcPesoCorrigido">${!isNaN(corrigido)?fmt(corrigido,1)+' kg':'—'}</b><span id="labelPesoCorrigido">${labelCorrigido}</span></div>
        <div class="calc-item"><b id="calcKgHa">${!isNaN(kgHa)?fmt(kgHa,0)+' kg/ha':'—'}</b><span>Produtividade</span></div>
        <div class="calc-item"><b id="calcScHa">${!isNaN(scHa)?fmt(scHa,1)+' sc/ha':'—'}</b><span>Produtividade (sc de 60kg/ha)</span></div>
      </div>

      <div class="section-title">Estande final</div>
      <div class="field-hint">Mesma lógica da contagem inicial — conte as plantas num trecho medido, pouco antes da colheita.</div>
      <div class="grid2">
        <div class="field"><label>Metros lineares avaliados</label><input ${dis} type="number" step="any" id="c_metrosFinal" value="${sf.metrosAvaliados??''}" placeholder="Ex: 5"></div>
        <div class="field"><label>Plantas contadas no trecho</label><input ${dis} type="number" step="any" id="c_plantasFinal" value="${sf.plantasContadas??''}" placeholder="Ex: 28"></div>
      </div>
      <div class="calc-box">
        <div class="calc-item"><b id="calcPlantasHaFinal">${!isNaN(plantasHaFinal)?fmtInt(plantasHaFinal)+'/ha':'—'}</b><span>População final</span></div>
        <div class="calc-item"><b id="calcSobrevivencia">${!isNaN(pctSobrevivencia)?fmt(pctSobrevivencia,0)+'%':'—'}</b><span>Sobrevivência até colheita (vs. estande inicial)</span></div>
      </div>
      <div class="field-hint" id="avisoColheitaSobrevivencia" style="color:var(--danger);${avisoDivergenciaPct(pctSobrevivencia,'sobrevivencia')?'':'display:none;'}">${avisoDivergenciaPct(pctSobrevivencia,'sobrevivencia')}</div>

      <div class="field">
        <label>Acamamento (nota 1 = totalmente acamado/ruim · 5 = ereto/excelente)</label>
        <div class="chip-select" id="c_acamamento">${NOTA_QUALI.map(n=>`<button type="button" ${dis} class="chip-opt ${co.acamamentoNota===n.v?'sel':''}" data-val="${n.v}">${n.v} · ${n.label}</button>`).join('')}</div>
      </div>

      <div class="field"><label>Observações da colheita</label><textarea ${dis} id="c_obs" placeholder="Condições no momento da colheita, perdas, etc.">${esc(co.observacoes||'')}</textarea></div>

      ${editavel?`<button class="btn btn-primary btn-block" id="btnSalvarColheita" style="margin-top:6px;">Salvar colheita</button>`:''}
    </div>
  `;
}

function wireTabEventsMaterial(campo, mat, editavel){
  if(STATE.tabAtiva==="estande") wireEstandeMaterial(campo, mat, editavel);
  else if(STATE.tabAtiva==="engalhamento") wireEngalhamento(campo, mat, editavel);
  else if(STATE.tabAtiva==="sanidadeAltura") wireSanidadeAltura(campo, mat, editavel);
  else if(STATE.tabAtiva==="colheita") wireColheitaMaterial(campo, mat, editavel);

function wireEstandeMaterial(campo, mat, editavel){
  const recalc = ()=>{
    const sementes = document.getElementById('m_sementes').value;
    const comp = document.getElementById('m_comp').value;
    const linhas = document.getElementById('m_linhas').value;
    const metros = document.getElementById('m_metros').value;
    const plantas = document.getElementById('m_plantas').value;
    const larguraCalc = calcLarguraM(linhas, campo.espacamentoCm);
    const area = calcAreaHa(comp, larguraCalc);
    const popTeorica = calcPopTeoricaHa(sementes, campo.espacamentoCm);
    const plantasHa = calcPlantasHa(plantas, metros, campo.espacamentoCm);
    const pct = (!isNaN(plantasHa) && popTeorica) ? (plantasHa/popTeorica*100) : NaN;
    document.getElementById('calcLarguraMat').textContent = !isNaN(larguraCalc)?fmt(larguraCalc,2)+' m':'—';
    document.getElementById('calcAreaMat').textContent = fmtArea(area);
    document.getElementById('calcPopTeoricaMat').textContent = popTeorica?fmtInt(popTeorica)+'/ha':'—';
    document.getElementById('calcPlantasHaMat').textContent = !isNaN(plantasHa)?fmtInt(plantasHa)+'/ha':'—';
    document.getElementById('calcPctMat').textContent = !isNaN(pct)?fmt(pct,0)+'%':'—';
    const aviso = document.getElementById('avisoEstandeMat');
    if(aviso){
      const txt = avisoDivergenciaPct(pct,'estabelecimento');
      aviso.textContent = txt;
      aviso.style.display = txt ? '' : 'none';
    }
  };
  ['m_sementes','m_comp','m_linhas','m_metros','m_plantas'].forEach(id=>{
    const elInput = document.getElementById(id);
    if(elInput) elInput.addEventListener('input', recalc);
  });
  if(!editavel) return;
  document.getElementById('btnSalvarEstandeMat').addEventListener('click', async ()=>{
    const nome = document.getElementById('m_nome').value.trim();
    if(!nome){ toast("Informe o nome do material"); return; }
    const patch = {
      nome,
      sementesPorMetro: num(document.getElementById('m_sementes').value) || null,
      comprimentoM: num(document.getElementById('m_comp').value) || null,
      numeroLinhas: num(document.getElementById('m_linhas').value) || null,
      estandeInicial: {
        data: document.getElementById('m_dataEstande').value,
        metrosAvaliados: num(document.getElementById('m_metros').value) || null,
        plantasContadas: num(document.getElementById('m_plantas').value) || null,
        observacoes: document.getElementById('m_obs').value.trim()
      }
    };
    await salvarMaterial(campo, mat.id, patch);
    toast("Estande salvo ✓");
    avancarProximoMaterialLanc(campo, "estande", mat.id);
  });
}

async function abrirLightboxFotos(fotos){
  openModal(`

      <div class="field-hint">Carregando...</div>
    </div>
    <button class="btn btn-block" id="btnFecharLightbox" style="margin-top:10px;">Fechar</button>
  `, { wide:true });
  document.getElementById('btnFecharLightbox').addEventListener('click', closeModal);
  const box = document.getElementById('lightboxFotos');
  const imgs = await Promise.all(fotos.map(f=>buscarFotoBase64(f)));
  box.innerHTML = imgs.map(b64 => b64
    ? `<img src="${b64}" style="width:100%;border-radius:10px;">`
    : `<div class="field-hint">Não foi possível carregar esta foto.</div>`

function wireSanidadeAltura(campo, mat, editavel){
  const s = mat.sanidadeAltura||{};

  const btnVerFotos = document.getElementById('btnVerFotosSan');
  if(btnVerFotos) btnVerFotos.addEventListener('click', ()=>abrirLightboxFotos(s.fotos||[]));

  const btnEscala = document.getElementById('btnToggleEscalaSan');
  const escalaBox = document.getElementById('escalaRefBox');
  if(btnEscala && escalaBox) btnEscala.addEventListener('click', ()=>{
    escalaBox.style.display = escalaBox.style.display==='none' ? 'block' : 'none';
  });

  if(!editavel) return;

  let notaVal = s.nota ?? null;
  const notaBox = document.getElementById('s_nota');
  if(notaBox) notaBox.querySelectorAll('.chip-opt').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      notaVal = parseInt(chip.dataset.val,10);
      notaBox.querySelectorAll('.chip-opt').forEach(c=>c.classList.toggle('sel', c===chip));
    });
  });

  const previewBox = document.getElementById('sFotosPreview');
  function renderFotosPreview(){
    if(!previewBox) return;
    previewBox.innerHTML = STATE.fotosNovas.map((b64,i)=>`
      <div style="position:relative;">
        <img src="${b64}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">
        <button type="button" data-rmfoto="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:999px;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:1;">✕</button>
      </div>
    `).join('');
    previewBox.querySelectorAll('[data-rmfoto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        STATE.fotosNovas.splice(parseInt(btn.dataset.rmfoto,10),1);
        renderFotosPreview();
      });
    });
  }
  renderFotosPreview();
  const fotoInput = document.getElementById('s_fotoInput');
  if(fotoInput) fotoInput.addEventListener('change', async ()=>{
    const file = fotoInput.files[0];
    if(!file) return;
    try{
      toast("Processando foto...");
      const base64 = await comprimirImagem(file);
      STATE.fotosNovas.push(base64);
      renderFotosPreview();
      fotoInput.value = "";
    }catch(e){
      console.error(e);
      toast("Não foi possível processar a foto");
    }
  });
  const manterCheck = document.getElementById('s_manterFotos');

  document.getElementById('btnSalvarSanidadeAltura').addEventListener('click', async ()=>{
    if(notaVal==null){ toast("Selecione uma nota geral de sanidade"); return; }
    const btn = document.getElementById('btnSalvarSanidadeAltura');
    btn.disabled = true; btn.textContent = "Salvando...";
    try{
      const manter = manterCheck ? manterCheck.checked : true;
      const fotosExistentes = manter ? (s.fotos||[]) : [];
      let novasRefs = [];
      if(STATE.fotosNovas.length){
        novasRefs = await salvarFotosSanidade(STATE.fotosNovas, { campoId: campo.id, materialId: mat.id });
      }
      const altura = num(document.getElementById('s_altura').value);
      const patch = {
        sanidadeAltura: {
          data: document.getElementById('s_data').value,
          nota: notaVal,
          alturaCm: isNaN(altura) ? null : altura,
          fotos: fotosExistentes.concat(novasRefs),
          observacoes: document.getElementById('s_obs').value.trim()
        }
      };
      await salvarMaterial(campo, mat.id, patch);
      STATE.fotosNovas = [];
      toast("Sanidade e altura salvas ✓");
      avancarProximoMaterialLanc(campo, "sanidadeAltura", mat.id);
    }catch(e){
      console.error(e);
      toast("Erro ao salvar — verifique sua conexão");
    }finally{
      btn.disabled = false; btn.textContent = "Salvar";
    }
  });
}

          plantasContadas: num(document.getElementById('c_plantasFinal').value) || null
        },
        acamamentoNota: acamamentoVal,
        observacoes: document.getElementById('c_obs').value.trim()
      }
    };
    if(typeof patch.colheita.umidadePct !== 'number' || isNaN(patch.colheita.umidadePct)) patch.colheita.umidadePct = null;
    if(typeof patch.colheita.impurezaPct !== 'number' || isNaN(patch.colheita.impurezaPct)) patch.colheita.impurezaPct = null;
    await salvarMaterial(campo, mat.id, patch);
    toast("Colheita salva ✓");
    avancarProximoMaterialLanc(campo, "colheita", mat.id);
  });
}

/* ---------------------------------------------------------------

function renderLancamento(){

      `).join('')}

  if(!STATE.lancCampoId){
    const camposComMateriais = STATE.campos.filter(c=>materiaisAtivos(c).length>0);
    el.innerHTML = `
      <div class="detail-header">
        <div class="grow">
          <h1 style="margin-bottom:2px;">📋 Lançamento em lote</h1>

              <div class="campo-card" data-campoid="${c.id}">
                <div class="campo-top">
                  <div>
                    <div class="campo-material">${esc(c.fazenda||'(sem fazenda)')}</div>
                    <div class="campo-sub">${esc(c.produtor||'—')} · ${esc(c.safra||'—')}</div>
                  </div>
                  <span class="badge ${feitos===mats.length?'badge-colheita':'badge-implantacao'}">${feitos}/${mats.length} feito(s)</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
    document.querySelectorAll('#tabsBarLanc .tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{ STATE.lancEtapa = btn.dataset.etapa; STATE.lancMaterialAberto=null; renderLancamento(); });

    document.querySelectorAll('#listaCamposLanc .campo-card').forEach(row=>{

    });

  const campo = STATE.campos.find(c=>c.id===STATE.lancCampoId);

  const editavel = podeEditar(campo);
  const mats = materiaisAtivos(campo);

function tplEtapaLancamento(campo, mat, etapa, editavel){
  if(etapa.key==="estande") return tplEstandeMaterial(campo, mat, editavel);
  if(etapa.key==="engalhamento") return tplEngalhamento(mat, editavel);
  if(etapa.key==="sanidadeAltura") return tplSanidadeAltura(mat, editavel);

}

function wireEtapaLancamento(campo, mat, etapa, editavel){

  else if(etapa.key==="engalhamento") wireEngalhamento(campo, mat, editavel);
  else if(etapa.key==="sanidadeAltura") wireSanidadeAltura(campo, mat, editavel);

function labelPotencialProdutivo(v){
  const opt = POTENCIAL_PRODUTIVO_OPCOES.find(o=>o.v===v);
  return opt ? opt.label : '';
}
function materialResumo(campo, mat){
  const ei = mat.estandeInicial||{}, co = mat.colheita||{};
  const eng = mat.engalhamento||{}, san = mat.sanidadeAltura||{};
  const sf = co.standFinal||{};
  const larguraImplantada = calcLarguraM(mat.numeroLinhas, campo.espacamentoCm);
  const areaImplantada = calcAreaHa(mat.comprimentoM, larguraImplantada);
  const popTeorica = calcPopTeoricaHa(mat.sementesPorMetro, campo.espacamentoCm);
  const plantasHa = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
  const pctEstab = (!isNaN(plantasHa) && popTeorica) ? (plantasHa/popTeorica*100) : NaN;
  const plantasHaFinal = calcPlantasHa(sf.plantasContadas, sf.metrosAvaliados, campo.espacamentoCm);
  const pctSobrevivencia = (!isNaN(plantasHaFinal) && plantasHa) ? (plantasHaFinal/plantasHa*100) : NaN;
  const areaColhida = calcAreaHa(co.comprimentoM, co.larguraM);
  const pesoCorrigido = calcCorrigidoColheita(co);
  const kgHa = (!isNaN(pesoCorrigido) && areaColhida) ? pesoCorrigido/areaColhida : NaN;

  return {
    etapa: getEtapaMaterial(mat).label,
    consultor: campo.consultor||'',
    safra: campo.safra||'',
    fazenda: campo.fazenda||'',

    material: mat.nome||'',
    dataPlantio: campo.dataPlantio||'',
    culturaAntecessora: campo.culturaAntecessora==='Outros' ? (campo.culturaAntecessoraOutra||'Outros') : (campo.culturaAntecessora||''),
    potencialProdutivo: labelPotencialProdutivo(campo.potencialProdutivo),
    latitude: campo.lat??'',
    longitude: campo.lng??'',
    adubacaoFormulacao: campo.adubacaoFormulacao||'',
    adubacaoDoseKgHa: campo.adubacaoDose??'',
    sementesPorMetro: mat.sementesPorMetro??'',
    espacamentoCm: campo.espacamentoCm??'',
    numeroLinhas: mat.numeroLinhas??'',
    larguraParcelaM: !isNaN(larguraImplantada)?Number(larguraImplantada.toFixed(2)):'',
    areaImplantadaM2: !isNaN(areaImplantada)?Number((areaImplantada*10000).toFixed(1)):'',
    areaImplantadaHa: !isNaN(areaImplantada)?Number(areaImplantada.toFixed(4)):'',
    populacaoTeoricaHa: popTeorica?Math.round(popTeorica):'',
    populacaoObtidaHa: !isNaN(plantasHa)?Math.round(plantasHa):'',
    percEstabelecimento: !isNaN(pctEstab)?Number(pctEstab.toFixed(0)):'',
    dataEngalhamento: eng.data||'',
    notaEngalhamento: eng.nota??'',
    dataSanidade: san.data||'',
    alturaCm: san.alturaCm??'',
    notaSanidade: san.nota??'',
    fotosSanidadeQtd: (san.fotos||[]).length,
    dataColheita: co.data||'',
    areaColhidaM2: !isNaN(areaColhida)?Number((areaColhida*10000).toFixed(1)):'',
    areaColhidaHa: !isNaN(areaColhida)?Number(areaColhida.toFixed(4)):'',
    pesoColhidoKg: co.pesoColhidoKg??'',
    pmsG: co.pmsG??'',
    umidadePct: co.umidadePct??'',

    pesoCorrigidoKg: !isNaN(pesoCorrigido)?Number(pesoCorrigido.toFixed(1)):'',

    notaAcamamento: co.acamamentoNota??''
  };
}
