<style>

:root{
  --green:#0AA759;
  --green-dark:#0B5930;
  --green-light:#E7F7EF;
  --yellow:#FCE23B;
  --yellow-soft:#FFF6C4;
  --ink:#16241C;
  --ink-soft:#5A6B62;
  --line:#E2E8E4;
  --bg:#F6F9F7;
  --card:#FFFFFF;
  --danger:#D6483A;
  --radius:14px;
  --shadow:0 1px 3px rgba(16,29,25,.08), 0 1px 2px rgba(16,29,25,.06);
  --shadow-lg:0 8px 24px rgba(16,29,25,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%;}
button,input,select,textarea{font-family:inherit;font-size:16px;}
button{cursor:pointer;}
a{color:var(--green-dark);}
[hidden]{display:none!important;}

/* ---------- Layout shell ---------- */
.app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--bg);}
.topbar{
  position:sticky;top:0;z-index:20;
  padding-top:calc(10px + env(safe-area-inset-top)) !important;
  background:var(--ink);
  background:linear-gradient(135deg,#0E2318,#123321 60%,var(--green-dark));
  color:#fff;
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
}
.topbar img{height:34px;display:block;}
.topbar .spacer{flex:1;}
.consultor-chip{cursor:pointer;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:6px 10px;border-radius:999px;
  font-size:13px;
}
.consultor-chip button{
  background:none;border:none;color:var(--yellow);
  font-size:12px;padding:0;text-decoration:underline;
}
.consultor-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);}
.online-dot{width:8px;height:8px;border-radius:50%;background:#38C172;box-shadow:0 0 0 2px rgba(56,193,114,.25);}
.online-dot.off{background:#C13838;box-shadow:0 0 0 2px rgba(193,56,56,.25);}

main{padding:14px 14px 100px;}
.main-tabs{
  position:sticky;top:0;z-index:19;
  background:var(--bg);padding:10px 14px 0;margin:0;
  border-bottom:1px solid var(--line);
}
.main-tabs .tab{flex:1 0 auto;justify-content:center;padding:9px 11px;}
.main-tabs .tab.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}

.hstack{display:flex;align-items:center;gap:8px;}
.vstack{display:flex;flex-direction:column;gap:8px;}
.grow{flex:1;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);
  padding:10px 14px;font-weight:600;font-size:14px;
  transition:transform .05s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-yellow{background:var(--yellow);border-color:var(--yellow);color:var(--green-dark);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--green-dark);}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;pointer-events:none;}
.fab{
  position:fixed;right:18px;bottom:22px;z-index:30;
  width:56px;height:56px;border-radius:50%;
  background:var(--green);color:#fff;border:none;
  box-shadow:var(--shadow-lg);
  font-size:28px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  max-width:calc(900px - 36px);
}
.fab-wrap{max-width:900px;margin:0 auto;position:relative;}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
}
.section-title{
  font-size:13px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);font-weight:700;margin:18px 0 8px;
}
.section-title:first-child{margin-top:0;}

/* ---------- Name gate ---------- */
.gate{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0E2318,#123321 55%,var(--green-dark));
  padding:24px;text-align:center;
}
.gate img{width:min(320px,80vw);margin-bottom:8px;}
.gate-card{
  background:#fff;border-radius:16px;padding:22px;width:100%;max-width:360px;
  box-shadow:var(--shadow-lg);margin-top:18px;
}
.gate-card h2{margin:0 0 4px;font-size:18px;color:var(--ink);}
.gate-card p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--green);
}
.field textarea{resize:vertical;min-height:60px;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.field-computed{
  background:var(--green-light);border:1px dashed var(--green);
  border-radius:10px;padding:8px 10px;font-size:13px;color:var(--green-dark);font-weight:600;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:420px){.grid2{grid-template-columns:1fr;}}

/* ---------- Dashboard ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
.filters select,.filters input{
  border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;
  font-size:13px;white-space:nowrap;flex:none;min-width:120px;
}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;}
.searchbar input{border:none;flex:1;outline:none;padding:0;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
.stat b{display:block;font-size:18px;color:var(--green-dark);}
.stat span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(2,1fr);}}

.campo-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;
}
.campo-card:active{transform:scale(.995);}
.campo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.campo-material{font-weight:700;font-size:15.5px;}
.campo-sub{font-size:12.5px;color:var(--ink-soft);}
.badge{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
}
.badge-implantacao{background:#FFF6C4;color:#8A6D00;}
.badge-estande{background:#E7F0FF;color:#2453A8;}
.badge-dev{background:#F1E7FF;color:#6B2FA8;}
.badge-colheita{background:var(--green-light);color:var(--green-dark);}
.badge-danger{background:#F3E3E1;color:#8A3B2E;}
.progress-track{height:5px;border-radius:999px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;background:var(--green);}
.campo-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-soft);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty-state div.big{font-size:34px;margin-bottom:6px;}

/* ---------- Campo detail ---------- */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.detail-header h1{font-size:17px;margin:0;flex:1;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.tab{
  flex:none;padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.tab.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff;}
.tab .num{
  width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--ink-soft);
  font-size:10.5px;display:flex;align-items:center;justify-content:center;
}
.tab.active .num{background:var(--yellow);color:var(--green-dark);}
.tab.done .num{background:var(--green);color:#fff;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.calc-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
@media (max-width:420px){.calc-box{grid-template-columns:1fr;}}
.calc-item{background:var(--green-light);border-radius:10px;padding:8px 10px;}
.calc-item b{display:block;font-size:16px;color:var(--green-dark);}
.calc-item span{font-size:11px;color:var(--ink-soft);}
.avaliacao-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#FAFCFB;}
.avaliacao-item .hstack{justify-content:space-between;}
.sanidade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
@media (max-width:420px){.sanidade-grid{grid-template-columns:1fr;}}
.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-opt{
  border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;
  background:#fff;color:var(--ink-soft);font-weight:600;
}
.chip-opt.sel{background:var(--green);border-color:var(--green);color:#fff;}
.chip-opt.sel-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.map-pin-box{
  border:1.5px dashed var(--green);border-radius:12px;padding:10px;background:var(--green-light);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
#miniMap{width:100%;height:260px;border-radius:10px;margin-top:8px;display:none;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
@media (min-width:640px){.modal-backdrop{align-items:center;}}
.modal{
  background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
@media (min-width:640px){.modal{border-radius:18px;}}
.modal.wide{max-width:720px;}
.modal h3{margin:0 0 4px;font-size:16px;}
.modal .close{position:absolute;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;}
.data-table{border-collapse:collapse;width:100%;font-size:12.5px;}
.data-table th,.data-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.data-table th{background:var(--green-light);color:var(--green-dark);font-weight:700;}
.data-table tr:last-child td{border-bottom:none;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;box-shadow:var(--shadow-lg);z-index:99;opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.toast.show{opacity:1;}


/* ---------- Catálogo do protocolo ---------- */
.cat-row{padding:10px 0;border-bottom:1px solid var(--line);}
.cat-row.cat-excl{opacity:.6;}
.cat-num{width:62px;flex:none;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-weight:700;color:var(--green-dark);}
.cat-num-ro{min-width:34px;text-align:center;font-weight:800;color:var(--green-dark);background:var(--green-light);border-radius:8px;padding:5px 6px;flex:none;}
.cat-linhas{width:70px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;}


/* ---------- Barras / clima ---------- */
.bar-track{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;background:var(--green);border-radius:0 4px 4px 0;}
.clima-dias{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.clima-dia{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 2px;}
.rank-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;padding:5px 0;}
.rank-bar{height:14px;border-radius:0 4px 4px 0;background:var(--green);}
.rank-bar.abaixo{background:#8FCFAE;}
.rank-track{position:relative;}
.rank-media{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink-soft);}


.doenca-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FAFCFB;}


/* ---------- Ferramentas ---------- */
details.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;}
details.tool>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
details.tool>summary::-webkit-details-marker{display:none;}
details.tool>summary::after{content:"▼";font-size:11px;color:var(--ink-soft);}
details.tool[open]>summary::after{content:"▲";}
.tool-body{padding:0 14px 14px;}
.coef{width:64px;padding:5px 6px;border:1.5px solid var(--line);border-radius:6px;}
.stack-bar{display:flex;gap:2px;height:12px;border-radius:999px;overflow:hidden;margin-top:6px;background:var(--line);}
.stack-bar>div{height:100%;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:2px;}


.oc-row{padding:8px 0;border-bottom:1px solid var(--line);}
.guia-sec{margin-top:10px;font-size:13px;line-height:1.45;}
.guia-sec b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-dark);margin-bottom:2px;}
.ref-box{position:relative;border-radius:12px;overflow:hidden;background:#0E2318;}
.ref-box img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;}
.ref-nav{position:absolute;top:40%;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:22px;line-height:1;}
.ref-prev{left:6px;} .ref-next{right:6px;}
.ref-cred{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:10.5px;padding:14px 8px 5px;}
.ref-vazio{border:1.5px dashed var(--line);border-radius:12px;padding:18px 10px;text-align:center;font-size:12.5px;color:var(--ink-soft);background:var(--bg);aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:center;gap:6px;}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.comp-tit{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:4px;}
.foto-vazia{display:flex;flex-direction:column;justify-content:center;align-items:center;aspect-ratio:4/3;border:2px dashed var(--green);border-radius:12px;background:var(--green-light);color:var(--green-dark);font-weight:700;font-size:13px;text-align:center;cursor:pointer;}


.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (min-width:640px){.tile-grid{grid-template-columns:repeat(3,1fr);}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 12px;min-height:112px;color:var(--ink);}
.tile:active{transform:scale(.98);}
.tile b{font-size:14.5px;}
.tile span:last-child{font-size:12px;color:var(--ink-soft);line-height:1.3;}
.tile-ic{font-size:26px;line-height:1;margin-bottom:4px;}
.tile-guia{background:linear-gradient(160deg,#fff,var(--green-light));}
.destaque{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--green-dark);color:#fff;border-radius:12px;padding:12px;margin:10px 0;}
.destaque b{font-size:26px;color:var(--yellow);line-height:1.2;}
.destaque span{font-size:12.5px;opacity:.9;}
.passos{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.7;}
.veredito{font-size:13px;padding:6px 0;line-height:1.4;}
.linhas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
@media (max-width:420px){.linhas-grid{grid-template-columns:repeat(3,1fr);}}
.linhas-grid input{padding:8px 6px;text-align:center;}


.cfg-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;width:36px;height:36px;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;}


.modal-backdrop.full{align-items:stretch;}
.modal.full{max-width:900px;border-radius:0;max-height:100vh;height:100vh;display:flex;flex-direction:column;}
#mapaPonto{width:100%;flex:1;min-height:55vh;border-radius:12px;}


details.cat-det{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);}
details.cat-det>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);}


.npk{display:inline-flex;gap:1px;font-weight:900;font-size:19px;letter-spacing:.5px;color:var(--green-dark);background:var(--yellow);border-radius:8px;padding:3px 6px;font-style:normal;}
.npk i{font-style:normal;color:#C0392B;}

.grafico{width:100%;height:auto;display:block;margin:6px 0 10px;}
.chip-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.chip-scroll .chip-opt{flex:none;}
.online-dot.pend{background:#FCE23B;box-shadow:0 0 0 2px rgba(252,226,59,.3);}
.sync-bar{background:#FFF6C4;color:#5C4A00;font-size:12.5px;font-weight:600;padding:7px 14px;border-bottom:1px solid #F0DE7A;}
.inst-banner{justify-content:space-between;gap:10px;background:var(--green-dark);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
.passos-inst{margin:4px 0 6px;padding-left:20px;font-size:13.5px;line-height:1.55;}
.tabela-desc-box{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.cv-chip{padding:5px 10px;font-size:13px;}
.tol-list{display:flex;flex-direction:column;gap:8px;}
.tol-item{border:1px solid var(--line,#e3e8e5);border-left:5px solid #c9d3ce;border-radius:12px;padding:10px 12px;background:#fff;}
.tol-item.tol-ok{border-left-color:var(--green);background:var(--green-light);}
.tol-item.tol-atencao{border-left-color:#E0A800;background:#fff9e6;}
.tol-item.tol-ruim{border-left-color:var(--danger);background:#fdeeee;}
.tol-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;}
.tol-item>b{display:block;font-size:20px;margin:2px 0;}
.tol-item small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.35;margin-top:2px;}
.fonte-row{display:grid;grid-template-columns:1.6fr 1fr 0.9fr;gap:6px;margin-bottom:6px;}
.fonte-row input{width:100%;min-width:0;padding:8px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;}
.fonte-row input[readonly]{background:var(--bg);color:var(--ink);}
.fonte-head{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:2px;}
.footer-note{text-align:center;font-size:11px;color:var(--ink-soft);padding:18px 0 6px;}

</style>

/* ---------------------------------------------------------------

------------------------------------------------------------------*/
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function num(v){
  if(v===null||v===undefined||v==="") return NaN;
  const n = parseFloat(String(v).replace(',','.'));
  return n;
}
function fmt(n, casas){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return n.toLocaleString('pt-BR',{minimumFractionDigits:casas??1, maximumFractionDigits:casas??1});
}
function fmtInt(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return Math.round(n).toLocaleString('pt-BR');
}
function avisoDivergenciaPct(pct, contexto){
  if(isNaN(pct)) return '';
  if(contexto==='sobrevivencia' && pct > 100){
    return `⚠️ Sobrevivência acima de 100% não é esperada — confira os metros avaliados, as plantas contadas e o espaçamento (erro de digitação nesses três campos é a causa mais comum de divergência).`;
  }
  if(contexto==='estabelecimento' && pct > 130){
    return `⚠️ Estabelecimento muito acima de 100% é incomum — confira sementes por metro, espaçamento e a contagem de plantas.`;
  }
  return '';
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR');
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Avaliações não podem ser salvas com data passada. Exceção: a data que já
// estava gravada (para permitir corrigir um valor de uma avaliação antiga).
function minDataAvaliacao(salva){
  const hoje = todayISO();
  return (salva && salva < hoje) ? salva : hoje;
}
function validarDataAvaliacao(valor, salva){
  if(!valor){ toast("Informe a data da avaliação"); return false; }
  if(valor < todayISO() && valor !== salva){
    toast("⚠️ Não é permitido salvar avaliação com data passada — use a data de hoje.");
    return false;
  }
  return true;
}
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---- Cálculos agronômicos ---- */
function calcAreaHa(comprimentoM, larguraM){
  const c = num(comprimentoM), l = num(larguraM);
  if(isNaN(c)||isNaN(l)||c<=0||l<=0) return NaN;
  return (c*l)/10000;
}
// Comprimento efetivo da parcela: o do material, ou o padrão do campo.
function comprimentoParcela(campo, mat){
  const c = num(mat.comprimentoM);
  if(c>0) return c;
  const p = num(campo.comprimentoPadraoM);
  return p>0 ? p : NaN;
}
function areaParcela(campo, mat){
  return calcAreaHa(comprimentoParcela(campo, mat), calcLarguraM(mat.numeroLinhas, campo.espacamentoCm));
}
function parcelasSemArea(campo){
  return materiaisAtivos(campo).filter(m=>isNaN(areaParcela(campo,m))).length;
}
function calcLarguraM(numeroLinhas, espacamentoCm){
  const n = num(numeroLinhas), e = num(espacamentoCm);
  if(isNaN(n)||isNaN(e)||n<=0||e<=0) return NaN;
  return n*(e/100);
}
function casasHa(areaHa){ return areaHa>=10 ? 1 : areaHa>=1 ? 2 : areaHa>=0.1 ? 3 : 4; }
// Áreas sempre em hectares (padrão pedido para o dashboard e a colheita).
function fmtAreaStat(areaHa){
  if(!areaHa || areaHa<=0 || isNaN(areaHa)) return "—";
  return `${fmt(areaHa, casasHa(areaHa))} ha`;
}
function fmtArea(areaHa){
  // parcelas são pequenas: hectares com 4 casas e o m² entre parênteses como apoio
  if(isNaN(areaHa) || !areaHa) return "—";
  return `${fmt(areaHa, casasHa(areaHa))} ha <small style="font-weight:500;opacity:.75;">(${fmt(areaHa*10000,0)} m²)</small>`;
}
function calcPopTeoricaHa(sementesPorMetro, espacamentoCm){
  const s = num(sementesPorMetro), e = num(espacamentoCm);
  if(isNaN(s)||isNaN(e)||e<=0) return NaN;
  const metrosLinearesPorHa = 10000/(e/100);
  return s * metrosLinearesPorHa;
}
function calcPlantasHa(plantasContadas, metrosAvaliados, espacamentoCm){
  const p = num(plantasContadas), m = num(metrosAvaliados), e = num(espacamentoCm);
  if(isNaN(p)||isNaN(m)||isNaN(e)||m<=0||e<=0) return NaN;
  const metrosLinearesPorHa = 10000/(e/100);
  return (p/m) * metrosLinearesPorHa;
}
function calcPesoCorrigido(pesoColhidoKg, umidadePct, umidadeBase){
  const p = num(pesoColhidoKg), u = num(umidadePct);
  const base = umidadeBase ?? UMIDADE_BASE_PADRAO;
  if(isNaN(p)||isNaN(u)) return NaN;
  return p * (100-u) / (100-base);
}
/* Aplica desconto por tabela (umidade% x impureza%) em vez da fórmula padrão,
   caso uma tabela esteja configurada e o consultor opte por usá-la — ver
   função obterDescontoTabela() e a seção "Colheita" para a UI de escolha. */
function calcPesoComDesconto(pesoColhidoKg, descontoPct){
  const p = num(pesoColhidoKg), d = num(descontoPct);
  if(isNaN(p)||isNaN(d)) return NaN;
  return p * (100-d) / 100;
}
/* Peso corrigido de um material colhido, respeitando o método escolhido
   (fórmula padrão ou tabela de desconto) — usado em qualquer lugar que
   precise da produtividade (lista de materiais, resumo, exports). */
/* Métodos de correção do peso colhido:
   - formula: tira a impureza (se informada) e corrige a umidade para 14%:
              peso × (100 − impureza)/100 × (100 − umidade)/(100 − 14)
   - tabela:  desconto % da tabela (umidade × impureza) sobre o peso
   - manual:  descontos de umidade e de impureza digitados (ex.: do ticket da
              cerealista), somados e aplicados sobre o peso bruto
   - nenhum:  usa o peso colhido como está */
const METODOS_CORRECAO = [
  { v:"formula", t:`Corrigir para ${UMIDADE_BASE_PADRAO}% de umidade` },
  { v:"manual",  t:"Digitar os descontos (umidade e impureza)" },
  { v:"tabela",  t:"Tabela de desconto (umidade × impureza)" },
  { v:"nenhum",  t:"Sem correção (peso de campo)" }
];
function rotuloMetodoCorrecao(co){
  const m = (co||{}).metodoCorrecao || 'formula';
  if(m==='manual') return `Descontos digitados (umid. ${fmt(num(co.descUmidadePct)||0,1)}% + imp. ${fmt(num(co.descImpurezaPct)||0,1)}%)`;
  if(m==='tabela') return 'Tabela de desconto';
  if(m==='nenhum') return 'Sem correção';
  return `Corrigido a ${UMIDADE_BASE_PADRAO}%`;
}
function calcCorrigidoColheita(co){
  co = co || {};
  const p = num(co.pesoColhidoKg);
  if(isNaN(p)) return NaN;
  const metodo = co.metodoCorrecao || 'formula';
  if(metodo === 'nenhum') return p;
  if(metodo === 'manual'){
    const dU = num(co.descUmidadePct), dI = num(co.descImpurezaPct);
    const total = (isNaN(dU)?0:dU) + (isNaN(dI)?0:dI);
    return p * (100 - total) / 100;
  }
  if(metodo === 'tabela'){
    const desconto = obterDescontoTabela(co.umidadePct, co.impurezaPct);
    return !isNaN(desconto) ? calcPesoComDesconto(p, desconto) : NaN;
  }
  const imp = num(co.impurezaPct);
  const limpo = isNaN(imp) ? p : p * (100 - imp) / 100;
  return calcPesoCorrigido(limpo, co.umidadePct, UMIDADE_BASE_PADRAO);
}
// Área colhida: comprimento × (linhas colhidas × espaçamento) ou × largura digitada.
function larguraColhidaM(campo, co){
  co = co || {};
  const porLinhas = calcLarguraM(co.linhasColhidas, campo && campo.espacamentoCm);
  return !isNaN(porLinhas) ? porLinhas : num(co.larguraM);
}
function areaColhidaHa(campo, co){
  co = co || {};
  return calcAreaHa(co.comprimentoM, larguraColhidaM(campo, co));
}
// Ciclo em dias: da data de plantio do campo até a data da colheita do material.
function cicloDias(campo, mat){
  const p = campo && campo.dataPlantio, c = mat && mat.colheita && mat.colheita.pesoColhidoKg ? mat.colheita.data : null;
  if(!p || !c) return NaN;
  const d = Math.round((new Date(c+"T12:00:00") - new Date(p+"T12:00:00")) / 86400000);
  return d>0 ? d : NaN;
}
function produtividadeMaterial(campo, mat){
  const co = mat.colheita || {};
  const corr = calcCorrigidoColheita(co), area = areaColhidaHa(campo, co);
  const kgHa = (!isNaN(corr) && area>0) ? corr/area : NaN;
  return { corrigido:corr, areaHa:area, kgHa, scHa: !isNaN(kgHa) ? kgHa/60 : NaN };
}
function diasDesdePlantio(dataPlantioISO){
  if(!dataPlantioISO) return NaN;
  const d = new Date(dataPlantioISO+"T00:00:00");
  if(isNaN(d.getTime())) return NaN;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

/* ---- Cronograma sugerido de avaliações (a partir da data de plantio) ---- */
function cronogramaCampo(campo){
  if(ehDifusao(campo)) return []; // só os protocolos são avaliados
  const dias = diasDesdePlantio(campo.dataPlantio);
  const materiais = materiaisAtivos(campo);
  if(isNaN(dias) || materiais.length===0) return [];
  return CRONOGRAMA_SUGERIDO.map(etapa=>{
    const pendentes = materiais.filter(m=>!etapa.done(m)).length;
    let status;
    if(pendentes===0) status = "feito";
    else if(dias < etapa.diasMin) status = "futuro";
    else if(dias <= etapa.diasMax) status = "no_prazo";
    else status = "atrasado";
    return { ...etapa, dias, pendentes, status };
  });
}
function temEtapaAtrasada(campo){
  return cronogramaCampo(campo).some(e=>e.status==="atrasado");
}
function tplCronograma(campo){
  const etapas = cronogramaCampo(campo);
  if(!campo.dataPlantio) return "";
  if(etapas.length===0) return "";
  const statusInfo = {
    feito: { icon:"✅", label:"Concluído", cls:"badge-colheita" },
    no_prazo: { icon:"🔔", label:"No prazo", cls:"badge-dev" },
    atrasado: { icon:"⚠️", label:"Atrasado", cls:"badge-danger" },
    futuro: { icon:"⏳", label:"Ainda não chegou", cls:"badge-implantacao" }
  };
  return `
    <div class="card vstack" style="margin-top:14px;">
      <div class="section-title" style="margin-top:0;">📅 Cronograma sugerido de avaliações</div>
      <div class="field-hint" style="margin-bottom:4px;">Estimativa a partir da data de plantio (${fmtDate(campo.dataPlantio)}) — ajuste pela observação visual do estágio da cultura, pois o ciclo varia com cultivar e clima.</div>
      ${etapas.map(e=>{
        const s = statusInfo[e.status];
        return `
          <div class="hstack" style="justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);gap:8px;">
            <div style="flex:1;">
              <b style="font-size:13px;">${esc(e.label)}</b>
              <div style="font-size:12.5px;font-weight:700;color:var(--green-dark);margin-top:2px;">📅 ${fmtDate(addDias(campo.dataPlantio,e.diasMin))} a ${fmtDate(addDias(campo.dataPlantio,e.diasMax))}</div>
              <div class="field-hint" style="margin:2px 0 0;">${esc(e.dica)} · ${e.diasMin}–${e.diasMax} dias após o plantio</div>
              ${e.status!=="feito" && e.pendentes>0 ? `<div class="field-hint" style="margin-top:2px;">${e.pendentes} material(is) pendente(s)</div>` : ""}
            </div>
            <span class="badge ${s.cls}">${s.icon} ${s.label}</span>
          </div>
        `;
      }).join('')}
      <div class="field-hint" style="padding-top:4px;">🌾 Colheita prevista (ciclo médio de ${COLHEITA_DAP_MIN}–${COLHEITA_DAP_MAX} dias): <b>${fmtDate(addDias(campo.dataPlantio,COLHEITA_DAP_MIN))} a ${fmtDate(addDias(campo.dataPlantio,COLHEITA_DAP_MAX))}</b> — confirme pelo ciclo de cada material.</div>
    </div>
  `;
}
// Próxima avaliação projetada do campo (primeira etapa ainda pendente).
const COLHEITA_DAP_MIN = 110, COLHEITA_DAP_MAX = 130;
function proximaAvaliacao(campo){
  if(!campo.dataPlantio || materiaisAtivos(campo).length===0) return null;
  const pend = cronogramaCampo(campo).find(e=>e.status!=="feito");
  if(pend) return { label:pend.label, inicio:addDias(campo.dataPlantio,pend.diasMin), fim:addDias(campo.dataPlantio,pend.diasMax), status:pend.status };
  const mats = materiaisAtivos(campo);
  if(mats.every(m=>m.colheita?.pesoColhidoKg)) return null;
  return { label:"Colheita", inicio:addDias(campo.dataPlantio,COLHEITA_DAP_MIN), fim:addDias(campo.dataPlantio,COLHEITA_DAP_MAX), status:"previsao" };
}
/* ---------------------------------------------------------------
   6c) RANKING DE PRODUTIVIDADE DENTRO DE UM ÚNICO CAMPO
------------------------------------------------------------------*/
function rankingCampo(campo){
  const materiais = materiaisEstat(campo).filter(m=>m.colheita?.pesoColhidoKg);
  const linhas = materiais.map(m=>{
    const r = materialResumo(campo, m);
    return { nome: m.nome||'(sem nome)', scHa: r.produtividadeScHa, pmsG: r.pmsG, umidadePct: r.umidadePct, populacaoFinalHa: r.populacaoFinalHa };
  }).filter(l=> l.scHa!=='' && !isNaN(l.scHa));
  linhas.sort((a,b)=>b.scHa-a.scHa);
  return linhas;
}
function tplRankingCampo(campo){
  const linhas = rankingCampo(campo);
  if(linhas.length===0) return '';
  return `
    <div class="card vstack" style="margin-bottom:14px;">
      <div class="section-title" style="margin-top:0;">🏆 Ranking de produtividade deste campo</div>
      ${linhas.map((l,i)=>`
        <div class="hstack" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);">
          <span style="font-size:13px;"><b>${i+1}º</b> ${esc(l.nome)}</span>
          <b style="font-size:13px;color:var(--green-dark);">${fmt(l.scHa,1)} sc/ha</b>
        </div>
      `).join('')}
    </div>
  `;
}

function media(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : NaN; }
function desvioPadrao(arr, m){
  if(arr.length<2) return NaN;
  const mm = m ?? media(arr);
  const variancia = arr.reduce((a,b)=>a+Math.pow(b-mm,2),0)/(arr.length-1);
  return Math.sqrt(variancia);
}

/* ---------------------------------------------------------------
   4) CAMADA DE DADOS — FIRESTORE (banco compartilhado em tempo real)
   Todo consultor que abrir este arquivo com o Firebase configurado
   entra na MESMA base de dados. Edição/exclusão de um campo (e dos
   materiais dentro dele) só é permitida para o consultor que criou
   o campo (trava feita no app — veja o guia de configuração para
   deixar isso mais rígido via regras do Firestore, se desejar).
------------------------------------------------------------------*/
function isFirebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("COLE_AQUI");
}

function initFirestore(){
  if(!isFirebaseConfigured()){
    console.warn("Firebase não configurado — rodando em modo local (sem sincronização entre consultores). Veja o guia de configuração.");
    setOnline(false);
    renderAll();
    toast("⚠️ Configure o Firebase para sincronizar entre consultores (veja o guia)");
    return;
  }
  try{
    iniciarBanco();
    if(!STATE.db) throw new Error('banco indisponível');
    subscribeCampos();
    subscribeCatalogo();
    subscribeTabelaDesconto();
  }catch(e){
    console.error("Erro ao iniciar Firebase:", e);
    setOnline(false);
    toast("Erro ao conectar ao banco. Veja o console.");
  }
}

function setOnline(v){
  STATE.online = v;
  atualizarSync();
}
// Indicador de sincronização: verde = tudo enviado; amarelo = lançamentos
// guardados no celular esperando enviar; vermelho = sem sinal.
function atualizarSync(){
  const dot = document.getElementById('onlineDot'), bar = document.getElementById('syncBar');
  const semSinal = !navigator.onLine || !STATE.online || STATE.doCache;
  const pend = !!STATE.pendentes;
  const estado = !STATE.db ? 'local' : semSinal ? 'offline' : pend ? 'pendente' : 'ok';
  if(dot){
    dot.classList.toggle('off', estado==='offline' || estado==='local');
    dot.classList.toggle('pend', estado==='pendente');
    dot.title = { ok:"Conectado — tudo sincronizado", pendente:"Enviando lançamentos...", offline:"Sem sinal — lançamentos ficam salvos no celular", local:"Modo local" }[estado];
  }
  if(bar){
    const txt = estado==='offline' ? (pend ? '📴 Sem sinal — seus lançamentos estão salvos no celular e sobem sozinhos quando a internet voltar.' : '📴 Sem sinal — pode continuar lançando: fica salvo no celular.')
      : estado==='pendente' ? '⏳ Enviando lançamentos feitos sem sinal...' : '';
    bar.textContent = txt; bar.hidden = !txt;
  }
}
window.addEventListener('online', ()=>{ atualizarSync(); });
window.addEventListener('offline', ()=>{ atualizarSync(); });
// Grava no banco SEM esperar a resposta do servidor: sem sinal, o Firestore
// guarda no celular e envia depois. A tela já atualiza na hora pelo cache local.
function gravarSemEsperar(promessa){
  if(promessa && promessa.catch) promessa.catch(err=>{
    console.error("Erro ao sincronizar:", err);
    toast(err && err.code==='permission-denied' ? "⚠️ O banco recusou a gravação (regras do Firestore)" : "⚠️ Erro ao sincronizar um lançamento");
  });
}
function exigeInternet(acao){
  if(STATE.db && !navigator.onLine){ toast(`📴 Para ${acao} é preciso estar com internet`); return false; }
  return true;
}

function subscribeCampos(){
  if(STATE.unsubscribe) STATE.unsubscribe();
  STATE.unsubscribe = STATE.db.collection(FIRESTORE_COLLECTION)
    .orderBy("updatedAt","desc")
    .onSnapshot({ includeMetadataChanges:true }, snap=>{
      STATE.pendentes = snap.metadata.hasPendingWrites;
      STATE.doCache = snap.metadata.fromCache;
      STATE.online = true;
      atualizarSync();
      // só redesenha quando os dados mudam (não a cada mudança de status de envio)
      const mudou = !STATE.camposCarregados || snap.docChanges().length > 0;
      if(mudou){
        STATE.campos = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        STATE.camposCarregados = true;
        renderAll();
      }
      // espera o servidor (não só o cache local) para não avisar com dados velhos
      if(!snap.metadata.fromCache || !navigator.onLine) mostrarAvisosAoAbrir();
    }, err=>{
      console.error("Erro de sincronização:", err);
      setOnline(false);
      toast("Falha ao sincronizar — verifique sua internet");
    });
}

/* ---- Catálogo de materiais do PROTOCOLO (lista compartilhada) ----
   Documento config_urtigao/materiais_catalogo:
     itens: [{ nome, numero }]  — número do material no protocolo (ordem)
     nomes: [nome]              — mantido em paralelo p/ compatibilidade
     dono:  "consultor"         — quem lançou o protocolo; só ele altera
   Se ainda não houver dono, o primeiro consultor que alterar o catálogo
   vira o responsável (fica registrado e visível na tela). */
function subscribeCatalogo(){
  if(!STATE.db) return; // modo local: catálogo fica só na memória desta sessão
  if(STATE.unsubscribeCatalogo) STATE.unsubscribeCatalogo();
  const safra = STATE.safraAtual;
  STATE.unsubscribeCatalogo = STATE.db.collection(CATALOGO_COLLECTION).doc(docCatalogo(safra))
    .onSnapshot(async doc=>{
      let d = doc.exists ? doc.data() : null;
      if(!d && safra==="2026/27"){
        try{ const ant = await STATE.db.collection(CATALOGO_COLLECTION).doc(CATALOGO_DOC).get(); d = ant.exists ? ant.data() : null; }catch(e){}
      }
      d = d || {};
      let itens = Array.isArray(d.itens) ? d.itens.map(i=>({ nome:String(i.nome||''), numero: (i.numero==null||i.numero==='') ? null : Number(i.numero) })) : [];
      // materiais que só existem na lista antiga "nomes" (versões anteriores do app)
      (Array.isArray(d.nomes)?d.nomes:[]).forEach(n=>{
        if(!itens.some(i=>normNome(i.nome)===normNome(n))) itens.push({ nome:n, numero:null });
      });
      aplicarCatalogoLocal(itens, d.dono||null);
      // lista oficial da safra: substitui o que estiver salvo UMA vez por versão
      // (depois disso as alterações feitas no app — renomear, tirar, incluir — ficam valendo)
      if(listaOficialItens(safra).length && d.oficialVersao!==OFICIAL_VERSAO[safra] && safra===STATE.safraAtual && (podeEditarProtocolo() || !d.dono)){
        await aplicarListaOficial();
      }
      renderAll();
      if(STATE.modalListaProtAberto && document.getElementById('listaProtWrap')) abrirModalListaProtocolo();
      const modalLista = document.getElementById('listaCampoMat');
      if(modalLista && STATE.modalSelecaoCampoId){
        const c = STATE.campos.find(x=>x.id===STATE.modalSelecaoCampoId);
        if(c) abrirModalSelecionarMateriais(c);
      }
    }, err=>{ console.error("Erro ao sincronizar catálogo:", err); });
}

function compararPorNumero(a, b){
  const na = (a.numero==null||isNaN(a.numero)) ? Infinity : a.numero;
  const nb = (b.numero==null||isNaN(b.numero)) ? Infinity : b.numero;
  if(na!==nb) return na-nb;
  return String(a.nome||'').localeCompare(String(b.nome||''), 'pt-BR', { numeric:true });
}
function aplicarCatalogoLocal(itens, dono){
  if(!STATE.db){ STATE.catalogoLocalPorSafra = STATE.catalogoLocalPorSafra || {}; STATE.catalogoLocalPorSafra[STATE.safraAtual] = itens; }
  STATE.catalogoItens = itens.slice().sort(compararPorNumero);
  STATE.catalogoMateriais = STATE.catalogoItens.map(i=>i.nome);
  STATE.catalogoDono = dono;
}
function numeroCatalogo(nome){
  const it = (STATE.catalogoItens||[]).find(i=>normNome(i.nome)===normNome(nome));
  return it ? it.numero : null;
}
function podeEditarProtocolo(){
  return !STATE.catalogoDono || mesmoConsultor(STATE.catalogoDono, STATE.consultor) || ehResponsavel();
}
/* Lista OFICIAL do protocolo por safra (ordem = nº do material). Entra sozinha
   quando a lista da safra está vazia; o responsável também pode reaplicar. */
const LISTA_OFICIAL = {
  "2026/27": ["ST 627 I2X","BMX VULCANO I2X","C 2636 CE","M 6330 I2X","BMX FERA I2X","C 2645 CE","CZ 26B41 I2X","DM 64K67 CE","FPS 2664 I2X","HO CORRENTES I2X","HO DOURADOS I2X","DM 65IX67 I2X","GF 65IX27 I2X","CZ 26B62 I2X","GH 6630 I2X","M 6626 I2X","NEO 661 I2X","ST 670 I2X","BMX BATALHA CE"]
};
function listaOficialItens(safra){
  return (LISTA_OFICIAL[safra||STATE.safraAtual]||[]).map((nome,i)=>({ nome, numero:i+1 }));
}
function catalogoIgualOficial(){
  const of = listaOficialItens(); if(!of.length) return true;
  const at = (STATE.catalogoItens||[]).slice().sort(compararPorNumero);
  return at.length===of.length && at.every((it,i)=>normNome(it.nome)===normNome(of[i].nome) && it.numero===of[i].numero);
}
// muda quando a lista oficial for trocada → ao abrir, o app substitui a lista salva uma vez
const OFICIAL_VERSAO = { "2026/27": "2026-10-02b" };
async function aplicarListaOficial(){
  const of = listaOficialItens();
  if(!of.length) return false;
  return await salvarCatalogo(of, { oficialVersao: OFICIAL_VERSAO[STATE.safraAtual]||null });
}
// renomeia na lista do protocolo e nos campos desta safra que você pode editar
async function renomearNoCatalogo(antigo, novo){
  novo = String(novo||'').trim();
  if(!novo || normNome(novo)===normNome(antigo)) return false;
  if((STATE.catalogoItens||[]).some(i=>normNome(i.nome)===normNome(novo))){ toast("Já existe um material com esse nome na lista"); return false; }
  const ok = await salvarCatalogo((STATE.catalogoItens||[]).map(i=> normNome(i.nome)===normNome(antigo) ? { nome:novo, numero:i.numero } : i));
  if(!ok) return false;
  for(const c of STATE.campos.filter(c=>!ehDifusao(c) && daSafra(c) && podeEditar(c))){
    if(!(c.materiais||[]).some(m=>normNome(m.nome)===normNome(antigo))) continue;
    await salvarCampo(c.id, { materiais: c.materiais.map(m=> normNome(m.nome)===normNome(antigo) ? Object.assign({}, m, { nome:novo }) : m) });
  }
  return true;
}
// sobe/desce um material na ordem e renumera 1, 2, 3...
async function moverNoCatalogo(nome, dir){
  const itens = (STATE.catalogoItens||[]).slice().sort(compararPorNumero);
  const i = itens.findIndex(it=>normNome(it.nome)===normNome(nome)), j = i+dir;
  if(i<0 || j<0 || j>=itens.length) return false;
  [itens[i], itens[j]] = [itens[j], itens[i]];
  return await salvarCatalogo(itens.map((it,k)=>({ nome:it.nome, numero:k+1 })));
}
// lista do protocolo com ▲ ▼ ✕ (usada na tela do campo e na aba Protocolos)

        <input id="lpNome" placeholder="Novo material na lista" class="grow" style="min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;">

function wireListaProtocolo(reabrir, campo){
  const of = document.getElementById('btnListaOficial');
  if(of) of.addEventListener('click', async ()=>{
    if(!confirm(`Substituir a lista do protocolo ${STATE.safraAtual} pela lista oficial (${listaOficialItens().length} materiais, na ordem oficial)? Materiais que não estão na lista oficial saem da lista padrão (os campos já lançados não mudam).`)) return;
    if(await aplicarListaOficial()){ toast("Lista oficial aplicada ✓"); reabrir(); }
  });
  document.querySelectorAll('[data-catren]').forEach(b=>b.addEventListener('click', async ()=>{
    const novo = prompt(`Novo nome para "${b.dataset.catren}":`, b.dataset.catren);
    if(novo==null) return;
    if(await renomearNoCatalogo(b.dataset.catren, novo)){ toast("Renomeado ✓"); reabrir(); }
  }));
  document.querySelectorAll('[data-catmv]').forEach(b=>b.addEventListener('click', async ()=>{
    if(await moverNoCatalogo(b.dataset.catnome, +b.dataset.catmv)) reabrir();
  }));
  document.querySelectorAll('[data-catnum]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const v = num(inp.value);
    if(await definirNumeroCatalogo(inp.dataset.catnum, isNaN(v) ? null : Math.round(v))) reabrir();
  }));
  document.querySelectorAll('[data-catrm]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm(`Tirar "${btn.dataset.catrm}" da lista do protocolo? (Os campos que já têm esse material continuam com ele.)`)) return;
    if(await removerDoCatalogo(btn.dataset.catrm)){ toast("Tirado da lista"); reabrir(); }
  }));
  const add = async ()=>{
    const nome = document.getElementById('lpNome').value.trim();
    const n = num(document.getElementById('lpNum').value);
    if(!nome){ toast("Digite o nome do material"); return; }
    if((STATE.catalogoItens||[]).some(i=>normNome(i.nome)===normNome(nome))){ toast("Esse material já está na lista"); return; }
    if(await adicionarAoCatalogo(nome, isNaN(n)?null:Math.round(n))){ toast("Adicionado à lista ✓"); reabrir(); }
  };
  const bAdd = document.getElementById('lpAdd');
  if(bAdd){ bAdd.addEventListener('click', add); document.getElementById('lpNome').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); }); }
  const bImp = document.getElementById('btnImportarLista');
  if(bImp) bImp.addEventListener('click', ()=>abrirModalImportarLista(campo || null));
}
function abrirModalListaProtocolo(){
  const scroll = document.querySelector('.modal')?.scrollTop || 0;
  openModal(`
    <h3>📋 Lista do protocolo ${esc(STATE.safraAtual)}</h3>
    <p class="field-hint" style="margin-bottom:4px;">${(STATE.catalogoItens||[]).length} materiais${STATE.catalogoDono?` · responsável ${esc(STATE.catalogoDono)}`:''}. É a lista padrão que todos os consultores puxam ao montar um campo.</p>
    <div id="listaProtWrap">${htmlListaProtocolo()}</div>
    <button class="btn btn-primary btn-block" style="margin-top:12px;" id="lpFechar">Concluído</button>
  `, { wide:true });
  const md = document.querySelector('.modal'); if(md) md.scrollTop = scroll;
  STATE.modalListaProtAberto = true;
  wireListaProtocolo(abrirModalListaProtocolo, null);
  document.getElementById('lpFechar').addEventListener('click', ()=>{ STATE.modalListaProtAberto = false; closeModal(); renderAll(); });
}
async function salvarCatalogo(itens, extra){
  if(!podeEditarProtocolo()){
    toast(`Protocolo lançado por ${STATE.catalogoDono} — só ele(a) pode alterar.`);
    return false;
  }
  const dono = STATE.catalogoDono || (extra?.oficialVersao ? RESPONSAVEL : STATE.consultor);
  const limpos = itens.map(i=>({ nome:String(i.nome).trim(), numero: (i.numero==null||isNaN(i.numero)) ? null : Number(i.numero) }));
  if(!STATE.db){
    aplicarCatalogoLocal(limpos, dono);
    renderAll();
    return true;
  }
  gravarSemEsperar(STATE.db.collection(CATALOGO_COLLECTION).doc(docCatalogo())
    .set(Object.assign({ itens: limpos, nomes: limpos.map(i=>i.nome), dono, safra: STATE.safraAtual }, extra||{}), { merge:true }));
  aplicarCatalogoLocal(limpos, dono);
  return true;
}
function proximoNumeroCatalogo(){
  const nums = (STATE.catalogoItens||[]).map(i=>i.numero).filter(n=>n!=null && !isNaN(n));
  return nums.length ? Math.max(...nums)+1 : 1;
}
async function adicionarAoCatalogo(nome, numero){
  nome = String(nome||"").trim();
  if(!nome) return false;
  if((STATE.catalogoItens||[]).some(i=>normNome(i.nome)===normNome(nome))) return false;
  const n = (numero==null||isNaN(numero)) ? proximoNumeroCatalogo() : Number(numero);
  return await salvarCatalogo((STATE.catalogoItens||[]).concat([{ nome, numero:n }]));
}
async function definirNumeroCatalogo(nome, numero){
  const itens = (STATE.catalogoItens||[]).map(i=> normNome(i.nome)===normNome(nome) ? { nome:i.nome, numero } : i);
  return await salvarCatalogo(itens);
}
async function removerDoCatalogo(nome){
  return await salvarCatalogo((STATE.catalogoItens||[]).filter(i=>normNome(i.nome)!==normNome(nome)));
}


/* ---- Tabela de desconto da colheita (umidade x impureza), compartilhada
   entre consultores — mesma lógica de config do catálogo de materiais ---- */
function subscribeTabelaDesconto(){
  if(!STATE.db) return; // modo local: tabela fica só na memória desta sessão
  if(STATE.unsubscribeDesconto) STATE.unsubscribeDesconto();
  STATE.unsubscribeDesconto = STATE.db.collection(CATALOGO_COLLECTION).doc(DESCONTO_CONFIG_DOC)
    .onSnapshot(doc=>{
      STATE.tabelaDesconto = (doc.exists && Array.isArray(doc.data().linhas)) ? doc.data().linhas : [];
      // com a colheita aberta, só recalcula (não apaga o que está sendo digitado)
      const umid = document.getElementById('c_umid');
      if(umid) umid.dispatchEvent(new Event('input')); else renderAll();
      if(document.getElementById('linhasDescontoWrap')) renderModalTabelaDesconto();
    }, err=>{ console.error("Erro ao sincronizar tabela de desconto:", err); });
}
async function salvarTabelaDesconto(linhas){
  STATE.tabelaDesconto = linhas;
  if(STATE.db) gravarSemEsperar(STATE.db.collection(CATALOGO_COLLECTION).doc(DESCONTO_CONFIG_DOC).set({ linhas }));
  const umid = document.getElementById('c_umid');
  if(umid) umid.dispatchEvent(new Event('input')); else if(!STATE.db) renderAll();
}
function obterDescontoTabela(umidadePct, impurezaPct){
  const u = num(umidadePct), i = num(impurezaPct);
  if(isNaN(u)) return NaN;
  const iEfetivo = isNaN(i) ? 0 : i;
  const linhas = STATE.tabelaDesconto||[];
  const match = linhas.find(l=> u>=l.umidadeMin && u<=l.umidadeMax && iEfetivo>=l.impurezaMin && iEfetivo<=l.impurezaMax);
  return match ? match.descontoPct : NaN;
}

/* ---- Fotos de sanidade — guardadas numa coleção à parte (fotos_urtigao) para
   não estourar o limite de 1MB por documento do Firestore, já que um campo
   pode ter ~20 materiais com várias avaliações cada ---- */
function comprimirImagem(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error("Não foi possível ler a imagem"));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error("Não foi possível ler o arquivo"));
    reader.readAsDataURL(file);
  });
}

async function salvarFotosSanidade(base64Array, meta){
  // Retorna referências para guardar na avaliação: { id } quando salva no
  // Firestore (fotos_urtigao), ou { base64 } em modo local (sem Firebase).
  const refs = [];
  for(const base64 of base64Array){
    if(!STATE.db){
      refs.push({ base64 });
      continue;
    }
    const doc = STATE.db.collection(FOTOS_COLLECTION).doc(); // id gerado no celular (funciona sem sinal)
    STATE.fotoCache[doc.id] = base64;
    gravarSemEsperar(doc.set({
      base64,
      campoId: meta.campoId||null,
      materialId: meta.materialId||null,
      consultor: STATE.consultor||null,
      criadoEm: new Date().toISOString()
    }));
    refs.push({ id: doc.id });
  }
  return refs;
}

async function buscarFotoBase64(ref){
  if(ref.base64) return ref.base64;
  if(!ref.id) return null;
  if(STATE.fotoCache[ref.id]) return STATE.fotoCache[ref.id];
  if(!STATE.db) return null;
  try{
    const doc = await STATE.db.collection(FOTOS_COLLECTION).doc(ref.id).get();
    const base64 = doc.exists ? doc.data().base64 : null;
    if(base64) STATE.fotoCache[ref.id] = base64;
    return base64;
  }catch(e){
    console.error("Erro ao buscar foto:", e);
    return null;
  }
}

async function criarCampo(dadosIniciais){

  }
  const ref = STATE.db.collection(FIRESTORE_COLLECTION).doc(); // id gerado no celular

function normNome(n){ return String(n||"").trim().toLowerCase(); }
/* ---- Acesso: só consultores autorizados. Para liberar alguém novo, o
   desenvolvedor acrescenta o nome nesta lista (e publica o app). ---- */
const CONSULTORES_AUTORIZADOS = ["Daniel","Gabriel","Murilo","Oraci","Henrique"];

// outros nomes já usados no app que são a mesma pessoa
const APELIDOS_CONSULTOR = { "luiz":"Henrique", "luiz henrique":"Henrique", "luiz henrique martinhago":"Henrique" };
function semAcento(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function canonNome(n){ const k = semAcento(normNome(n)); return semAcento(normNome(APELIDOS_CONSULTOR[k] || n)); }
function mesmoConsultor(a,b){ return !!a && !!b && canonNome(a)===canonNome(b); }
function nomeAutorizado(n){ return CONSULTORES_AUTORIZADOS.find(x=>mesmoConsultor(x,n)) || null; }
function listaSafras(){
  const y = new Date().getFullYear(), out = [];
  for(let a=2024; a<=y+4; a++) out.push(`${a}/${String((a+1)%100).padStart(2,'0')}`);
  return out;
}
function podeEditar(campo){
  return !!campo && mesmoConsultor(campo.consultor, STATE.consultor);
}

// Grava só o array de chuvas — deliberadamente SEM a trava de podeEditar(),
// já que qualquer consultor pode registrar a chuva do dia em qualquer
// campo (é uma observação do tempo, não um dado do ensaio de propriedade
// de quem cadastrou o campo).
async function salvarChuva(campo, chuvas){
  const idx = STATE.campos.findIndex(c=>c.id===campo.id);
  if(idx===-1) return;
  const alvo = STATE.campos[idx];
  const patch = { chuvas, updatedAt: new Date().toISOString() };
  if(!STATE.db){
    Object.assign(alvo, patch);
    renderAll();
    return;
  }
  gravarSemEsperar(STATE.db.collection(FIRESTORE_COLLECTION).doc(campo.id).update(patch));
}

async function salvarCampo(id, patch){
  const idx = STATE.campos.findIndex(c=>c.id===id);
  if(idx===-1) return;
  const campo = STATE.campos[idx];
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — edição bloqueada.");
    return;
  }
  patch.updatedAt = new Date().toISOString();
  if(!STATE.db){
    Object.assign(campo, patch);
    renderAll();
    return;
  }
  gravarSemEsperar(STATE.db.collection(FIRESTORE_COLLECTION).doc(id).update(patch));
}

async function salvarMaterial(campo, materialId, patch){
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — edição bloqueada.");
    return;
  }
  // usa a versão mais recente do campo (evita apagar algo salvo depois que a tela abriu)
  const atual = STATE.campos.find(c=>c.id===campo.id) || campo;
  const materiais = (atual.materiais||[]).map(m => m.id===materialId ? Object.assign({}, m, patch) : m);
  await salvarCampo(campo.id, { materiais });
}

async function excluirCampo(id){
  const campo = STATE.campos.find(c=>c.id===id);
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — exclusão bloqueada.");
    return;
  }
  if(!STATE.db){
    STATE.campos = STATE.campos.filter(c=>c.id!==id);
    STATE.telaAtual = STATE.origemLista || "protocolos";
    renderAll();
    return;
  }
  gravarSemEsperar(STATE.db.collection(FIRESTORE_COLLECTION).doc(id).delete());
  STATE.telaAtual = STATE.origemLista || "protocolos";
  renderAll();
}

async function excluirMaterial(campo, materialId){
  if(!podeEditar(campo)){
    toast("Este campo foi criado por outro consultor — exclusão bloqueada.");
    return;
  }
  const materiais = (campo.materiais||[]).filter(m=>m.id!==materialId);
  await salvarCampo(campo.id, { materiais });
  voltarCampo();
}

/* ---------------------------------------------------------------
   SENHAS INDIVIDUAIS DOS CONSULTORES
   - Primeiro acesso de cada consultor: senha padrão "urtigao" e, em
     seguida, ele cria a própria senha (no mínimo 4 caracteres).
   - A senha nunca é guardada: só um "resumo" (SHA-256 com sal) no doc
     config_urtigao/acessos — ninguém consegue ler a senha de ninguém.
   - O celular lembra quem entrou; a senha é pedida de novo ao "Sair",
     para excluir campos/materiais e nas ações do responsável (Henrique).
   - Esqueceu? O Henrique redefine em ⚙️ e o consultor volta a usar a
     senha padrão para criar uma nova.
------------------------------------------------------------------*/
const SENHA_PRIMEIRO_ACESSO = "urtigao";
const ACESSOS_DOC = "acessos";
const RESPONSAVEL = "Henrique";
const LS_ACESSOS_LOCAL = "urtigao_acessos_local";
function ehResponsavel(){ return mesmoConsultor(STATE.consultor, RESPONSAVEL); }
function iniciarBanco(){
  if(STATE.bancoIniciado) return;
  STATE.bancoIniciado = true;
  if(!isFirebaseConfigured() || typeof firebase==="undefined"){
    try{ STATE.acessos = JSON.parse(localStorage.getItem(LS_ACESSOS_LOCAL)||'{}'); }catch(e){ STATE.acessos = {}; }
    STATE.acessosDoServidor = true;
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    STATE.db = firebase.firestore();
    // Funcionar SEM SINAL: guarda os dados no celular (IndexedDB) e envia
    // sozinho quando a internet voltar. Precisa ser chamado antes de usar o banco.
    try{ STATE.db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED, merge:true }); }catch(e){}
    STATE.db.enablePersistence({ synchronizeTabs:true }).catch(err=>{
      console.warn("Modo sem sinal indisponível neste navegador:", err && err.code);
      if(err && err.code==='unimplemented') toast("⚠️ Este navegador não salva sem sinal — use o Chrome (Android) ou o Safari (iPhone)");
    });
    STATE.db.collection(CATALOGO_COLLECTION).doc(ACESSOS_DOC).onSnapshot(doc=>{
      STATE.acessos = (doc.exists && doc.data().usuarios) || {};
      STATE.acessosDoServidor = !doc.metadata.fromCache;
      atualizarDicaGate();
      verificarSenhaCriada();
    }, err=>{ console.error("Erro ao ler acessos:", err); });
  }catch(e){
    console.error("Erro ao iniciar Firebase:", e);
    STATE.db = null;
    toast("Erro ao conectar ao banco.");
  }
}
async function hashSenha(senha, sal){
  const dados = new TextEncoder().encode(`${sal}:${String(senha).trim()}`);
  const buf = await crypto.subtle.digest('SHA-256', dados);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function registroSenha(nome){ return (STATE.acessos||{})[canonNome(nome)] || null; }
async function conferirSenhaDe(nome, senha){
  const r = registroSenha(nome);
  if(!r || !senha) return false;
  return (await hashSenha(senha, r.sal)) === r.hash;
}
function salvarAcessosLocal(){ try{ localStorage.setItem(LS_ACESSOS_LOCAL, JSON.stringify(STATE.acessos||{})); }catch(e){} }
async function definirSenha(nome, senha){
  const sal = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const reg = { nome, sal, hash: await hashSenha(senha, sal), atualizadoEm: new Date().toISOString() };
  STATE.acessos = { ...(STATE.acessos||{}), [canonNome(nome)]: reg };
  if(STATE.db) gravarSemEsperar(STATE.db.collection(CATALOGO_COLLECTION).doc(ACESSOS_DOC).set({ usuarios: { [canonNome(nome)]: reg } }, { merge:true }));
  else salvarAcessosLocal();
}
function redefinirSenha(nome){
  const k = canonNome(nome);
  const novo = { ...(STATE.acessos||{}) }; delete novo[k]; STATE.acessos = novo;
  if(STATE.db) gravarSemEsperar(STATE.db.collection(CATALOGO_COLLECTION).doc(ACESSOS_DOC).update({ [`usuarios.${k}`]: firebase.firestore.FieldValue.delete() }));
  else salvarAcessosLocal();
}
function senhaValidaNova(s){
  s = String(s||'').trim();
  if(s.length < 4) return "A senha precisa ter pelo menos 4 caracteres";
  if(semAcento(normNome(s)) === SENHA_PRIMEIRO_ACESSO) return "Escolha uma senha diferente da senha padrão";
  return null;
}
// Modal de criar/trocar senha. opts: { nome, obrigatorio, pedirAtual, aoConcluir }
function abrirCriarSenha(opts){
  opts = opts || {};
  const nome = opts.nome || STATE.consultor;
  openModal(`
    <h3>🔑 ${opts.pedirAtual ? 'Trocar minha senha' : 'Crie a sua senha'}</h3>
    <p class="field-hint" style="margin-bottom:10px;">${opts.pedirAtual ? '' : `<b>${esc(nome)}</b>, a partir de agora você entra com uma senha só sua — assim ninguém consegue entrar no seu nome e alterar os seus lançamentos. `}Mínimo de 4 caracteres (pode ser número).</p>
    ${opts.pedirAtual ? `<div class="field"><label>Senha atual</label><input type="password" id="csAtual" autocomplete="current-password"></div>` : ''}
    <div class="field"><label>Nova senha</label><input type="password" id="csNova" autocomplete="new-password"></div>
    <div class="field"><label>Repita a nova senha</label><input type="password" id="csNova2" autocomplete="new-password"></div>
    <div class="field-hint" id="csErro" style="color:var(--danger);display:none;"></div>
    <button class="btn btn-primary btn-block" id="csOk">Salvar senha</button>
    ${opts.obrigatorio ? `<button class="btn btn-block" style="margin-top:8px;" id="csNaoSou">Não sou ${esc(nome)} — sair</button>` : `<button class="btn btn-block" style="margin-top:8px;" id="csCancelar">Cancelar</button>`}
  `);
  if(opts.obrigatorio){ const bd = document.getElementById('modalBackdrop'); bd.replaceWith(bd.cloneNode(true)); } // não fecha tocando fora
  const erro = t=>{ const e = document.getElementById('csErro'); e.textContent = t; e.style.display = ''; };
  const cancelar = document.getElementById('csCancelar'); if(cancelar) cancelar.addEventListener('click', closeModal);
  const naoSou = document.getElementById('csNaoSou'); if(naoSou) naoSou.addEventListener('click', ()=>{ closeModal(); trocarConsultor(); });
  setTimeout(()=>document.getElementById(opts.pedirAtual?'csAtual':'csNova')?.focus(), 50);
  document.getElementById('csOk').addEventListener('click', async ()=>{
    if(opts.pedirAtual && !(await conferirSenhaDe(nome, document.getElementById('csAtual').value))){ erro("Senha atual incorreta"); return; }
    const n1 = document.getElementById('csNova').value, n2 = document.getElementById('csNova2').value;
    const inval = senhaValidaNova(n1); if(inval){ erro(inval); return; }
    if(n1.trim() !== n2.trim()){ erro("As duas senhas não conferem"); return; }
    await definirSenha(nome, n1);
    closeModal();
    toast("Senha salva ✓ — guarde bem");
    if(opts.aoConcluir) opts.aoConcluir();
  });
}
// Quem já estava logado antes desta versão: pede para criar a senha pessoal.
function verificarSenhaCriada(){
  if(!STATE.consultor || document.getElementById('app').hidden) return;
  if(!STATE.acessosDoServidor || registroSenha(STATE.consultor)) return;
  if(document.getElementById('csNova')) return;
  abrirCriarSenha({ nome:STATE.consultor, obrigatorio:true });
}
function atualizarDicaGate(){
  const sel = document.getElementById('gateNome'), dica = document.getElementById('gateDica');
  if(!sel || !dica) return;
  const nome = nomeAutorizado(sel.value);
  if(!nome){ dica.textContent = ''; return; }
  if(STATE.acessos==null){ dica.textContent = 'Carregando...'; return; }
  dica.innerHTML = registroSenha(nome) ? 'Digite a <b>sua senha</b>. Esqueceu? Peça ao Henrique para redefinir.'
    : '<b>Primeiro acesso:</b> digite a senha padrão — em seguida você cria a sua.';
}

function pedirSenha(titulo, mensagem, textoBotao){
  return new Promise(resolve=>{
    openModal(`
      <h3>🔒 ${esc(titulo)}</h3>
      <p class="field-hint" style="margin-bottom:10px;">${mensagem}</p>
      <div class="field"><label>Sua senha</label><input type="password" id="senhaExcl" autocomplete="off" placeholder="Digite a sua senha"></div>
      <div class="field-hint" id="senhaErro" style="color:var(--danger);display:none;">Senha incorreta.</div>
      <button class="btn btn-danger btn-block" id="senhaOk">${esc(textoBotao||'Excluir')}</button>
      <button class="btn btn-block" style="margin-top:8px;" id="senhaCancelar">Cancelar</button>
    `);
    const inp = document.getElementById('senhaExcl');
    setTimeout(()=>inp.focus(), 50);
    const tentar = async ()=>{
      if(await conferirSenhaDe(STATE.consultor, inp.value)){ closeModal(); resolve(true); }
      else { document.getElementById('senhaErro').style.display=''; inp.select(); }
    };
    document.getElementById('senhaOk').addEventListener('click', tentar);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') tentar(); });
    document.getElementById('senhaCancelar').addEventListener('click', ()=>{ closeModal(); resolve(false); });
  });
}

/* Zerar: apaga TODOS os campos lançados (protocolo e difusão), as fotos
   de sanidade e, opcionalmente, a lista de materiais do protocolo —
   para começar a lançar do zero. Pede a senha. */
function abrirModalZerarCampos(){
  const nProt = camposProtocolo().length, nDif = camposDifusao().length;
  openModal(`
    <h3>🗑️ Excluir todos os campos lançados</h3>
    <p class="field-hint" style="margin-bottom:8px;">Apaga <b>${nProt} campo(s) do protocolo</b> e <b>${nDif} de difusão</b> — com todos os materiais, avaliações, colheitas, chuvas e fotos — para <b>todos os consultores</b>. Não tem como desfazer.</p>
    <label class="hstack" style="gap:8px;font-size:13px;align-items:flex-start;margin-bottom:10px;">
      <input type="checkbox" id="zerarCatalogo" style="margin-top:3px;">
      <span>Apagar também a lista de materiais do protocolo (e o responsável por ela)</span>
    </label>
    <div class="field"><label>Senha do responsável (${RESPONSAVEL})</label><input type="password" id="zerarSenha" autocomplete="off" placeholder="Digite a sua senha"></div>
    <div class="field-hint" id="zerarErro" style="color:var(--danger);display:none;">Senha incorreta.</div>
    <button class="btn btn-danger btn-block" id="zerarOk">Excluir tudo</button>
    <button class="btn btn-block" style="margin-top:8px;" id="zerarCancelar">Cancelar</button>
  `);
  document.getElementById('zerarCancelar').addEventListener('click', closeModal);
  document.getElementById('zerarOk').addEventListener('click', async ()=>{
    if(!ehResponsavel() || !(await conferirSenhaDe(STATE.consultor, document.getElementById('zerarSenha').value))){ document.getElementById('zerarErro').style.display=''; return; }
    const catalogo = document.getElementById('zerarCatalogo').checked;
    const btn = document.getElementById('zerarOk'); btn.disabled = true; btn.textContent = "Excluindo...";
    try{
      const n = await zerarCampos({ catalogo });
      closeModal();
      STATE.telaAtual = "dashboard"; STATE.campoAbertoId = null; STATE.chuvaCampoId = null; STATE.lancCampoId = null;
      renderAll();
      toast(`${n} campo(s) excluído(s) — pronto para começar de novo ✓`);
    }catch(err){
      console.error(err);
      toast("Erro ao excluir — verifique a conexão e as regras do Firestore");
      btn.disabled = false; btn.textContent = "Excluir tudo";
    }
  });
}
async function excluirDocsEmLotes(refs){
  for(let i=0;i<refs.length;i+=400){
    const lote = STATE.db.batch();
    refs.slice(i,i+400).forEach(r=>lote.delete(r));
    await lote.commit();
  }
}
async function zerarCampos(opts){
  opts = opts || {};
  if(STATE.db && !navigator.onLine) throw new Error('Sem internet — para excluir tudo é preciso estar conectado.');
  const n = STATE.campos.length;
  if(!STATE.db){
    STATE.campos = [];
    if(opts.catalogo) aplicarCatalogoLocal([], null);
    return n;
  }
  const snapCampos = await STATE.db.collection(FIRESTORE_COLLECTION).get();
  await excluirDocsEmLotes(snapCampos.docs.map(d=>d.ref));
  const snapFotos = await STATE.db.collection(FOTOS_COLLECTION).get();
  // fotos da base de referência (refItem) ficam — só as fotos dos campos saem
  await excluirDocsEmLotes(snapFotos.docs.filter(d=>!d.data().refItem).map(d=>d.ref));
  if(opts.catalogo){
    await STATE.db.collection(CATALOGO_COLLECTION).doc(docCatalogo()).delete();
    if(STATE.safraAtual==="2026/27") await STATE.db.collection(CATALOGO_COLLECTION).doc(CATALOGO_DOC).delete();
  }
  return snapCampos.size;
}

/* ---------------------------------------------------------------
   5) PORTA DE ENTRADA (nome do consultor)
------------------------------------------------------------------*/
function initGate(){
  iniciarBanco();
  const saved = loadConsultorLocal();
  const autorizado = saved && saved.nome && nomeAutorizado(saved.nome);
  if(autorizado){
    STATE.consultor = autorizado;
    // Safra 2026/27 passa a ser a padrão — quem ainda estava em 2025/26 é migrado.
    STATE.safraAtual = (!saved.safra || saved.safra==="2025/26") ? SAFRA_PADRAO : saved.safra;
    if(saved.safra!==STATE.safraAtual || saved.nome!==autorizado) saveConsultorLocal({ nome:autorizado, safra:STATE.safraAtual });
    showApp();
    return;
  }
  if(saved && saved.nome) toast(`"${saved.nome}" não está autorizado — escolha um nome da lista.`);
  document.getElementById('gateNome').innerHTML = `<option value="">— Selecione seu nome —</option>` + CONSULTORES_AUTORIZADOS.map(n=>`<option>${esc(n)}</option>`).join('');
  document.getElementById('gateSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') onGateSubmit(); });
  document.getElementById('gateNome').addEventListener('change', atualizarDicaGate);
  document.getElementById('gateSafra').innerHTML = listaSafras().map(sf=>`<option ${sf===SAFRA_PADRAO?'selected':''}>${sf}</option>`).join('');
  document.getElementById('gateBtn').addEventListener('click', onGateSubmit);
}
async function onGateSubmit(){
  const nome = nomeAutorizado(document.getElementById('gateNome').value);
  const safra = document.getElementById('gateSafra').value || SAFRA_PADRAO;
  const senha = document.getElementById('gateSenha').value;
  if(!nome){ toast("Selecione o seu nome"); return; }
  if(STATE.acessos==null){ toast(navigator.onLine ? "Carregando... tente de novo em instantes" : "📴 O primeiro acesso em um celular precisa de internet"); return; }
  const entrar = ()=>{ STATE.consultor = nome; STATE.safraAtual = safra; saveConsultorLocal({ nome, safra }); showApp(); };
  if(registroSenha(nome)){
    if(!(await conferirSenhaDe(nome, senha))){ toast("Senha incorreta"); document.getElementById('gateSenha').select(); return; }
    entrar(); return;
  }
  // primeiro acesso deste consultor: senha padrão e depois cria a própria
  if(STATE.db && !STATE.acessosDoServidor && !navigator.onLine){ toast("📴 O primeiro acesso precisa de internet"); return; }
  if(semAcento(normNome(senha)) !== SENHA_PRIMEIRO_ACESSO){ toast("No primeiro acesso use a senha padrão"); return; }
  abrirCriarSenha({ nome, obrigatorio:true, aoConcluir: entrar });
}
function showApp(){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('consultorLabel').textContent = `${STATE.consultor} · ${STATE.safraAtual}`;

function camposProtocolo(){ return STATE.campos.filter(c=>!ehDifusao(c)); }

// Número do material: no protocolo vem do catálogo (numeração única para
// todos os campos); em campo de difusão é digitado no próprio material.
function numeroMaterial(campo, mat){
  // ordem de plantio própria do campo (▲ ▼ em "Materiais do campo")
  if(!ehDifusao(campo) && mat.ordem!=null && mat.status!=='excluido') return Number(mat.ordem);
  if(!ehDifusao(campo)){
    const n = numeroCatalogo(mat.nome);
    if(n!=null) return n;
  }
  return (mat.numero==null||mat.numero==='') ? null : Number(mat.numero);
}
function materiaisAtivos(campo){
  return (campo.materiais||[]).filter(m=>m.status!=='excluido')
    .map(m=>({ m, numero:numeroMaterial(campo,m), nome:m.nome }))
    .sort(compararPorNumero)
    .map(x=>x.m);
}
// Materiais que entram na ESTATÍSTICA FINAL (ranking, médias, Tukey, estabilidade,
// L×L e PDFs de resultado). "Fora da estatística" continua no campo, com tudo lançado.
function materiaisEstat(campo){
  return materiaisAtivos(campo).filter(m=>!m.foraEstatistica);
}
function rotuloMaterial(campo, mat){
  const n = numeroMaterial(campo, mat);
  return (n!=null ? `${n} · ` : '') + (mat.nome||'(sem nome)');
}
function materiaisExcluidos(campo){
  return (campo.materiais||[]).filter(m=>m.status==='excluido');
}
/* Ordem de plantio do campo: numera 1, 2, 3... os materiais ativos — os que já
   têm ordem ficam na sequência deles e os novos entram junto dos vizinhos da
   lista do protocolo. Tirar um material fecha o buraco. */
function comOrdem(campo, materiais){
  if(ehDifusao(campo)) return materiais;
  const nCat = m => { const n = numeroCatalogo(m.nome); return n!=null ? n : (m.numero==null||m.numero==='' ? null : Number(m.numero)); };
  const ativos = materiais.filter(m=>m.status!=='excluido');
  const comO = ativos.filter(m=>m.ordem!=null).sort((a,b)=>a.ordem-b.ordem);
  const semO = ativos.filter(m=>m.ordem==null).map(m=>({ m, numero:nCat(m), nome:m.nome })).sort(compararPorNumero).map(x=>x.m);
  // novos entram perto dos vizinhos da lista do protocolo (depois do último com nº menor)
  const seq = comO.slice();
  semO.forEach(m=>{
    const n = nCat(m);
    if(n==null){ seq.push(m); return; }
    let ultMenor = -1, primMaior = -1;
    seq.forEach((x,i)=>{ const nx = nCat(x); if(nx==null) return; if(nx<=n) ultMenor = i; else if(primMaior<0) primMaior = i; });
    const at = ultMenor>=0 ? ultMenor+1 : (primMaior>=0 ? primMaior : seq.length);
    seq.splice(at, 0, m);
  });
  const pos = new Map(seq.map((m,i)=>[m, i+1]));
  return materiais.map(m=> m.status==='excluido' ? (m.ordem!=null ? Object.assign({}, m, { ordem:null }) : m) : (m.ordem===pos.get(m) ? m : Object.assign({}, m, { ordem:pos.get(m) })));
}
async function moverNoCampo(campo, matId, dir){
  if(!podeEditar(campo)) return false;
  campo = STATE.campos.find(c=>c.id===campo.id) || campo;
  const seq = materiaisAtivos(campo);
  const i = seq.findIndex(m=>m.id===matId), j = i+dir;
  if(i<0 || j<0 || j>=seq.length) return false;
  [seq[i], seq[j]] = [seq[j], seq[i]];
  const pos = new Map(seq.map((m,k)=>[m.id, k+1]));
  const materiais = (campo.materiais||[]).map(m=> pos.has(m.id) ? Object.assign({}, m, { ordem:pos.get(m.id) }) : m);
  await salvarCampo(campo.id, { materiais });
  return true;
}
// coloca um material numa posição de plantio: quem estava ali e os seguintes descem uma posição
function posicionarMaterial(campo, materiais, alvoId, pos){
  const base = comOrdem(campo, materiais.map(m=> m.id===alvoId ? Object.assign({}, m, { status:'ok', ordem:null }) : m));
  const seq = base.filter(m=>m.status!=='excluido').sort((a,b)=>a.ordem-b.ordem);
  const i = seq.findIndex(m=>m.id===alvoId);
  if(i<0) return base;
  const [alvo] = seq.splice(i, 1);
  const p = Math.max(1, Math.min(seq.length+1, Math.round(pos) || seq.length+1));
  seq.splice(p-1, 0, alvo);
  const map = new Map(seq.map((m,k)=>[m.id, k+1]));
  return base.map(m=> map.has(m.id) ? Object.assign({}, m, { ordem:map.get(m.id) }) : m);
}
async function moverParaPosicao(campo, matId, pos){
  if(!podeEditar(campo)) return false;
  campo = STATE.campos.find(c=>c.id===campo.id) || campo;

async function inserirMaterialNaPosicao(campo, nome, pos){

async function preencherTodosCampo(campo, vals){
  campo = STATE.campos.find(c=>c.id===campo.id) || campo;
  const patch = {};
  const materiais = (campo.materiais||[]).map(m=>{
    if(m.status==='excluido') return m;
    const o = Object.assign({}, m);
    if(vals.linhas>0) o.numeroLinhas = Math.round(vals.linhas);
    if(vals.comp>0) o.comprimentoM = null;          // passa a valer o padrão do campo
    if(vals.sem>0) o.sementesPorMetro = vals.sem;

  });
  if(vals.comp>0) patch.comprimentoPadraoM = vals.comp;
  if(vals.sem>0) patch.sementesPorMetroPadrao = vals.sem;
  if(vals.esp>0) patch.espacamentoCm = vals.esp;
  patch.materiais = materiais;
  await salvarCampo(campo.id, patch);
}
function areaTotalCampo(campo){

  materiaisAtivos(campo).forEach(m=>{

function getSituacaoCampo(campo){
  const materiais = materiaisAtivos(campo);
  if(materiais.length===0) return { key:"sem_materiais", label:"Sem materiais", cls:"badge-implantacao" };
  const colhidos = materiais.filter(m=>m.colheita?.pesoColhidoKg).length;
  if(colhidos===materiais.length) return { key:"completo", label:"Colheita completa", cls:"badge-colheita" };
  if(colhidos>0) return { key:"andamento", label:`${colhidos}/${materiais.length} colhidos`, cls:"badge-dev" };
  return { key:"andamento", label:`0/${materiais.length} colhidos`, cls:"badge-implantacao" };
}

function uniqueVals(field){
  const set = new Set();
  STATE.campos.forEach(c=>{ if(c[field]) set.add(c[field]); });
  return Array.from(set).sort();

function uniqueMaterialNames(){
  if(STATE.catalogoMateriais.length) return STATE.catalogoMateriais.slice();
  const set = new Set();
  STATE.campos.forEach(c=>(c.materiais||[]).forEach(m=>{ if(m.nome) set.add(m.nome); }));
  return Array.from(set).sort();
}

function campoMatchesFiltro(campo){
  const f = STATE.filtro;
  if(f.fazenda && campo.fazenda!==f.fazenda) return false;
  if(f.produtor && campo.produtor!==f.produtor) return false;
  if(f.consultor && campo.consultor!==f.consultor) return false;
  if(f.safra && campo.safra!==f.safra) return false;
  if(f.material && !materiaisAtivos(campo).some(m=>m.nome===f.material)) return false;
  if(f.situacao && getSituacaoCampo(campo).key!==f.situacao) return false;
  if(f.potencial && campo.potencialProdutivo!==f.potencial) return false;
  if(f.plantioDe && campo.dataPlantio && campo.dataPlantio < f.plantioDe) return false;
  if(f.plantioAte && campo.dataPlantio && campo.dataPlantio > f.plantioAte) return false;
  if(f.texto){
    const t = f.texto.toLowerCase();
    const nomesMateriais = materiaisAtivos(campo).map(m=>m.nome).join(' ');
    const hay = [campo.fazenda,campo.produtor,campo.consultor,nomesMateriais].join(' ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}

function addDias(iso, dias){
  const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}
function proximasAvaliacoes(campos, diasAdiante){
  diasAdiante = diasAdiante ?? 10;
  const itens = [];
  campos.forEach(campo=>{
    cronogramaCampo(campo).forEach(e=>{
      if(e.status==="feito") return;
      const inicio = addDias(campo.dataPlantio, e.diasMin), fim = addDias(campo.dataPlantio, e.diasMax);
      const faltamInicio = e.diasMin - e.dias, faltamFim = e.diasMax - e.dias;
      if(e.status==="futuro" && faltamInicio > diasAdiante) return;
      itens.push({ campo, etapa:e, status:e.status, inicio, fim, faltamInicio, faltamFim, atraso: e.dias - e.diasMax });
    });
  });
  const prio = { atrasado:0, no_prazo:1, futuro:2 };
  itens.sort((a,b)=> prio[a.status]-prio[b.status] || (a.status==='futuro' ? a.faltamInicio-b.faltamInicio : a.faltamFim-b.faltamFim));
  return itens;
}
