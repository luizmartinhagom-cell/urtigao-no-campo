/* ---- Bater ponto: abre o mapa de SATÉLITE em tela cheia, já buscando o
   GPS. O consultor confere o ponto na imagem, ajusta arrastando o alfinete
   (ou tocando no mapa) e confirma — o ponto é gravado na hora, junto com o
   que já estiver preenchido no formulário. */
function abrirMapaPonto(campo){
  const inicial = STATE.tempCoords || (campo.lat!=null ? { lat:campo.lat, lng:campo.lng } : null);
  let ponto = inicial ? { lat:inicial.lat, lng:inicial.lng, precisaoM: inicial.precisaoM||null } : null;
  openModal(`
    <div class="hstack" style="justify-content:space-between;gap:8px;">
      <h3 style="margin:0;">📍 Bater ponto</h3>
      <button type="button" class="btn btn-sm" id="mpFechar">✕</button>
    </div>
    <div id="mpStatus" class="field-hint" style="margin:6px 0;">Buscando sinal de GPS...</div>
    <div id="mapaPonto"></div>
    <div class="field-hint" style="margin:6px 0;">Arraste o alfinete ou toque no mapa para colocar o ponto exatamente sobre a área plantada.</div>
    <div class="hstack" style="gap:8px;">
      <button type="button" class="btn grow" id="mpGps">🎯 Buscar GPS de novo</button>
      <button type="button" class="btn btn-primary grow" id="mpOk" ${ponto?'':'disabled'}>✓ Confirmar ponto</button>
    </div>
  `, { full:true });
  const status = document.getElementById('mpStatus');
  let map, marker, circulo;
  const atualizarStatus = ()=>{
    if(!ponto){ return; }
    status.innerHTML = `📍 ${fmt(ponto.lat,5)}, ${fmt(ponto.lng,5)}${ponto.precisaoM?` · precisão ±${fmtInt(ponto.precisaoM)} m`:' · ajustado no mapa'}`;
    document.getElementById('mpOk').disabled = false;
  };
  const colocar = (lat, lng, precisaoM, centralizar)=>{
    ponto = { lat, lng, precisaoM: precisaoM||null };
    if(!marker){ marker = L.marker([lat,lng], { draggable:true }).addTo(map); marker.on('dragend', ()=>{ const ll = marker.getLatLng(); colocar(ll.lat, ll.lng, null, false); }); }
    else marker.setLatLng([lat,lng]);
    if(circulo){ map.removeLayer(circulo); circulo=null; }
    if(precisaoM) circulo = L.circle([lat,lng], { radius:precisaoM, color:'#FCE23B', weight:2, fillOpacity:.12 }).addTo(map);
    if(centralizar) map.setView([lat,lng], 18);
    atualizarStatus();
  };
  const buscarGps = ()=>{
    if(!navigator.geolocation){ status.textContent = "Este aparelho não oferece GPS ao navegador — marque tocando no mapa."; return; }
    const seguro = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if(!seguro){ status.textContent = "GPS só funciona no link publicado (https) — marque tocando no mapa."; return; }
    status.textContent = "Buscando sinal de GPS... a céu aberto leva alguns segundos.";
    const ok = pos=>{ if(!document.getElementById('mapaPonto')) return; colocar(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy?Math.round(pos.coords.accuracy):null, true); };
    const erro = err=>{
      const msgs = { 1:"Permissão de localização negada — libere o GPS para o navegador ou marque tocando no mapa.", 2:"Não foi possível obter o GPS agora — marque tocando no mapa.", 3:"Sinal de GPS fraco — tente a céu aberto ou marque tocando no mapa." };
      if(document.getElementById('mpStatus')) status.textContent = msgs[err&&err.code] || "Não foi possível obter o GPS.";
    };
    navigator.geolocation.getCurrentPosition(ok, err=>{
      if(err && err.code===3) navigator.geolocation.getCurrentPosition(ok, erro, { enableHighAccuracy:false, timeout:20000, maximumAge:60000 });
      else erro(err);
    }, { enableHighAccuracy:true, timeout:25000, maximumAge:0 });
  };
  setTimeout(()=>{
    if(typeof L==="undefined"){ status.textContent = "Mapa não carregou — verifique a internet."; return; }
    if(!document.getElementById('mapaPonto')) return;
    const centro = ponto || { lat:-22.634, lng:-54.822 };
    map = L.map('mapaPonto', { zoomControl:true }).setView([centro.lat, centro.lng], ponto?17:13);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imagem © Esri' }).addTo(map);
    const rot = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }).addTo(map);
    const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' });
    L.control.layers({ "🛰️ Satélite": sat, "🗺️ Mapa": ruas }, { "Nomes": rot }, { collapsed:true }).addTo(map);
    map.attributionControl.setPrefix(false);
    map.on('click', e=>colocar(e.latlng.lat, e.latlng.lng, null, false));
    if(ponto) colocar(ponto.lat, ponto.lng, ponto.precisaoM, false);
    buscarGps();
  }, 60);
  document.getElementById('mpGps').addEventListener('click', buscarGps);
  document.getElementById('mpFechar').addEventListener('click', closeModal);
  document.getElementById('mpOk').addEventListener('click', async ()=>{
    if(!ponto) return;
    STATE.tempCoords = ponto;
    closeModal();
    // grava o ponto já, junto com o que está no formulário
    const c = STATE.campos.find(x=>x.id===campo.id) || campo;
    const patch = document.getElementById('i_fazenda') ? coletarPatchLocal() : { lat:ponto.lat, lng:ponto.lng, gpsPrecisaoM:ponto.precisaoM };
    await salvarCampo(c.id, patch);
    toast("Ponto gravado ✓");
    if(STATE.telaAtual==='campo') renderCampoDetail();
  });
}

function baterPonto(){
  if(!navigator.geolocation){ toast("Geolocalização não disponível neste dispositivo/navegador"); return; }
  const seguro = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if(!seguro){
    toast("Localização só funciona em HTTPS — abra o link publicado (GitHub Pages), não o arquivo local");
    return;
  }
  const btn = document.getElementById('btnBaterPonto');
  if(btn){ btn.disabled = true; btn.textContent = "Obtendo..."; }
  toast("Obtendo localização... isso pode levar alguns segundos a céu aberto");

  const onErro = (err)=>{
    if(btn){ btn.disabled = false; btn.textContent = "Bater ponto"; }
    console.error(err);
    const msgs = {
      1: "Permissão de localização negada — ative o GPS/localização para o navegador nas configurações do celular e tente de novo.",
      2: "Não foi possível determinar a localização agora — verifique se o GPS do celular está ligado e tente novamente a céu aberto.",
      3: "Tempo esgotado esperando o GPS — sinal fraco (comum embaixo de galpão/árvore). Tente novamente a céu aberto; pode levar até 30s no primeiro ponto do dia."
    };
    toast(msgs[err && err.code] || "Não foi possível obter a localização — verifique a permissão de GPS");
  };

  const onSucesso = (pos)=>{
    if(btn){ btn.disabled = false; btn.textContent = "Bater ponto"; }
    STATE.tempCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, precisaoM: pos.coords.accuracy ? Math.round(pos.coords.accuracy) : null };
    atualizarTextoLocal();
    initMiniMap(STATE.tempCoords.lat, STATE.tempCoords.lng, { editavel:true, precisaoM: STATE.tempCoords.precisaoM });
    toast("Ponto marcado ✓ — confira na imagem de satélite e arraste o alfinete se precisar");
  };

  // Primeira tentativa: alta precisão, tempo maior (GPS puro pode demorar a "esquentar" no campo).
  navigator.geolocation.getCurrentPosition(onSucesso, (err)=>{
    if(err && err.code === 3){
      // Timeout na alta precisão: tenta de novo com precisão normal (usa rede/Wi-Fi/último fix), mais rápido.
      toast("Sinal de GPS fraco — tentando localização aproximada...");
      navigator.geolocation.getCurrentPosition(onSucesso, onErro, { enableHighAccuracy:false, timeout:20000, maximumAge:60000 });
    } else {
      onErro(err);
    }
  }, { enableHighAccuracy:true, timeout:25000, maximumAge:0 });
}

/* Mapa do ponto do campo — imagem de SATÉLITE (Esri World Imagery, gratuita)
   com nomes de lugares por cima; dá para trocar para mapa de ruas. Quem pode
   editar o campo arrasta o alfinete ou toca no mapa para ajustar o ponto
   exatamente sobre a área plantada. */
function initMiniMap(lat, lng, opts){
  opts = opts || {};
  const box = document.getElementById('miniMap');
  if(!box || typeof L === "undefined") return;
  box.style.display = "block";
  setTimeout(()=>{
    if(!document.getElementById('miniMap')) return; // a tela mudou antes do mapa abrir
    if(STATE.miniMapInstance){ try{ STATE.miniMapInstance.remove(); }catch(e){} STATE.miniMapInstance=null; }
    const map = L.map('miniMap', { zoomControl:true, attributionControl:true }).setView([lat,lng], 17);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imagem © Esri' });
    const rotulos = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 });
    const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' });
    sat.addTo(map); rotulos.addTo(map);
    L.control.layers({ "🛰️ Satélite": sat, "🗺️ Mapa": ruas }, { "Nomes": rotulos }, { position:'topright', collapsed:true }).addTo(map);
    map.attributionControl.setPrefix(false);
    const editavel = !!opts.editavel;
    const marker = L.marker([lat,lng], { draggable: editavel }).addTo(map);
    let circulo = null;
    if(opts.precisaoM && opts.precisaoM>0){
      circulo = L.circle([lat,lng], { radius:opts.precisaoM, color:'#FCE23B', weight:2, fillOpacity:.12 }).addTo(map);
    }
    const mover = (ll)=>{
      marker.setLatLng(ll);
      if(circulo){ map.removeLayer(circulo); circulo=null; }
      STATE.tempCoords = { lat: ll.lat, lng: ll.lng, precisaoM: null };
      atualizarTextoLocal();
    };
    if(editavel){
      marker.on('dragend', ()=>mover(marker.getLatLng()));
      map.on('click', e=>mover(e.latlng));
    }
    STATE.miniMapInstance = map;
    STATE.miniMapMarker = marker;
  }, 30);
}
function atualizarTextoLocal(){
  const txt = document.getElementById('i_localTexto');
  const c = STATE.tempCoords;
  if(!txt) return;
  if(!c){ txt.textContent = 'Nenhum ponto marcado'; return; }
  txt.innerHTML = `${fmt(c.lat,5)}, ${fmt(c.lng,5)}${c.precisaoM?` <span style="color:var(--ink-soft);">(±${fmtInt(c.precisaoM)} m)</span>`:''}
    · <a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" rel="noopener">abrir no Maps</a>`;
  const aviso = document.getElementById('i_localAviso');
  if(aviso) aviso.style.display = '';
}

function getEtapaMaterial(mat){
  const co = mat.colheita||{}, ei = mat.estandeInicial||{};
  const eng = mat.engalhamento||{}, san = mat.sanidadeAltura||{};
  if(co.pesoColhidoKg) return { key:"colheita", label:"Colheita", cls:"badge-colheita", progress:100 };
  if(san.nota!=null) return { key:"sanidadeAltura", label:"Sanidade e altura", cls:"badge-dev", progress:70 };
  if(eng.nota!=null) return { key:"engalhamento", label:"Engalhamento", cls:"badge-dev", progress:55 };
  if(ei.plantasContadas) return { key:"estande", label:"Estande inicial", cls:"badge-estande", progress:40 };
  if(mat.comprimentoM) return { key:"parcela", label:"Parcela definida", cls:"badge-implantacao", progress:20 };
  return { key:"novo", label:"Novo", cls:"badge-implantacao", progress:5 };
}

function materialRowHTML(campo, mat){
  const espacamentoCm = campo.espacamentoCm;
  const etapa = getEtapaMaterial(mat);
  const larguraCalc = calcLarguraM(mat.numeroLinhas, espacamentoCm);
  const area = areaParcela(campo, mat);
  const comp = comprimentoParcela(campo, mat);
  const co = mat.colheita||{};
  let prodTxt = "";
  if(co.pesoColhidoKg){
    // produtividade sempre pela ÁREA COLHIDA (antes dividia pela área plantada da parcela — corrigido)
    const pr = produtividadeMaterial(campo, mat);
    if(!isNaN(pr.scHa)) prodTxt = `<span>🌾 ${fmt(pr.scHa,1)} sc/ha</span>`;
  }
  return `
    <div class="campo-card" data-matid="${mat.id}">
      <div class="campo-top">
        <div class="campo-material">${esc(rotuloMaterial(campo, mat))}</div>
        <span class="badge ${etapa.cls}">${etapa.label}</span>
      </div>
      ${mat.foraEstatistica ? `<div style="margin:4px 0;"><span class="badge badge-danger">🚫 Fora da estatística final</span></div>` : ''}
      <div class="progress-track"><div class="progress-fill" style="width:${etapa.progress}%"></div></div>
      <div class="campo-meta">
        ${mat.numeroLinhas ? `<span>🚜 ${fmtInt(mat.numeroLinhas)} linhas</span>` : ""}
        ${!isNaN(comp) ? `<span>↔️ ${fmt(comp,1)} m</span>` : ""}
        ${!isNaN(larguraCalc) ? `<span>↕️ ${fmt(larguraCalc,2)} m</span>` : ""}
        ${!isNaN(area) ? `<span>📐 ${fmtArea(area)}</span>` : ""}
        ${prodTxt}
      </div>
    </div>
  `;
}

      <summary>⚙️ Lista padrão do protocolo · ${catalogo.length} materiais${STATE.catalogoDono?` · responsável ${esc(STATE.catalogoDono)}`:''}</summary>

async function confirmarAddCatalogo(campo){

  if(!(await inserirMaterialNaPosicao(campo, nome, pos))) return;
  toast("Material inserido ✓");
  abrirModalSelecionarMateriais(STATE.campos.find(x=>x.id===campo.id) || campo);
  const novo = document.getElementById('novoCatalogoNome'); if(novo) novo.focus();

/* ---- Colar lista / importar planilha para a lista padrão do protocolo ----
   Dica para foto: o Google Lens (Android) e o Texto ao Vivo (iPhone) leem o
   texto de uma foto da lista — é só copiar e colar aqui. */
function interpretarListaMateriais(linhas){
  const itens = [];
  linhas.forEach(l=>{
    const t = String(l||'').replace(/\s+/g,' ').trim();
    if(!t) return;
    if(/^(n[ºo°]?\.?|n[uú]mero|material|materiais|cultivar|protocolo|lista)\b/i.test(t) && t.split(' ').length<=3) return;
    const m = t.match(/^(\d{1,3})\s*[-–.):;]?\s+(.+)$/) || t.match(/^(\d{1,3})\s*[-–.):;]\s*(.+)$/);
    if(m) itens.push({ numero:parseInt(m[1],10), nome:m[2].trim() });
    else itens.push({ numero:null, nome:t });
  });
  const vistos = new Set();
  return itens.filter(i=>{ const k = normNome(i.nome); if(!k || vistos.has(k)) return false; vistos.add(k); return true; });
}
// próximo número livre considerando o catálogo e os números que vieram na lista
function proximoNumeroImportacao(itens){
  const nums = itens.map(i=>i.numero).filter(n=>n!=null);
  return Math.max(proximoNumeroCatalogo(), nums.length ? Math.max(...nums)+1 : 1);
}
function abrirModalImportarLista(campo){
  openModal(`
    <h3>📋 Colar lista ou importar planilha</h3>
    <p class="field-hint" style="margin-bottom:8px;">Um material por linha — pode começar com o número (ex.: <b>1 UR 0101</b>). Também aceita planilha Excel ou CSV (coluna do número e coluna do nome).</p>
    <div class="field-hint" style="background:var(--yellow-soft);border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--ink);">📸 <b>Tem a lista só em papel ou foto?</b> Abra a foto no celular e use o <b>Google Lens</b> (Android: "Texto" → selecionar tudo → copiar) ou o <b>Texto ao Vivo</b> (iPhone: toque e segure o texto → copiar). Depois cole aqui.</div>
    <div class="field"><label>Lista</label><textarea id="impTexto" style="min-height:140px;" placeholder="1 UR 0101&#10;2 UR 0202&#10;3 UR 0303"></textarea></div>
    <div class="field"><label>ou arquivo (Excel / CSV / TXT)</label><input type="file" id="impArquivo" accept=".xlsx,.xls,.csv,.txt"></div>
    <div id="impPrevia"></div>
    <button class="btn btn-block" style="margin-top:8px;" id="impVoltar">← Voltar</button>
  `, { wide:true });
  let itens = [];
  const previa = ()=>{
    const box = document.getElementById('impPrevia');
    if(!itens.length){ box.innerHTML=''; return; }
    const existentes = new Set((STATE.catalogoItens||[]).map(i=>normNome(i.nome)));
    let prox = proximoNumeroImportacao(itens);
    box.innerHTML = `
      <div class="section-title">${itens.length} material(is) encontrados</div>
      <div style="max-height:34vh;overflow-y:auto;">${itens.map((it,i)=>{ const ja = existentes.has(normNome(it.nome)); return `
        <label class="hstack" style="gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;">
          <input type="checkbox" data-impidx="${i}" ${ja?'':'checked'}>
          <span class="cat-num-ro">${it.numero ?? '≈'+(prox++)}</span><span style="flex:1;">${esc(it.nome)}</span>
          ${ja?'<span class="field-hint" style="margin:0;">já na lista</span>':''}
        </label>`; }).join('')}</div>
      ${campo ? `<label class="hstack" style="gap:8px;font-size:13px;margin-top:8px;"><input type="checkbox" id="impIncluirCampo" ${podeEditar(campo)?'checked':'disabled'}> Incluir também neste campo</label>` : ''}
      <button class="btn btn-primary btn-block" style="margin-top:8px;" id="impConfirmar">Adicionar à lista do protocolo</button>`;
    document.getElementById('impConfirmar').addEventListener('click', async ()=>{
      const marcados = Array.from(document.querySelectorAll('[data-impidx]:checked')).map(el=>itens[+el.dataset.impidx]);
      if(!marcados.length){ toast("Nada selecionado"); return; }
      let n = proximoNumeroImportacao(itens);
      const novos = marcados.filter(it=>!(STATE.catalogoItens||[]).some(c=>normNome(c.nome)===normNome(it.nome)))
        .map(it=>({ nome:it.nome, numero: it.numero ?? n++ }));
      const ok = await salvarCatalogo((STATE.catalogoItens||[]).concat(novos));
      if(!ok) return;
      if(campo && document.getElementById('impIncluirCampo')?.checked){
        const c = STATE.campos.find(x=>x.id===campo.id) || campo;
        let mats = (c.materiais||[]).slice();
        marcados.forEach(it=>{
          const idx = mats.findIndex(m=>normNome(m.nome)===normNome(it.nome));
          if(idx===-1) mats.push(novoMaterialObj(c, it.nome)); else mats[idx] = { ...mats[idx], status:'ok' };
        });
        await salvarCampo(c.id, { materiais: comOrdem(c, mats) });
      }
      toast(`${novos.length} material(is) adicionado(s) ✓`);
      if(campo) abrirModalSelecionarMateriais(STATE.campos.find(x=>x.id===campo.id) || campo); else abrirModalListaProtocolo();
    });
  };
  document.getElementById('impTexto').addEventListener('input', e=>{ itens = interpretarListaMateriais(e.target.value.split(/\r?\n/)); previa(); });
  document.getElementById('impArquivo').addEventListener('change', async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      let linhas = [];
      if(/\.(xlsx|xls)$/i.test(f.name)){
        if(typeof XLSX==="undefined"){ toast("Leitor de planilha não carregou — verifique a internet"); return; }
        const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false });
        linhas = rows.map(r=>r.filter(v=>v!==null && v!==undefined && String(v).trim()!=='').join(' '));
      } else {
        linhas = (await f.text()).split(/\r?\n/).map(l=>l.replace(/[;,\t]+/g,' '));
      }
      itens = interpretarListaMateriais(linhas);
      document.getElementById('impTexto').value = itens.map(i=>(i.numero!=null?i.numero+' ':'')+i.nome).join('\n');
      previa();
      if(!itens.length) toast("Não encontrei materiais nesse arquivo");
    }catch(err){ console.error(err); toast("Não foi possível ler o arquivo"); }
  });
  document.getElementById('impVoltar').addEventListener('click', ()=>campo ? abrirModalSelecionarMateriais(STATE.campos.find(x=>x.id===campo.id)||campo) : abrirModalListaProtocolo());
}

function novoMaterialObj(campo, nome, extra){
  return Object.assign({ id:uid(), nome, status:'ok', sementesPorMetro: campo.sementesPorMetroPadrao ?? null, numeroLinhas:null, estandeInicial:{}, colheita:{} }, extra||{});
}
async function definirStatusMaterialCampo(campo, nome, status){
  if(!podeEditar(campo)){ toast("Sem permissão"); return; }
  let materiais = campo.materiais||[];
  const idx = materiais.findIndex(m=>normNome(m.nome)===normNome(nome));
  if(idx===-1){
    materiais = materiais.concat([novoMaterialObj(campo, nome, { status })]);
  }else{
    materiais = materiais.map((m,i)=> i===idx ? Object.assign({}, m, { status }) : m);
  }
  await salvarCampo(campo.id, { materiais: comOrdem(campo, materiais) });
}
async function marcarTodosOk(campo){
  if(!podeEditar(campo)){ toast("Sem permissão"); return; }
  let materiais = (campo.materiais||[]).slice();
  (STATE.catalogoItens||[]).forEach(it=>{
    const idx = materiais.findIndex(m=>normNome(m.nome)===normNome(it.nome));
    if(idx===-1) materiais.push(novoMaterialObj(campo, it.nome));
    else if(materiais[idx].status!=='ok') materiais[idx] = Object.assign({}, materiais[idx], { status:'ok' });
  });
  await salvarCampo(campo.id, { materiais: comOrdem(campo, materiais) });
}

/* ---------- Campo de DIFUSÃO: material livre (fora do protocolo) ---------- */
function abrirModalMaterialDifusao(campo){
  const proxNum = (campo.materiais||[]).reduce((mx,m)=>Math.max(mx, num(m.numero)||0), 0) + 1;
  openModal(`
    <h3>+ Material no campo de difusão</h3>
    <p class="field-hint" style="margin-bottom:10px;">Campos de difusão não usam a lista do protocolo — digite o material plantado (qualquer marca/cultivar).</p>
    <div class="grid2">
      <div class="field"><label>Nº (ordem no campo)</label><input id="md_num" type="number" inputmode="numeric" step="1" value="${proxNum}"></div>
      <div class="field"><label>Linhas plantadas</label><input id="md_linhas" type="number" inputmode="numeric" step="1" placeholder="Ex: 9"></div>
    </div>
    <div class="field"><label>Material</label><input id="md_nome" placeholder="Ex: UR 8801 RR"></div>
    <button class="btn btn-primary btn-block" id="md_salvar">Adicionar</button>
    <button class="btn btn-block" style="margin-top:8px;" id="md_fechar">Fechar</button>
  `);
  document.getElementById('md_fechar').addEventListener('click', closeModal);
  const salvar = async ()=>{
    const nome = document.getElementById('md_nome').value.trim();
    if(!nome){ toast("Digite o nome do material"); return; }
    const c = STATE.campos.find(x=>x.id===campo.id)||campo;
    if((c.materiais||[]).some(m=>normNome(m.nome)===normNome(nome))){ toast("Esse material já está neste campo"); return; }
    const n = num(document.getElementById('md_num').value), l = num(document.getElementById('md_linhas').value);
    const mat = novoMaterialObj(c, nome, { numero: isNaN(n)?null:Math.round(n), numeroLinhas: isNaN(l)||l<=0?null:Math.round(l) });
    await salvarCampo(c.id, { materiais:(c.materiais||[]).concat([mat]) });
    toast("Material adicionado ✓");
    abrirModalMaterialDifusao(STATE.campos.find(x=>x.id===campo.id)||c);
    document.getElementById('md_nome').focus();
  };
  document.getElementById('md_salvar').addEventListener('click', salvar);
  document.getElementById('md_nome').addEventListener('keydown', e=>{ if(e.key==='Enter') salvar(); });
}

function nomeDoenca(k){ return DOENCAS_SOJA.find(d=>d.k===k)?.nome || k; }
// Ocorrências gravadas; dados antigos (só "doencas") viram ocorrências confirmadas sem grau.
function diagnosticosDoMaterial(san){
  san = san || {};
  if(Array.isArray(san.diagnosticos)) return san.diagnosticos.map(d=>({ ...d }));
  return (san.doencas||[]).map(k=>({ id:uid(), cat:'doenca', item:k, status:'confirmada', grau:null, obs:'', data:san.data||'' }));
}

/* ---- Base de fotos de referência da equipe ----
   Guardadas na mesma coleção das fotos de sanidade (fotos_urtigao), com o
   campo refItem = "categoria:item" — assim valem as mesmas regras do
   Firestore já publicadas. "Excluir todos os campos" NÃO apaga esta base. */
function chaveRef(cat,k){ return `${cat}:${k}`; }
async function carregarRefFotos(cat, k){
  const key = chaveRef(cat,k);
  if(STATE.refFotos[key]) return STATE.refFotos[key];
  if(!STATE.db){ STATE.refFotos[key] = STATE.refFotos[key] || []; return STATE.refFotos[key]; }
  try{
    const snap = await STATE.db.collection(FOTOS_COLLECTION).where('refItem','==',key).get();
    STATE.refFotos[key] = snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  }catch(e){ console.error("Fotos de referência:", e); STATE.refFotos[key] = []; }
  return STATE.refFotos[key];
}
async function adicionarRefFoto(cat, k, base64, meta){
  const key = chaveRef(cat,k);
  const reg = { base64, refItem:key, refCat:cat, autor:STATE.consultor, criadoEm:new Date().toISOString(), fazenda:meta?.fazenda||null };
  if(STATE.db){ const doc = STATE.db.collection(FOTOS_COLLECTION).doc(); reg.id = doc.id; gravarSemEsperar(doc.set(reg)); }
  else reg.id = uid();
  STATE.refFotos[key] = [reg].concat(STATE.refFotos[key]||[]);
}
async function removerRefFoto(cat, k, id){
  const key = chaveRef(cat,k);
  if(STATE.db) gravarSemEsperar(STATE.db.collection(FOTOS_COLLECTION).doc(id).delete());
  STATE.refFotos[key] = (STATE.refFotos[key]||[]).filter(f=>f.id!==id);
}
function linkFotosInternet(cat, item){
  if(cat==='deficiencia') return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(`deficiência de ${item.nome.replace(/\s*\(.*\)/,'')} soja milho sintomas folha`)}`;
  const extra = cat==='daninha' ? 'planta daninha' : cat==='nematoide' ? 'nematoide soja raiz sintoma' : cat==='praga' ? 'praga soja' : 'soja sintoma';
  return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(`${item.nome} ${item.agente.split(',')[0]} ${extra}`)}`;
}

/* ---- Guia de identificação (modal) ----
   opts: { cat, ctx } — ctx = { campo, mat, onAdd(diag) } quando aberto a
   partir da avaliação de sanidade de um material (permite registrar). */
function abrirGuia(opts){
  opts = opts || {};
  STATE.guia = { cat: opts.cat||'doenca', filtros:new Set(), view:'lista', itemK:null, foto:null, refIdx:0,
    aval:{ status:null, grau:null, obs:'' }, fotoNaBase:false, ctx: opts.ctx||null };
  renderGuia();
}
function abrirGuiaDoencas(){ abrirGuia({ cat:'doenca' }); } // compatibilidade

function tplRefViewer(cat, item){
  const g = STATE.guia, key = chaveRef(cat,item.k);
  const fotos = STATE.refFotos[key];
  if(!fotos) return `<div class="ref-vazio">Carregando fotos de referência...</div>`;
  if(!fotos.length) return `<div class="ref-vazio">📷 Ainda não há foto de referência da equipe para este item.<br><a href="${linkFotosInternet(cat,item)}" target="_blank" rel="noopener">🔎 Ver fotos na internet</a></div>`;
  const i = Math.min(g.refIdx, fotos.length-1), f = fotos[i];
  return `
    <div class="ref-box">
      <img src="${f.base64}" alt="Referência ${esc(item.nome)}">
      ${fotos.length>1?`<button type="button" class="ref-nav ref-prev" data-refnav="-1">‹</button><button type="button" class="ref-nav ref-next" data-refnav="1">›</button>`:''}
      <div class="ref-cred">${i+1}/${fotos.length} · ${esc(f.autor||'')}${f.fazenda?' · '+esc(f.fazenda):''}${f.criadoEm?' · '+fmtDate(f.criadoEm.slice(0,10)):''}
        ${mesmoConsultor(f.autor, STATE.consultor)?` · <a href="#" data-refrm="${f.id}" style="color:#FFB4AA;">remover</a>`:''}</div>
    </div>`;
}

function wireGuia(item){
  const g = STATE.guia, $ = id=>document.getElementById(id);
  const on = (sel, fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener('click', e=>fn(el, e)));
  if($('gFechar')) $('gFechar').addEventListener('click', ()=>{ STATE.guia = null; closeModal(); });
  on('[data-gcat]', el=>{ g.cat = el.dataset.gcat; g.filtros = new Set(); g.view='lista'; g.itemK=null; renderGuia(); });
  on('[data-gfil]', el=>{ const k=el.dataset.gfil; g.filtros.has(k)?g.filtros.delete(k):g.filtros.add(k); renderGuia(); });
  if($('gLimpar')) $('gLimpar').addEventListener('click', ()=>{ g.filtros.clear(); renderGuia(); });
  on('[data-gitem]', el=>{ g.itemK = el.dataset.gitem; g.view='item'; g.refIdx=0; renderGuia(); });
  if($('gVoltar')) $('gVoltar').addEventListener('click', ()=>{ g.view = g.view==='comparar' ? 'item' : 'lista'; renderGuia(); });
  if($('gComparar')) $('gComparar').addEventListener('click', ()=>{ g.view='comparar'; g.aval={ status:null, grau:null, obs:'' }; g.fotoNaBase=false; renderGuia(); });
  on('[data-refnav]', el=>{ const n = (STATE.refFotos[chaveRef(g.cat,item.k)]||[]).length; g.refIdx = (g.refIdx + parseInt(el.dataset.refnav,10) + n) % n; renderGuia(); });
  on('[data-refrm]', async (el,e)=>{ e.preventDefault(); if(!confirm("Remover esta foto da base de referência?")) return;
    try{ await removerRefFoto(g.cat, item.k, el.dataset.refrm); g.refIdx=0; renderGuia(); toast("Foto removida da base"); }catch(err){ console.error(err); toast("Erro ao remover — verifique a conexão"); } });
  const fotoIn = $('gFotoInput');
  if(fotoIn) fotoIn.addEventListener('change', async ()=>{
    const f = fotoIn.files[0]; if(!f) return;
    try{ toast("Processando foto..."); g.foto = await comprimirImagem(f); g.fotoNaBase=false; renderGuia(); }
    catch(e){ console.error(e); toast("Não foi possível ler a foto"); }
  });
  const obs = $('gObs'); if(obs) obs.addEventListener('input', ()=>{ g.aval.obs = obs.value; });
  on('[data-gstatus]', el=>{ g.aval.status = el.dataset.gstatus; if(g.aval.status==='descartada') g.aval.grau=null; renderGuia(); });
  on('[data-ggrau]', el=>{ g.aval.grau = parseInt(el.dataset.ggrau,10); renderGuia(); });
  if($('gRegistrar')) $('gRegistrar').addEventListener('click', ()=>{
    if(!g.aval.status){ toast("Diga se a suspeita se confirma, fica em dúvida ou é descartada"); return; }
    if(g.aval.status!=='descartada' && g.aval.grau==null){ toast("Escolha o grau de severidade"); return; }
    const diag = { id:uid(), cat:g.cat, item:item.k, status:g.aval.status, grau:g.aval.grau, obs:(g.aval.obs||'').trim(), data:todayISO(), fotoB64:g.foto||null };
    const ctx = g.ctx; STATE.guia = null; closeModal();
    ctx.onAdd(diag);
    toast("Ocorrência registrada — toque em Salvar para gravar");
  });
  if($('gAddBase')) $('gAddBase').addEventListener('click', async ()=>{
    const b = $('gAddBase'); b.disabled = true; b.textContent = "Enviando...";
    try{ await adicionarRefFoto(g.cat, item.k, g.foto, { fazenda: g.ctx?.campo?.fazenda }); g.fotoNaBase = true; g.refIdx = 0; renderGuia(); toast("Foto adicionada à base de referência ✓"); }
    catch(err){ console.error(err); toast("Erro ao enviar — verifique a conexão"); b.disabled=false; b.textContent="⭐ Usar minha foto como referência da equipe"; }
  });
}

/* ---------------------------------------------------------------
   10) MATERIAL — DETALHE (4 abas: Estande, Engalhamento, Sanidade e altura, Colheita)
------------------------------------------------------------------*/
const TABS_MATERIAL = [
  { key:"estande", label:"Estande", num:1 },
  { key:"engalhamento", label:"Engalhamento", num:2 },
  { key:"sanidadeAltura", label:"Sanidade", num:3 },
  { key:"colheita", label:"Colheita", num:4 }
];
// Campos de difusão não são avaliados — só plantio e colheita.
const TABS_DIFUSAO = [
  { key:"estande", label:"Plantio", num:1 },
  { key:"colheita", label:"Colheita", num:2 }
];
function tabsDoCampo(campo){ return ehDifusao(campo) ? TABS_DIFUSAO : TABS_MATERIAL; }

/* ---------- Editar material depois de lançado (nome, nº, linhas, sementes,
   comprimento e se entra na estatística final). Avaliações não são tocadas. ---------- */
function abrirModalEditarMaterial(campo, mat){
  campo = STATE.campos.find(c=>c.id===campo.id) || campo;
  mat = (campo.materiais||[]).find(m=>m.id===mat.id) || mat;
  const nAtual = numeroMaterial(campo, mat);
  const compPadrao = num(campo.comprimentoPadraoM);
  openModal(`
    <h3>✏️ Editar material</h3>
    <p class="field-hint" style="margin-bottom:10px;">${esc(campo.fazenda||'')} · as avaliações já lançadas (estande, notas, colheita, fotos) continuam salvas.</p>
    <div class="grid2">
      <div class="field"><label>Nº${ehDifusao(campo)?'':' (ordem no campo)'}</label><input id="em_num" type="number" inputmode="numeric" step="1" value="${nAtual??''}" ${ehDifusao(campo)?'':'readonly style="background:#f1f4f2;"'}></div>
      <div class="field"><label>Linhas plantadas</label><input id="em_linhas" type="number" inputmode="numeric" step="1" value="${mat.numeroLinhas??''}"></div>
    </div>
    <div class="field"><label>Nome do material</label><input id="em_nome" value="${esc(mat.nome||'')}"></div>
    <div class="grid2">
      <div class="field"><label>Sementes por metro</label><input id="em_sem" type="number" step="any" inputmode="decimal" value="${mat.sementesPorMetro??''}"></div>
      <div class="field"><label>Comprimento (m)</label><input id="em_comp" type="number" step="any" inputmode="decimal" value="${mat.comprimentoM??''}" placeholder="${compPadrao>0?'Padrão: '+fmt(compPadrao,0)+' m':''}"></div>
    </div>
    <div class="card" style="padding:10px 12px;margin:6px 0 10px;">
      <label class="hstack" style="gap:10px;font-size:14px;align-items:flex-start;">
        <input type="checkbox" id="em_estat" ${mat.foraEstatistica?'':'checked'} style="width:20px;height:20px;margin-top:1px;">
        <span><b>Considerar na estatística final</b><br><span class="field-hint" style="margin:0;">Desmarque para tirar este material do ranking, médias, Tukey, estabilidade, L × L e dos PDFs de resultado (ex.: parcela com problema, acamou, falha de plantio). Nada é apagado.</span></span>
      </label>
      <div class="field" id="em_motivoBox" style="margin:8px 0 0;${mat.foraEstatistica?'':'display:none;'}"><label>Motivo (opcional)</label><input id="em_motivo" value="${esc(mat.motivoForaEstat||'')}" placeholder="Ex: parcela com falha de plantio"></div>
    </div>
    <button class="btn btn-primary btn-block" id="em_salvar">Salvar alterações</button>
    <button class="btn btn-block" style="margin-top:8px;" id="em_cancelar">Cancelar</button>
  `);
  const chk = document.getElementById('em_estat');
  chk.addEventListener('change', ()=>{ document.getElementById('em_motivoBox').style.display = chk.checked ? 'none' : ''; });
  document.getElementById('em_cancelar').addEventListener('click', closeModal);
  document.getElementById('em_salvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('em_nome').value.trim();
    if(!nome){ toast("Informe o nome do material"); return; }
    const c = STATE.campos.find(x=>x.id===campo.id) || campo;
    if((c.materiais||[]).some(m=>m.id!==mat.id && m.status!=='excluido' && normNome(m.nome)===normNome(nome))){ toast("Já existe outro material com esse nome neste campo"); return; }
    const numDig = num(document.getElementById('em_num').value);
    const patch = {
      nome,
      numeroLinhas: num(document.getElementById('em_linhas').value) || null,
      sementesPorMetro: num(document.getElementById('em_sem').value) || null,
      comprimentoM: num(document.getElementById('em_comp').value) || null,
      foraEstatistica: !chk.checked,
      motivoForaEstat: chk.checked ? null : (document.getElementById('em_motivo').value.trim() || null)
    };
    // nº: no protocolo vem da lista padrão pelo nome; se o nome não estiver na
    // lista (ou o nº digitado for diferente), guarda o nº no próprio material
    // nº: no campo de difusão é digitado; no protocolo é a ordem de plantio (▲ ▼ em Materiais do campo)
    if(ehDifusao(c)) patch.numero = isNaN(numDig) ? null : Math.round(numDig);
    await salvarMaterial(c, mat.id, patch);
    closeModal();
    toast("Material atualizado ✓");
    renderAll();
  });
}

/* ---------- Fotos das avaliações (qualquer etapa) ----------
   Ficam na coleção fotos_urtigao com campoId, materialId e etapa — fora do
   documento do campo, então anexar uma foto não apaga o que está sendo
   digitado na tela e não pesa no limite de 1 MB do campo. */
const ETAPA_FOTO_LABEL = { estande:'Estande', engalhamento:'Engalhamento', sanidadeAltura:'Sanidade / altura', colheita:'Colheita' };
async function listarFotosAvaliacao(campoId, materialId){
  if(!STATE.db) return (STATE.fotosAvalLocal||[]).filter(f=>f.materialId===materialId);
  try{
    const snap = await STATE.db.collection(FOTOS_COLLECTION).where('materialId','==',materialId).get();
    return snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(f=>f.etapa && f.campoId===campoId)
      .sort((a,b)=>(a.criadoEm||'').localeCompare(b.criadoEm||''));
  }catch(e){ console.error(e); return []; }
}
function anexarBlocoFotos(container, campo, mat, etapa, editavel){
  if(!container) return;
  const box = document.createElement('div');
  box.className = 'card vstack fotos-aval';
  box.style.marginTop = '12px';
  box.innerHTML = `
    <div class="hstack" style="justify-content:space-between;align-items:center;">
      <div class="section-title" style="margin:0;">📷 Fotos do material</div>
      ${editavel ? `<label class="btn btn-sm btn-yellow" style="margin:0;cursor:pointer;">＋ Foto<input type="file" accept="image/*" multiple class="fa-input" style="display:none;"></label>` : ''}
    </div>
    <div class="field-hint" style="margin:0;">Salvas na hora, separadas por etapa — não precisa tocar em Salvar.</div>
    <div class="fa-grid" style="display:flex;flex-wrap:wrap;gap:8px;"><span class="field-hint">Carregando...</span></div>`;
  container.appendChild(box);
  const grid = box.querySelector('.fa-grid');
  let fotos = [];
  const desenhar = async ()=>{
    fotos = await listarFotosAvaliacao(campo.id, mat.id);
    if(!box.isConnected) return;
    if(!fotos.length){ grid.innerHTML = `<span class="field-hint" style="margin:0;">Nenhuma foto ainda.</span>`; return; }
    const ordem = ['estande','engalhamento','sanidadeAltura','colheita'];
    fotos.sort((a,b)=> (a.etapa===etapa?-1:0)-(b.etapa===etapa?-1:0) || ordem.indexOf(a.etapa)-ordem.indexOf(b.etapa));
    grid.innerHTML = fotos.map((f,i)=>`
      <div style="position:relative;width:84px;">
        <img data-faver="${i}" src="${f.base64}" style="width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid ${f.etapa===etapa?'var(--green)':'var(--line)'};cursor:pointer;">
        <div style="font-size:10.5px;color:var(--ink-soft);line-height:1.2;margin-top:2px;">${esc(ETAPA_FOTO_LABEL[f.etapa]||f.etapa)}<br>${f.criadoEm?fmtDate(f.criadoEm.slice(0,10)):''}</div>
        ${editavel ? `<button type="button" data-farm="${i}" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:1;">✕</button>` : ''}
      </div>`).join('');
    grid.querySelectorAll('[data-faver]').forEach(img=>img.addEventListener('click', ()=>abrirLightboxFotos([{ base64: fotos[+img.dataset.faver].base64 }])));
    grid.querySelectorAll('[data-farm]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm('Apagar esta foto?')) return;
      const f = fotos[+b.dataset.farm];
      if(STATE.db && f.id) gravarSemEsperar(STATE.db.collection(FOTOS_COLLECTION).doc(f.id).delete());
      else STATE.fotosAvalLocal = (STATE.fotosAvalLocal||[]).filter(x=>x!==f);
      toast("Foto apagada"); desenhar();
    }));
  };
  const inp = box.querySelector('.fa-input');
  if(inp) inp.addEventListener('change', async ()=>{
    const files = Array.from(inp.files||[]); if(!files.length) return;
    toast(files.length>1 ? `Salvando ${files.length} fotos...` : "Salvando foto...");
    for(const file of files){
      try{
        const base64 = await comprimirImagem(file);
        const reg = { base64, campoId:campo.id, materialId:mat.id, material:mat.nome||null, etapa, consultor:STATE.consultor||null, criadoEm:new Date().toISOString() };
        if(STATE.db) gravarSemEsperar(STATE.db.collection(FOTOS_COLLECTION).doc().set(reg));
        else (STATE.fotosAvalLocal = STATE.fotosAvalLocal||[]).push(reg);
      }catch(e){ console.error(e); toast("Não foi possível processar uma foto"); }
    }
    inp.value = '';
    toast("Foto salva ✓");
    setTimeout(desenhar, 150);
  });
  desenhar();
}

function renderMaterialDetail(){
  const campo = STATE.campos.find(c=>c.id===STATE.campoAbertoId);
  const el = document.getElementById('view-material');
  if(!campo){ el.innerHTML = `<div class="empty-state">Campo não encontrado.</div>`; return; }
  const mat = (campo.materiais||[]).find(m=>m.id===STATE.materialAbertoId);
  if(!mat){ el.innerHTML = `<div class="empty-state">Material não encontrado.</div>`; return; }
  const editavel = podeEditar(campo);

  el.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-sm" id="btnVoltarCampo">← Voltar</button>
      <div class="grow">
        <h1 style="margin-bottom:2px;">${esc(rotuloMaterial(campo, mat))}</h1>
        <div class="campo-sub">${esc(campo.fazenda||'—')} · ${esc(campo.produtor||'—')} · ${esc(campo.safra||'—')}</div>
      </div>
      ${editavel ? `<div class="hstack" style="gap:6px;flex:none;"><button class="btn btn-sm" id="btnEditarMaterial">✏️ Editar</button><button class="btn btn-sm btn-danger" id="btnExcluirMaterial">Excluir</button></div>` : `<span class="badge badge-implantacao">Leitura</span>`}
    </div>
    ${mat.foraEstatistica ? `<div class="field-hint" style="background:#fdeeee;border-radius:10px;padding:8px 10px;margin-bottom:10px;color:var(--ink);">🚫 <b>Fora da estatística final</b>${mat.motivoForaEstat?` — ${esc(mat.motivoForaEstat)}`:''}. Os dados continuam salvos, só não entram no ranking, médias e PDFs de resultado. Toque em ✏️ Editar para incluir de volta.</div>` : ''}
    <div class="tabs" id="tabsBarMat">
      ${tabsDoCampo(campo).map(t=>`
        <button class="tab ${STATE.tabAtiva===t.key?'active':''} ${tabTemDadosMaterial(mat,t.key,campo)?'done':''}" data-tab="${t.key}">
          <span class="num">${tabTemDadosMaterial(mat,t.key,campo)&&STATE.tabAtiva!==t.key?'✓':t.num}</span> ${t.label}
        </button>`).join('')}
    </div>
    <div id="tabContentMat"></div>
  `;

  document.getElementById('btnVoltarCampo').addEventListener('click', voltarCampo);
  if(editavel){
    document.getElementById('btnEditarMaterial').addEventListener('click', ()=>abrirModalEditarMaterial(campo, mat));
    document.getElementById('btnExcluirMaterial').addEventListener('click', ()=>{
      pedirSenha("Excluir material", `Excluir o material <b>${esc(mat.nome||'sem nome')}</b> deste campo, com todas as avaliações? Não tem como desfazer.`, "Excluir material")
        .then(ok=>{ if(ok) excluirMaterial(campo, mat.id); });
    });
  }
  document.querySelectorAll('#tabsBarMat .tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ STATE.tabAtiva = btn.dataset.tab; STATE.fotosNovas=[]; renderMaterialDetail(); });
  });
  renderTabContentMaterial(campo, mat, editavel);
}

function avancarProximoMaterialLanc(campo, etapaKey, materialIdRecemSalvo){
  // Só atua dentro do lançamento em lote (aba Avaliações) — nas abas normais
  // de um material isolado, não existe "próximo material" para avançar.
  if(STATE.telaAtual !== "lancamento") return;
  const mats = materiaisAtivos(campo);
  const idx = mats.findIndex(m=>m.id===materialIdRecemSalvo);
  const depois = mats.slice(idx+1).find(m=>!tabTemDadosMaterial(m, etapaKey));
  const antes = mats.slice(0, Math.max(idx,0)).find(m=>!tabTemDadosMaterial(m, etapaKey));
  const proximo = depois || antes;
  if(!proximo){
    STATE.lancMaterialAberto = null;
    toast("Todos os materiais desta etapa foram lançados ✓");
  } else {
    STATE.lancMaterialAberto = proximo.id;
  }
  STATE.fotosNovas = [];
  renderLancamento();
}
function tabTemDadosMaterial(mat, key, campo){
  if(key==="estande" && campo && ehDifusao(campo)) return !!mat.numeroLinhas;
  if(key==="estande") return !!mat.estandeInicial?.plantasContadas;
  if(key==="engalhamento") return mat.engalhamento?.nota!=null;
  if(key==="sanidadeAltura") return mat.sanidadeAltura?.nota!=null;
  if(key==="colheita") return !!mat.colheita?.pesoColhidoKg;
  return false;
}

function renderTabContentMaterial(campo, mat, editavel){
  const wrap = document.getElementById('tabContentMat');
  if(STATE.tabAtiva==="estande") wrap.innerHTML = tplEstandeMaterial(campo, mat, editavel);
  else if(STATE.tabAtiva==="engalhamento") wrap.innerHTML = tplEngalhamento(mat, editavel);
  else if(STATE.tabAtiva==="sanidadeAltura") wrap.innerHTML = tplSanidadeAltura(mat, editavel);
  else if(STATE.tabAtiva==="colheita") wrap.innerHTML = tplColheita(campo, mat, editavel);
  wireTabEventsMaterial(campo, mat, editavel);
  anexarBlocoFotos(wrap, campo, mat, STATE.tabAtiva, editavel);
  { const bp = wrap.querySelector('#btnPdfColheitaFinal'); if(bp) bp.addEventListener('click', ()=>abrirModalRelatorioCampo(STATE.campos.find(c=>c.id===campo.id)||campo)); }
}

/* ---------- TAB 1 — ESTANDE (parcela + população inicial) ---------- */
function tplEstandeMaterial(campo, mat, editavel){
  const ei = mat.estandeInicial||{};
  const dis = editavel?"":"disabled";
  const espacDefinido = !!campo.espacamentoCm;
  const larguraCalc = calcLarguraM(mat.numeroLinhas, campo.espacamentoCm);
  const area = areaParcela(campo, mat);
  const popTeorica = calcPopTeoricaHa(mat.sementesPorMetro, campo.espacamentoCm);
  const plantasHa = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
  const pct = (!isNaN(plantasHa) && popTeorica) ? (plantasHa/popTeorica*100) : NaN;
  const compPadrao = num(campo.comprimentoPadraoM);
  return `
    <div class="card vstack">
      <div class="section-title" style="margin-top:0;">Material</div>
      <div class="field"><label>Nome do material</label><input ${dis} id="m_nome" value="${esc(mat.nome)}" placeholder="Ex: UR 8801 RR"></div>

      ${!espacDefinido?`<div class="field-hint" style="color:var(--danger);">Preencha o espaçamento nos "Dados do local" (tela do campo) para calcular a população por hectare automaticamente.</div>`:''}

      <div class="section-title">Parcela e semeadura</div>
      <div class="field" style="max-width:260px;"><label>Sementes por metro</label><input ${dis} type="number" step="any" id="m_sementes" value="${mat.sementesPorMetro??''}" placeholder="Ex: 14"></div>
      <div class="grid2">
        <div class="field"><label>Comprimento da parcela (m)</label><input ${dis} type="number" step="any" id="m_comp" value="${mat.comprimentoM??''}" placeholder="${compPadrao>0?'Padrão do campo: '+fmt(compPadrao,0)+' m':'Ex: 200'}"></div>
        <div class="field"><label>Linhas plantadas</label><input ${dis} type="number" step="1" id="m_linhas" value="${mat.numeroLinhas??''}" placeholder="Ex: 9"></div>
      </div>
      ${!espacDefinido?'':`<div class="field-hint">Largura = número de linhas × espaçamento (${campo.espacamentoCm} cm) — calculada sozinha.</div>`}
      <div class="calc-box">
        <div class="calc-item"><b id="calcLarguraMat">${!isNaN(larguraCalc)?fmt(larguraCalc,2)+' m':'—'}</b><span>Largura da parcela</span></div>
        <div class="calc-item"><b id="calcAreaMat">${fmtArea(area)}</b><span>Área da parcela</span></div>
      </div>

      <div ${ehDifusao(campo)?'style="display:none;"':''}>
      <div class="section-title">População inicial estabelecida</div>
      <div class="grid2">
        <div class="field"><label>Data da avaliação</label><input ${dis} type="date" id="m_dataEstande" min="${minDataAvaliacao(ei.data)}" value="${esc(ei.data||todayISO())}"></div>
        <div class="field"><label>Metros lineares avaliados</label><input ${dis} type="number" step="any" id="m_metros" value="${ei.metrosAvaliados??''}" placeholder="Ex: 5"></div>
      </div>
      <div class="field"><label>Plantas contadas no trecho</label><input ${dis} type="number" step="any" id="m_plantas" value="${ei.plantasContadas??''}" placeholder="Ex: 32"></div>

      <div class="calc-box">
        <div class="calc-item"><b id="calcPopTeoricaMat">${popTeorica?fmtInt(popTeorica)+'/ha':'—'}</b><span>População teórica esperada</span></div>
        <div class="calc-item"><b id="calcPlantasHaMat">${!isNaN(plantasHa)?fmtInt(plantasHa)+'/ha':'—'}</b><span>População obtida</span></div>
        <div class="calc-item"><b id="calcPctMat">${!isNaN(pct)?fmt(pct,0)+'%':'—'}</b><span>% de estabelecimento</span></div>
      </div>
      <div class="field-hint" id="avisoEstandeMat" style="color:var(--danger);${avisoDivergenciaPct(pct,'estabelecimento')?'':'display:none;'}">${avisoDivergenciaPct(pct,'estabelecimento')}</div>
      </div>
      <div class="field"><label>Observações</label><textarea ${dis} id="m_obs" placeholder="Uniformidade, falhas, replantio necessário...">${esc(ei.observacoes||'')}</textarea></div>

      ${editavel?`<button class="btn btn-primary btn-block" id="btnSalvarEstandeMat" style="margin-top:6px;">Salvar</button>`:''}
    </div>
  `;
}

/* ---------- TAB 2 — ENGALHAMENTO ---------- */
function tplEngalhamento(mat, editavel){
  const e = mat.engalhamento||{};
  const dis = editavel?"":"disabled";
  return `
    <div class="card vstack">
      <div class="section-title" style="margin-top:0;">Engalhamento</div>
      <div class="field-hint">Avalie o vigor de ramificação da planta em relação ao esperado para o material.</div>

/* ---------- TAB 4 — COLHEITA ---------- */
function tplColheita(campo, mat, editavel){
  const co = mat.colheita||{};
  const sf = co.standFinal||{};
  const dis = editavel?"":"disabled";
  const metodo = co.metodoCorrecao || 'formula';
  const descontoTabela = obterDescontoTabela(co.umidadePct, co.impurezaPct);
  const { corrigido, areaHa:area, kgHa, scHa } = produtividadeMaterial(campo, mat);
  const plantasHaFinal = calcPlantasHa(sf.plantasContadas, sf.metrosAvaliados, campo.espacamentoCm);
  const ei = mat.estandeInicial||{};
  const plantasHaInicial = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
  const pctSobrevivencia = (!isNaN(plantasHaFinal) && plantasHaInicial) ? (plantasHaFinal/plantasHaInicial*100) : NaN;
  const labelCorrigido = 'Peso corrigido · ' + rotuloMetodoCorrecao(co);

    <div class="card vstack">
      <div class="section-title" style="margin-top:0;">Área colhida</div>
      <div class="grid2">

      <div class="field"><label>Comprimento colhido (m)</label><input ${dis} type="number" step="any" id="c_comp" value="${co.comprimentoM??''}" placeholder="Ex: 10"></div>
      <div class="grid2">
        <div class="field"><label>Linhas colhidas</label><input ${dis} type="number" step="1" id="c_linhas" value="${co.linhasColhidas??''}" placeholder="Ex: 4"></div>
        <div class="field"><label>ou largura colhida (m)</label><input ${dis} type="number" step="any" id="c_larg" value="${co.larguraM??''}" placeholder="Ex: 1,8"></div>
      </div>
      <div class="field-hint" id="c_largHint">${campo.espacamentoCm?`Com linhas colhidas, a largura é calculada: linhas × ${fmt(num(campo.espacamentoCm),0)} cm.`:'Informe o espaçamento no campo para calcular a largura pelas linhas.'}</div>

      <div class="section-title">Peso e qualidade</div>
      <div class="grid2">
        <div class="field"><label>Peso colhido (kg)</label><input ${dis} type="number" step="any" id="c_peso" value="${co.pesoColhidoKg??''}" placeholder="Ex: 32.4"></div>
        <div class="field"><label>PMS — peso de mil sementes (g)</label><input ${dis} type="number" step="any" id="c_pms" value="${co.pmsG??''}" placeholder="Ex: 165"></div>
      </div>
      <div class="field" style="max-width:260px;"><label>Impureza (%, opcional)</label><input ${dis} type="number" step="any" id="c_impureza" value="${co.impurezaPct??''}" placeholder="Ex: 1.2"></div>

      <div class="section-title">Correção do peso</div>
      <div class="field" style="margin-bottom:0;">
        <label>Método de correção</label>
        <select ${dis} id="c_metodoCorrecao">
          ${METODOS_CORRECAO.map(o=>`<option value="${o.v}" ${metodo===o.v?'selected':''}>${o.t}</option>`).join('')}
        </select>
      </div>
      <div id="c_tabelaBox" class="tabela-desc-box" style="${metodo==='tabela'?'':'display:none;'}">
        <div class="hstack" style="justify-content:space-between;gap:8px;">
          <span style="font-size:12.5px;">⚖️ <b id="c_qtdFaixas">${(STATE.tabelaDesconto||[]).length}</b> faixa(s) cadastrada(s) · tabela compartilhada pela equipe</span>
          <button type="button" class="btn btn-sm" id="btnAbrirTabelaDesconto">Ver / editar</button>
        </div>
        <div class="field-hint" id="c_faixaAplicada" style="margin-top:4px;">${!isNaN(descontoTabela)?`Faixa aplicada: <b>${fmt(descontoTabela,1)}% de desconto</b>`:''}</div>
      </div>
      <div class="grid2" id="c_manualBox" style="${metodo==='manual'?'':'display:none;'}margin-top:8px;">
        <div class="field"><label>Desconto de umidade (%)</label><input ${dis} type="number" step="any" id="c_descU" value="${co.descUmidadePct??''}" placeholder="Ex: 1,5"></div>
        <div class="field"><label>Desconto de impureza (%)</label><input ${dis} type="number" step="any" id="c_descI" value="${co.descImpurezaPct??''}" placeholder="Ex: 0,5"></div>
      </div>
      <div class="field-hint" id="avisoSemFaixaDesconto" style="color:var(--danger);${(metodo==='tabela'&&isNaN(descontoTabela))?'':'display:none;'}">⚠️ Nenhuma faixa da tabela de desconto corresponde a essa umidade/impureza — toque em "Ver / editar" para cadastrar ou conferir as faixas.</div>

      <div class="calc-box">
        <div class="calc-item"><b id="calcAreaColhida">${fmtArea(area)}</b><span>Área colhida</span></div>
        <div class="calc-item"><b id="calcPesoCorrigido">${!isNaN(corrigido)?fmt(corrigido,1)+' kg':'—'}</b><span id="labelPesoCorrigido">${labelCorrigido}</span></div>
        <div class="calc-item"><b id="calcKgHa">${!isNaN(kgHa)?fmt(kgHa,0)+' kg/ha':'—'}</b><span>Produtividade</span></div>
        <div class="calc-item"><b id="calcScHa">${!isNaN(scHa)?fmt(scHa,1)+' sc/ha':'—'}</b><span>Produtividade (sc de 60kg/ha)</span></div>

      <div ${ehDifusao(campo)?'style="display:none;"':''}>
      <div class="section-title">Estande final</div>
      <div class="field-hint">Mesma lógica da contagem inicial — conte as plantas num trecho medido, pouco antes da colheita.</div>
      <div class="grid2">
        <div class="field"><label>Metros lineares avaliados</label><input ${dis} type="number" step="any" id="c_metrosFinal" value="${sf.metrosAvaliados??''}" placeholder="Ex: 5"></div>
        <div class="field"><label>Plantas contadas no trecho</label><input ${dis} type="number" step="any" id="c_plantasFinal" value="${sf.plantasContadas??''}" placeholder="Ex: 28"></div>
      </div>
      <div class="calc-box">
        <div class="calc-item"><b id="calcPlantasHaFinal">${!isNaN(plantasHaFinal)?fmtInt(plantasHaFinal)+'/ha':'—'}</b><span>População final</span></div>
        <div class="calc-item"><b id="calcSobrevivencia">${!isNaN(pctSobrevivencia)?fmt(pctSobrevivencia,0)+'%':'—'}</b><span>Sobrevivência até colheita (vs. estande inicial)</span></div>
      </div>
      <div class="field-hint" id="avisoColheitaSobrevivencia" style="color:var(--danger);${avisoDivergenciaPct(pctSobrevivencia,'sobrevivencia')?'':'display:none;'}">${avisoDivergenciaPct(pctSobrevivencia,'sobrevivencia')}</div>

      <div class="field">
        <label>Acamamento (nota 1 = totalmente acamado/ruim · 5 = ereto/excelente)</label>
        <div class="chip-select" id="c_acamamento">${NOTA_QUALI.map(n=>`<button type="button" ${dis} class="chip-opt ${co.acamamentoNota===n.v?'sel':''}" data-val="${n.v}">${n.v} · ${n.label}</button>`).join('')}</div>
      </div>

      </div>
      <div class="field"><label>Observações da colheita</label><textarea ${dis} id="c_obs" placeholder="Condições no momento da colheita, perdas, etc.">${esc(co.observacoes||'')}</textarea></div>

      ${editavel?`<button class="btn btn-primary btn-block" id="btnSalvarColheita" style="margin-top:6px;">Salvar colheita</button>`:''}
      <button type="button" class="btn btn-yellow btn-block" id="btnPdfColheitaFinal" style="margin-top:8px;">📄 PDF final da colheita (campo inteiro)</button>
    </div>
  `;
}

/* ---------------------------------------------------------------
   11) EVENTOS DAS ABAS DO MATERIAL
------------------------------------------------------------------*/
function wireTabEventsMaterial(campo, mat, editavel){
  if(STATE.tabAtiva==="estande") wireEstandeMaterial(campo, mat, editavel);
  else if(STATE.tabAtiva==="engalhamento") wireEngalhamento(campo, mat, editavel);
  else if(STATE.tabAtiva==="sanidadeAltura") wireSanidadeAltura(campo, mat, editavel);
  else if(STATE.tabAtiva==="colheita") wireColheitaMaterial(campo, mat, editavel);
}

function wireEstandeMaterial(campo, mat, editavel){
  const recalc = ()=>{
    const sementes = document.getElementById('m_sementes').value;
    const comp = document.getElementById('m_comp').value;
    const linhas = document.getElementById('m_linhas').value;
    const metros = document.getElementById('m_metros').value;
    const plantas = document.getElementById('m_plantas').value;
    const larguraCalc = calcLarguraM(linhas, campo.espacamentoCm);
    const area = calcAreaHa(num(comp)>0 ? comp : campo.comprimentoPadraoM, larguraCalc);
    const popTeorica = calcPopTeoricaHa(sementes, campo.espacamentoCm);
    const plantasHa = calcPlantasHa(plantas, metros, campo.espacamentoCm);
    const pct = (!isNaN(plantasHa) && popTeorica) ? (plantasHa/popTeorica*100) : NaN;
    document.getElementById('calcLarguraMat').textContent = !isNaN(larguraCalc)?fmt(larguraCalc,2)+' m':'—';
    document.getElementById('calcAreaMat').innerHTML = fmtArea(area);
    document.getElementById('calcPopTeoricaMat').textContent = popTeorica?fmtInt(popTeorica)+'/ha':'—';
    document.getElementById('calcPlantasHaMat').textContent = !isNaN(plantasHa)?fmtInt(plantasHa)+'/ha':'—';
    document.getElementById('calcPctMat').textContent = !isNaN(pct)?fmt(pct,0)+'%':'—';
    const aviso = document.getElementById('avisoEstandeMat');
    if(aviso){
      const txt = avisoDivergenciaPct(pct,'estabelecimento');
      aviso.textContent = txt;
      aviso.style.display = txt ? '' : 'none';
    }
  };
  ['m_sementes','m_comp','m_linhas','m_metros','m_plantas'].forEach(id=>{
    const elInput = document.getElementById(id);
    if(elInput) elInput.addEventListener('input', recalc);
  });
  if(!editavel) return;
  document.getElementById('btnSalvarEstandeMat').addEventListener('click', async ()=>{
    const nome = document.getElementById('m_nome').value.trim();
    if(!nome){ toast("Informe o nome do material"); return; }
    if(!ehDifusao(campo) && document.getElementById('m_plantas').value && !validarDataAvaliacao(document.getElementById('m_dataEstande').value, mat.estandeInicial?.data)) return;
    const patch = {
      nome,
      sementesPorMetro: num(document.getElementById('m_sementes').value) || null,
      comprimentoM: num(document.getElementById('m_comp').value) || null,
      numeroLinhas: num(document.getElementById('m_linhas').value) || null,
      estandeInicial: {
        data: document.getElementById('m_dataEstande').value,
        metrosAvaliados: num(document.getElementById('m_metros').value) || null,
        plantasContadas: num(document.getElementById('m_plantas').value) || null,
        observacoes: document.getElementById('m_obs').value.trim()
      }
    };
    await salvarMaterial(campo, mat.id, patch);
    toast("Estande salvo ✓");
    avancarProximoMaterialLanc(campo, "estande", mat.id);
  });
}

async function abrirLightboxFotos(fotos){
  openModal(`
    <h3>📷 Fotos da avaliação</h3>
    <div id="lightboxFotos" class="vstack" style="gap:10px;">
      <div class="field-hint">Carregando...</div>
    </div>
    <button class="btn btn-block" id="btnFecharLightbox" style="margin-top:10px;">Fechar</button>
  `, { wide:true });
  document.getElementById('btnFecharLightbox').addEventListener('click', closeModal);
  const box = document.getElementById('lightboxFotos');
  const imgs = await Promise.all(fotos.map(f=>buscarFotoBase64(f)));
  box.innerHTML = imgs.map(b64 => b64
    ? `<img src="${b64}" style="width:100%;border-radius:10px;">`
    : `<div class="field-hint">Não foi possível carregar esta foto.</div>`
  ).join('') || `<div class="field-hint">Nenhuma foto encontrada.</div>`;
}

function wireEngalhamento(campo, mat, editavel){
  if(!editavel) return;
  let notaVal = mat.engalhamento?.nota ?? null;
  const notaBox = document.getElementById('e_nota');
  if(notaBox) notaBox.querySelectorAll('.chip-opt').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      notaVal = parseInt(chip.dataset.val,10);
      notaBox.querySelectorAll('.chip-opt').forEach(c=>c.classList.toggle('sel', c===chip));
    });
  });
  document.getElementById('btnSalvarEngalhamento').addEventListener('click', async ()=>{
    if(notaVal==null){ toast("Selecione uma nota de engalhamento"); return; }
    if(!validarDataAvaliacao(document.getElementById('e_data').value, mat.engalhamento?.data)) return;
    const patch = {
      engalhamento: {
        data: document.getElementById('e_data').value,
        nota: notaVal,
        observacoes: document.getElementById('e_obs').value.trim()
      }
    };
    await salvarMaterial(campo, mat.id, patch);
    toast("Engalhamento salvo ✓");
    avancarProximoMaterialLanc(campo, "engalhamento", mat.id);
  });
}

function wireSanidadeAltura(campo, mat, editavel){
  const s = mat.sanidadeAltura||{};

  const btnVerFotos = document.getElementById('btnVerFotosSan');
  if(btnVerFotos) btnVerFotos.addEventListener('click', ()=>abrirLightboxFotos(s.fotos||[]));

  // Ocorrências: rascunho em memória (sobrevive à sincronização) até tocar em Salvar
  if(!STATE.sanDraft || STATE.sanDraft.matId!==mat.id) STATE.sanDraft = { matId:mat.id, diagnosticos: diagnosticosDoMaterial(s) };
  const boxOc = document.getElementById('s_ocorrencias');
  const renderOcorrencias = ()=>{
    if(!boxOc) return;
    const lista = STATE.sanDraft.diagnosticos;
    boxOc.innerHTML = lista.length ? lista.map(d=>{
      const cat = GUIA_CATS[d.cat] || GUIA_CATS.doenca, st = STATUS_SUSPEITA[d.status] || STATUS_SUSPEITA.confirmada;
      const temFoto = d.fotoB64 || d.foto;
      return `<div class="hstack oc-row" style="justify-content:space-between;gap:8px;">
        <div style="min-width:0;">
          <b style="font-size:13.5px;">${cat.icon} ${esc(nomeItemGuia(d.cat,d.item))}</b>
          <div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <span class="badge ${st.cls}">${st.t}</span>
            ${d.grau!=null?`<span class="field-hint" style="margin:0;">Grau ${d.grau} · ${esc(cat.escala[d.grau]||'')}</span>`:''}
            ${d.fotoB64?'<span class="field-hint" style="margin:0;">· foto a enviar</span>':''}
          </div>
          ${d.obs?`<div class="field-hint" style="margin-top:2px;">${esc(d.obs)}</div>`:''}
        </div>
        <span class="hstack" style="gap:2px;flex:none;">
          ${temFoto?`<button type="button" class="btn btn-sm btn-ghost" data-ocfoto="${d.id}" title="Ver foto">📷</button>`:''}
          ${editavel?`<button type="button" class="btn btn-sm btn-ghost" data-ocrm="${d.id}" style="color:var(--danger);" title="Remover">✕</button>`:''}
        </span>
      </div>`;
    }).join('') : `<div class="field-hint">Nenhuma ocorrência registrada.</div>`;
    boxOc.querySelectorAll('[data-ocrm]').forEach(b=>b.addEventListener('click', ()=>{
      STATE.sanDraft.diagnosticos = STATE.sanDraft.diagnosticos.filter(d=>d.id!==b.dataset.ocrm); renderOcorrencias();
      toast("Removida — toque em Salvar para gravar");
    }));
    boxOc.querySelectorAll('[data-ocfoto]').forEach(b=>b.addEventListener('click', ()=>{
      const d = STATE.sanDraft.diagnosticos.find(x=>x.id===b.dataset.ocfoto);
      abrirLightboxFotos([d.fotoB64 ? { base64:d.fotoB64 } : d.foto]);
    }));
  };
  renderOcorrencias();
  const btnOc = document.getElementById('btnRegistrarOcorrencia');
  if(btnOc) btnOc.addEventListener('click', ()=>abrirGuia({ cat:'doenca', ctx:{ campo, mat, onAdd: diag=>{ STATE.sanDraft.diagnosticos.push(diag); renderOcorrencias(); } } }));

  const btnEscala = document.getElementById('btnToggleEscalaSan');
  const escalaBox = document.getElementById('escalaRefBox');
  if(btnEscala && escalaBox) btnEscala.addEventListener('click', ()=>{
    escalaBox.style.display = escalaBox.style.display==='none' ? 'block' : 'none';
  });

  if(!editavel) return;

  let notaVal = s.nota ?? null;
  const notaBox = document.getElementById('s_nota');
  if(notaBox) notaBox.querySelectorAll('.chip-opt').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      notaVal = parseInt(chip.dataset.val,10);
      notaBox.querySelectorAll('.chip-opt').forEach(c=>c.classList.toggle('sel', c===chip));
    });
  });

  const previewBox = document.getElementById('sFotosPreview');
  function renderFotosPreview(){
    if(!previewBox) return;
    previewBox.innerHTML = STATE.fotosNovas.map((b64,i)=>`
      <div style="position:relative;">
        <img src="${b64}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">
        <button type="button" data-rmfoto="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:999px;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:1;">✕</button>
      </div>
    `).join('');
    previewBox.querySelectorAll('[data-rmfoto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        STATE.fotosNovas.splice(parseInt(btn.dataset.rmfoto,10),1);
        renderFotosPreview();
      });
    });
  }
  renderFotosPreview();
  const fotoInput = document.getElementById('s_fotoInput');
  if(fotoInput) fotoInput.addEventListener('change', async ()=>{
    const file = fotoInput.files[0];
    if(!file) return;
    try{
      toast("Processando foto...");
      const base64 = await comprimirImagem(file);
      STATE.fotosNovas.push(base64);
      renderFotosPreview();
      fotoInput.value = "";
    }catch(e){
      console.error(e);
      toast("Não foi possível processar a foto");
    }
  });
  const manterCheck = document.getElementById('s_manterFotos');

  document.getElementById('btnSalvarSanidadeAltura').addEventListener('click', async ()=>{
    if(notaVal==null){ toast("Selecione uma nota geral de sanidade"); return; }
    if(!validarDataAvaliacao(document.getElementById('s_data').value, s.data)) return;
    const btn = document.getElementById('btnSalvarSanidadeAltura');
    btn.disabled = true; btn.textContent = "Salvando...";
    try{
      const manter = manterCheck ? manterCheck.checked : true;
      const fotosExistentes = manter ? (s.fotos||[]) : [];
      let novasRefs = [];
      if(STATE.fotosNovas.length){
        novasRefs = await salvarFotosSanidade(STATE.fotosNovas, { campoId: campo.id, materialId: mat.id });
      }
      // envia as fotos das ocorrências novas e guarda só a referência
      const diagnosticos = [];
      for(const d of STATE.sanDraft.diagnosticos){
        const { fotoB64, ...resto } = d;
        if(fotoB64){
          const [ref] = await salvarFotosSanidade([fotoB64], { campoId: campo.id, materialId: mat.id });
          resto.foto = ref;
        }
        diagnosticos.push(resto);
      }
      const altura = num(document.getElementById('s_altura').value);
      const patch = {
        sanidadeAltura: {
          data: document.getElementById('s_data').value,
          nota: notaVal,
          alturaCm: isNaN(altura) ? null : altura,
          fotos: fotosExistentes.concat(novasRefs),
          diagnosticos,
          // lista simples das doenças confirmadas (compatível com versões anteriores)
          doencas: diagnosticos.filter(d=>d.cat==='doenca' && d.status==='confirmada').map(d=>d.item),
          observacoes: document.getElementById('s_obs').value.trim()
        }
      };
      await salvarMaterial(campo, mat.id, patch);
      STATE.fotosNovas = [];
      STATE.sanDraft = null;
      toast("Sanidade e altura salvas ✓");
      avancarProximoMaterialLanc(campo, "sanidadeAltura", mat.id);
    }catch(e){
      console.error(e);
      toast("Erro ao salvar — verifique sua conexão");
    }finally{
      btn.disabled = false; btn.textContent = "Salvar";
    }
  });
}

function wireColheitaMaterial(campo, mat, editavel){
  let acamamentoVal = mat.colheita?.acamamentoNota ?? null;
  const recalc = ()=>{
    const coTmp = coletarColheitaForm();
    const metodo = coTmp.metodoCorrecao;
    const metrosFinal = document.getElementById('c_metrosFinal').value;
    const plantasFinal = document.getElementById('c_plantasFinal').value;
    const descontoTabela = obterDescontoTabela(coTmp.umidadePct, coTmp.impurezaPct);
    const { corrigido, areaHa:area, kgHa, scHa } = produtividadeMaterial(campo, { colheita: coTmp });
    const mb = document.getElementById('c_manualBox'); if(mb) mb.style.display = metodo==='manual' ? '' : 'none';
    const tb = document.getElementById('c_tabelaBox'); if(tb) tb.style.display = metodo==='tabela' ? '' : 'none';
    const qf = document.getElementById('c_qtdFaixas'); if(qf) qf.textContent = (STATE.tabelaDesconto||[]).length;
    const fa = document.getElementById('c_faixaAplicada'); if(fa) fa.innerHTML = !isNaN(descontoTabela) ? `Faixa aplicada: <b>${fmt(descontoTabela,1)}% de desconto</b>` : '';
    const plantasHaFinal = calcPlantasHa(plantasFinal, metrosFinal, campo.espacamentoCm);
    const ei = mat.estandeInicial||{};
    const plantasHaInicial = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
    const pctSobrevivencia = (!isNaN(plantasHaFinal) && plantasHaInicial) ? (plantasHaFinal/plantasHaInicial*100) : NaN;
    document.getElementById('calcAreaColhida').innerHTML = fmtArea(area);
    document.getElementById('calcPesoCorrigido').textContent = !isNaN(corrigido)?fmt(corrigido,1)+' kg':'—';
    document.getElementById('labelPesoCorrigido').textContent = 'Peso corrigido · ' + rotuloMetodoCorrecao(coTmp);
    document.getElementById('calcKgHa').textContent = !isNaN(kgHa)?fmt(kgHa,0)+' kg/ha':'—';
    document.getElementById('calcScHa').textContent = !isNaN(scHa)?fmt(scHa,1)+' sc/ha':'—';
    document.getElementById('calcPlantasHaFinal').textContent = !isNaN(plantasHaFinal)?fmtInt(plantasHaFinal)+'/ha':'—';
    document.getElementById('calcSobrevivencia').textContent = !isNaN(pctSobrevivencia)?fmt(pctSobrevivencia,0)+'%':'—';
    const avisoFaixa = document.getElementById('avisoSemFaixaDesconto');
    if(avisoFaixa) avisoFaixa.style.display = (metodo==='tabela' && isNaN(descontoTabela)) ? '' : 'none';
    const avisoSobrev = document.getElementById('avisoColheitaSobrevivencia');
    if(avisoSobrev){
      const txt = avisoDivergenciaPct(pctSobrevivencia,'sobrevivencia');
      avisoSobrev.textContent = txt;
      avisoSobrev.style.display = txt ? '' : 'none';
    }
  };
  const numOuNull = id => { const v = num(document.getElementById(id)?.value); return isNaN(v) ? null : v; };
  const coletarColheitaForm = ()=>({
    comprimentoM: numOuNull('c_comp'), linhasColhidas: numOuNull('c_linhas'), larguraM: numOuNull('c_larg'),
    pesoColhidoKg: numOuNull('c_peso'), umidadePct: numOuNull('c_umid'), impurezaPct: numOuNull('c_impureza'),
    metodoCorrecao: document.getElementById('c_metodoCorrecao').value,
    descUmidadePct: numOuNull('c_descU'), descImpurezaPct: numOuNull('c_descI')
  });
  ['c_comp','c_linhas','c_larg','c_peso','c_umid','c_impureza','c_descU','c_descI','c_metrosFinal','c_plantasFinal'].forEach(id=>{
    const elInput = document.getElementById(id);
    if(elInput) elInput.addEventListener('input', recalc);
  });
  const metodoSel = document.getElementById('c_metodoCorrecao');
  if(metodoSel) metodoSel.addEventListener('change', recalc);
  const btnTabela = document.getElementById('btnAbrirTabelaDesconto');
  if(btnTabela) btnTabela.addEventListener('click', ()=>abrirModalTabelaDesconto());
  const acamBox = document.getElementById('c_acamamento');
  if(acamBox) acamBox.querySelectorAll('.chip-opt').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      if(!editavel) return;
      acamamentoVal = parseInt(chip.dataset.val,10);
      acamBox.querySelectorAll('.chip-opt').forEach(c=>c.classList.toggle('sel', c===chip));
    });
  });
  if(!editavel) return;
  document.getElementById('btnSalvarColheita').addEventListener('click', async ()=>{
    if(!validarDataAvaliacao(document.getElementById('c_data').value, mat.colheita?.data)) return;
    const patch = {
      colheita: {
        ...coletarColheitaForm(),
        data: document.getElementById('c_data').value,
        pmsG: num(document.getElementById('c_pms').value) || null,
        standFinal: {
          metrosAvaliados: num(document.getElementById('c_metrosFinal').value) || null,
          plantasContadas: num(document.getElementById('c_plantasFinal').value) || null
        },
        acamamentoNota: acamamentoVal,
        observacoes: document.getElementById('c_obs').value.trim()
      }
    };
    if(patch.colheita.metodoCorrecao==='formula' && patch.colheita.pesoColhidoKg && patch.colheita.umidadePct==null){ toast("Informe a umidade para corrigir a 14% (ou escolha outro método)"); return; }
    await salvarMaterial(campo, mat.id, patch);
    toast("Colheita salva ✓");
    avancarProximoMaterialLanc(campo, "colheita", mat.id);
  });
}
