/* ---------------------------------------------------------------
   12) LINHA RESUMO DE UM MATERIAL (usada em Excel, PDF e Estatísticas)
------------------------------------------------------------------*/
function labelPotencialProdutivo(v){
  const opt = POTENCIAL_PRODUTIVO_OPCOES.find(o=>o.v===v);
  return opt ? opt.label : '';
}
function materialResumo(campo, mat){
  const ei = mat.estandeInicial||{}, co = mat.colheita||{};
  const eng = mat.engalhamento||{}, san = mat.sanidadeAltura||{};
  const sf = co.standFinal||{};
  const larguraImplantada = calcLarguraM(mat.numeroLinhas, campo.espacamentoCm);
  const areaImplantada = areaParcela(campo, mat);
  const popTeorica = calcPopTeoricaHa(mat.sementesPorMetro, campo.espacamentoCm);
  const plantasHa = calcPlantasHa(ei.plantasContadas, ei.metrosAvaliados, campo.espacamentoCm);
  const pctEstab = (!isNaN(plantasHa) && popTeorica) ? (plantasHa/popTeorica*100) : NaN;
  const plantasHaFinal = calcPlantasHa(sf.plantasContadas, sf.metrosAvaliados, campo.espacamentoCm);
  const pctSobrevivencia = (!isNaN(plantasHaFinal) && plantasHa) ? (plantasHaFinal/plantasHa*100) : NaN;
  const { areaHa:areaColhida, corrigido:pesoCorrigido, kgHa, scHa } = produtividadeMaterial(campo, mat);
  const ciclo = cicloDias(campo, mat);
  return {
    etapa: getEtapaMaterial(mat).label,
    consultor: campo.consultor||'',
    safra: campo.safra||'',
    fazenda: campo.fazenda||'',
    produtor: campo.produtor||'',
    numero: numeroMaterial(campo, mat) ?? '',
    material: mat.nome||'',
    tipoCampo: ehDifusao(campo) ? 'Difusão' : 'Protocolo',
    dataPlantio: campo.dataPlantio||'',
    culturaAntecessora: campo.culturaAntecessora==='Outros' ? (campo.culturaAntecessoraOutra||'Outros') : (campo.culturaAntecessora||''),
    potencialProdutivo: labelPotencialProdutivo(campo.potencialProdutivo),
    latitude: campo.lat??'',
    longitude: campo.lng??'',
    adubacaoFormulacao: campo.adubacaoFormulacao||'',
    adubacaoDoseKgHa: campo.adubacaoDose??'',
    sementesPorMetro: mat.sementesPorMetro??'',
    espacamentoCm: campo.espacamentoCm??'',
    numeroLinhas: mat.numeroLinhas??'',
    larguraParcelaM: !isNaN(larguraImplantada)?Number(larguraImplantada.toFixed(2)):'',
    areaImplantadaM2: !isNaN(areaImplantada)?Number((areaImplantada*10000).toFixed(1)):'',
    areaImplantadaHa: !isNaN(areaImplantada)?Number(areaImplantada.toFixed(4)):'',
    populacaoTeoricaHa: popTeorica?Math.round(popTeorica):'',
    populacaoObtidaHa: !isNaN(plantasHa)?Math.round(plantasHa):'',
    percEstabelecimento: !isNaN(pctEstab)?Number(pctEstab.toFixed(0)):'',
    dataEngalhamento: eng.data||'',
    notaEngalhamento: eng.nota??'',
    dataSanidade: san.data||'',
    alturaCm: san.alturaCm??'',
    notaSanidade: san.nota??'',
    fotosSanidadeQtd: (san.fotos||[]).length,
    ocorrencias: diagnosticosDoMaterial(san).map(d=>`${nomeItemGuia(d.cat,d.item)} (${(STATUS_SUSPEITA[d.status]?.t||'').replace(/^\S+\s/,'').toLowerCase()}${d.grau!=null?', grau '+d.grau:''})`).join('; '),
    dataColheita: co.data||'',
    areaColhidaM2: !isNaN(areaColhida)?Number((areaColhida*10000).toFixed(1)):'',
    areaColhidaHa: !isNaN(areaColhida)?Number(areaColhida.toFixed(4)):'',
    pesoColhidoKg: co.pesoColhidoKg??'',
    pmsG: co.pmsG??'',
    umidadePct: co.umidadePct??'',
    impurezaPct: co.impurezaPct??'',
    metodoCorrecao: rotuloMetodoCorrecao(co),
    pesoCorrigidoKg: !isNaN(pesoCorrigido)?Number(pesoCorrigido.toFixed(1)):'',
    produtividadeKgHa: !isNaN(kgHa)?Math.round(kgHa):'',
    produtividadeScHa: !isNaN(scHa)?Number(scHa.toFixed(1)):'',
    populacaoFinalHa: !isNaN(plantasHaFinal)?Math.round(plantasHaFinal):'',
    pctSobrevivencia: !isNaN(pctSobrevivencia)?Number(pctSobrevivencia.toFixed(0)):'',
    notaAcamamento: co.acamamentoNota??'',
    cicloDias: !isNaN(ciclo) ? ciclo : ''
  };
}

function todasLinhasResumo(campos){
  const linhas = [];
  campos.forEach(campo=>materiaisEstat(campo).forEach(mat=>linhas.push(materialResumo(campo,mat))));
  return linhas;
}

/* ---------------------------------------------------------------
   13) ESTATÍSTICAS POR MATERIAL (agregando entre todos os campos)
------------------------------------------------------------------*/
function statsPorMaterial(campos){
  const grupos = {};
  campos.forEach(campo=>{
    materiaisEstat(campo).forEach(mat=>{
      if(!mat.nome) return;
      const r = materialResumo(campo, mat);
      if(!grupos[mat.nome]) grupos[mat.nome] = { nome: mat.nome, scHaList:[], estabList:[], notaEngList:[], notaSanList:[], notaAcamList:[], locais:new Set() };
      grupos[mat.nome].locais.add(campo.id);
      if(r.produtividadeScHa !== '') grupos[mat.nome].scHaList.push(r.produtividadeScHa);
      if(r.percEstabelecimento !== '') grupos[mat.nome].estabList.push(r.percEstabelecimento);
      if(r.notaEngalhamento !== '') grupos[mat.nome].notaEngList.push(r.notaEngalhamento);
      if(r.notaSanidade !== '') grupos[mat.nome].notaSanList.push(r.notaSanidade);
      if(r.notaAcamamento !== '') grupos[mat.nome].notaAcamList.push(r.notaAcamamento);
    });
  });
  const arr = Object.values(grupos).map(g=>{
    const m = media(g.scHaList);
    const sd = desvioPadrao(g.scHaList, m);
    const cv = (g.scHaList.length>1 && m) ? (sd/m*100) : NaN;
    return {
      nome: g.nome,
      totalLocais: g.locais.size,
      repeticoesColhidas: g.scHaList.length,
      mediaScHa: m,
      desvioPadraoScHa: sd,
      cvPct: cv,
      minScHa: g.scHaList.length?Math.min(...g.scHaList):NaN,
      maxScHa: g.scHaList.length?Math.max(...g.scHaList):NaN,
      mediaEstabPct: media(g.estabList),
      mediaNotaEngalhamento: media(g.notaEngList),
      mediaNotaSanidade: media(g.notaSanList),
      mediaNotaAcamamento: media(g.notaAcamList)
    };
  });
  arr.sort((a,b)=>{
    const av = isNaN(a.mediaScHa) ? -Infinity : a.mediaScHa;
    const bv = isNaN(b.mediaScHa) ? -Infinity : b.mediaScHa;
    return bv-av;
  });
  return arr;
}

/* ---------------------------------------------------------------
   13b) TUKEY 5% (aproximado) E ANÁLISE DE ESTABILIDADE
   Estes dois cálculos são fornecidos como apoio à decisão, não como
   substituto de um software estatístico dedicado (SISVAR, Genes, R,
   Assistat) — ver avisos no próprio modal de Estatísticas.
------------------------------------------------------------------*/

// Tabela de amplitude estudentizada (Tukey, alpha=5%) — valores padrão de
// literatura estatística. Combinações fora da tabela usam o valor mais
// próximo (df menor / k maior disponível), o que torna o teste mais
// conservador — por isso ele é tratado como uma aproximação no app.
function calcTukeyHSD(mediaA, nA, mediaB, nB, msw, q){
  if(isNaN(msw) || msw<=0) return { hsd: NaN, diferente: false };
  const hsd = q * Math.sqrt((msw/2)*(1/nA + 1/nB));
  return { hsd, diferente: Math.abs(mediaA-mediaB) > hsd };
}

// Bron-Kerbosch simples (sem pivô) — encontra todos os grupos máximos de
// materiais mutuamente "não diferentes" no grafo de adjacência. Viável aqui
// porque o número de materiais por comparação é sempre pequeno (dezenas, não
// milhares).
function maximalCliques(n, adj){
  const cliques = [];
  function bk(R, P, X){
    if(P.length===0 && X.length===0){ cliques.push(R.slice()); return; }
    let Pw = P.slice(), Xw = X.slice();
    for(const v of P.slice()){
      const Nv = adj[v];
      bk(R.concat([v]), Pw.filter(u=>Nv.has(u)), Xw.filter(u=>Nv.has(u)));
      Pw = Pw.filter(u=>u!==v);
      Xw = Xw.concat([v]);
    }
  }
  bk([], Array.from({length:n},(_,i)=>i), []);

// Agrupamento por letras (compact letter display): monta o grafo de pares
// que NÃO diferem estatisticamente entre si (Tukey) e encontra todos os
// grupos máximos de materiais mutuamente não-diferentes — cada grupo máximo
// vira uma letra, e um material que participa de mais de um grupo (ex: não
// difere do de cima nem do de baixo) recebe as duas letras (ex: "ab"). É uma
// implementação simplificada do mesmo princípio usado em pacotes como o
// multcompView (R) — ver aviso na tela.
function atribuirLetrasTukey(ranking, msw, q){
  const n = ranking.length;
  const adj = ranking.map(()=>new Set());
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      if(!calcTukeyHSD(ranking[i].media, ranking[i].n, ranking[j].media, ranking[j].n, msw, q).diferente){
        adj[i].add(j); adj[j].add(i);
      }
    }
  }
  // n muito grande é raro aqui (materiais por safra), mas protege contra
  // explosão combinatória num grafo quase-completo.
  const grupos = n<=60 ? maximalCliques(n, adj) : ranking.map((_,i)=>[i]);
  grupos.sort((a,b)=> Math.min(...a) - Math.min(...b));
  const letras = "abcdefghijklmnopqrstuvwxyz";
  const letrasPorMaterial = ranking.map(()=>[]);
  grupos.forEach((g,idx)=>{
    const letra = letras[idx] || `g${idx+1}`;
    g.forEach(i=>letrasPorMaterial[i].push(letra));
  });
  return letrasPorMaterial.map(ls=>ls.sort().join(''));
}

function tukeyQ(k, df){
  const ks = TUKEY05.ks, dfs = TUKEY05.dfs, Q = TUKEY05.q;
  const ci = ks.indexOf(Math.max(2, Math.min(30, Math.round(k))));
  df = Math.max(2, df);
  if(df >= dfs[dfs.length-1]) return Q[dfs.length-1][ci];
  const i = dfs.findIndex(d=>d>=df);
  if(dfs[i]===df) return Q[i][ci];
  const d0 = dfs[i-1], d1 = dfs[i], t = (1/d0 - 1/df)/(1/d0 - 1/d1);

  if(z < 0.5) return Math.log(Math.PI/Math.sin(Math.PI*z)) - lnGamma(1-z);
  z -= 1; let x = c[0];
  for(let i=1;i<g+2;i++) x += c[i]/(z+i);

  return 0.5*Math.log(2*Math.PI) + (z+0.5)*Math.log(t) - t + Math.log(x);

    d = 1 + aa*d; if(Math.abs(d)<FPMIN) d = FPMIN; c = 1 + aa/c; if(Math.abs(c)<FPMIN) c = FPMIN; d = 1/d;

function tabelaMatLocal(campos, varKey){
  const get = VARS[varKey].get, tab = {}, locais = [];
  campos.forEach(c=>{
    let tem = false;
    materiaisEstat(c).forEach(m=>{
      if(!m.nome) return;
      const v = get(c, m);
      if(v==null || isNaN(v)) return;
      (tab[m.nome] = tab[m.nome] || {})[c.id] = v; tem = true;
    });
    if(tem) locais.push(c.id);
  });
  return { tab, locais };
}

  const { tab } = tabelaMatLocal(campos, varKey);

    return { nome, n:vals.length, media:m, sd, cv: (vals.length>1 && m) ? sd/m*100 : NaN, min:Math.min(...vals), max:Math.max(...vals) };

    modelo = 'blocos';
  } else {
    ssMat = nomes.reduce((a,n)=>a+Object.keys(tab[n]).length*(medias[n]-G)**2, 0);
    const ssw = nomes.reduce((a,n)=>a+Object.values(tab[n]).reduce((b,v)=>b+(v-medias[n])**2, 0), 0);
    dfw = N - k; msw = ssw/dfw; modelo = 'simples';
  }
  const msMat = ssMat/(k-1);
  const F = msw > 0 ? msMat/msw : NaN;
  const p = pValorF(F, k-1, dfw);
  const q = tukeyQ(k, dfw);
  const ranking = nomes.map(n=>({ nome:n, media:medias[n], n:Object.keys(tab[n]).length })).sort((a,b)=>b.media-a.media);
  const top = ranking[0];
  ranking.forEach(r=>{
    if(r===top || !(msw>0)){ r.difDoMelhor=false; r.hsd=NaN; return; }
    const { hsd, diferente } = calcTukeyHSD(top.media, top.n, r.media, r.n, msw, q);
    r.hsd = hsd; r.difDoMelhor = diferente;
  });
  const letras = atribuirLetrasTukey(ranking, msw, q);
  ranking.forEach((r,i)=>{ r.letra = letras[i]; });
  return { k, N, L, dfb:k-1, dfw, msb:msMat, msw, F, p, q, ranking, modelo, media:G, cvExp: msw>0 && G ? Math.sqrt(msw)/G*100 : NaN };
}
// compatibilidade: chamadas antigas = produtividade
function calcAnovaTukey(campos){ return anovaVar(campos, 'scHa'); }

function estabilidadeVar(campos, varKey){
  const { tab, locais } = tabelaMatLocal(campos, varKey);
  const nomes = Object.keys(tab);
  const amb = locais.filter(l=>nomes.filter(n=>tab[n][l]!=null).length >= 2);
  if(amb.length < 3) return null;
  const mAmb = Object.fromEntries(amb.map(l=>[l, media(nomes.filter(n=>tab[n][l]!=null).map(n=>tab[n][l]))]));
  const G = media(amb.map(l=>mAmb[l]));
  const I = Object.fromEntries(amb.map(l=>[l, mAmb[l]-G]));
  const resultado = [];
  nomes.forEach(nome=>{
    const pts = amb.filter(l=>tab[nome][l]!=null).map(l=>({ I:I[l], Y:tab[nome][l], rel: tab[nome][l]/mAmb[l]*100 }));
    if(pts.length < 3) return;
    const Yb = media(pts.map(p=>p.Y)), Ib = media(pts.map(p=>p.I));
    const sxx = pts.reduce((a,p)=>a+(p.I-Ib)**2, 0), sxy = pts.reduce((a,p)=>a+(p.I-Ib)*(p.Y-Yb), 0);
    const b = sxx>0 ? sxy/sxx : NaN, a0 = Yb - b*Ib;
    const ssRes = pts.reduce((a,p)=>a+(p.Y-(a0+b*p.I))**2, 0), ssTot = pts.reduce((a,p)=>a+(p.Y-Yb)**2, 0);
    const s2d = pts.length>2 ? ssRes/(pts.length-2) : NaN;
    const r2 = ssTot>0 ? 1 - ssRes/ssTot : NaN;
    const rels = pts.map(p=>p.rel), mr = media(rels), sr = desvioPadrao(rels, mr);
    resultado.push({ nome, media:Yb, b, s2d, r2, nAmbientes:pts.length, wi: mr - 0.674*sr, mediaRel:mr });
  });
  resultado.sort((a,b)=>b.media-a.media);
  return { ambientes: amb.length, mediaGeral:G, resultado };
}
function calcEstabilidade(campos){ return estabilidadeVar(campos, 'scHa'); }

// Material × material: só locais onde os dois foram avaliados (comparação pareada)
function dueloVar(campos, varKey, A, B){
  const { tab } = tabelaMatLocal(campos, varKey);
  const ta = tab[A]||{}, tb = tab[B]||{};
  const pares = campos.filter(c=>ta[c.id]!=null && tb[c.id]!=null).map(c=>({ campo:c, a:ta[c.id], b:tb[c.id], d:ta[c.id]-tb[c.id] }));
  const n = pares.length;
  if(!n) return { n:0, pares };
  const ds = pares.map(p=>p.d), md = media(ds), sd = desvioPadrao(ds, md);
  const t = n>1 && sd>0 ? md/(sd/Math.sqrt(n)) : NaN;
  return { n, pares, mediaA: media(pares.map(p=>p.a)), mediaB: media(pares.map(p=>p.b)), dif: md, sd, t, p: n>1 ? pValorT(t, n-1) : NaN,
    vitA: pares.filter(p=>p.d>0).length, vitB: pares.filter(p=>p.d<0).length };
}

function tplTukey(campos, varKey){
  varKey = varKey || 'scHa';
  const V = VARS[varKey], anova = anovaVar(campos, varKey);
  if(!anova) return `<div class="field-hint" style="margin-top:14px;">Teste de Tukey: aguardando pelo menos 2 materiais com dados de ${V.label.toLowerCase()} e repetições suficientes.</div>`;
  return `
    <div class="section-title">🧪 Análise de variância e Tukey 5% — ${esc(V.label)}</div>
    <p class="field-hint" style="margin-bottom:8px;">${anova.modelo==='blocos'
      ? `Delineamento em blocos: <b>cada local é um bloco</b> (${anova.L} locais × ${anova.k} materiais) — o efeito do local é descontado antes de comparar os materiais.`
      : `Dados desbalanceados (nem todo material está em todos os locais): ANOVA simples, cada local conta como repetição, sem descontar o efeito do local.`}
      F = ${fmt(anova.F,2)} · p = ${fmtP(anova.p)} ${anova.p<0.05?'<b>(há diferença entre materiais a 5%)</b>':'(sem diferença significativa a 5%)'} · CV experimental = ${fmt(anova.cvExp,1)}% · QM resíduo = ${fmt(anova.msw,2)} (${anova.dfw} GL) · q = ${fmt(anova.q,3)}</p>
    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>#</th><th>Material</th><th>Média ${esc(V.un)}</th><th>n</th><th>Grupo</th><th>DMS vs 1º</th></tr></thead>
      <tbody>${anova.ranking.map((r,i)=>`<tr><td>${i+1}º</td><td><b>${esc(r.nome)}</b></td><td>${fmtVar(r.media,varKey)}</td><td>${r.n}</td>
        <td><span class="badge ${i===0?'badge-colheita':(r.difDoMelhor?'badge-danger':'badge-implantacao')}">${esc(r.letra||'—')}</span></td><td>${!isNaN(r.hsd)?fmt(r.hsd,1):'—'}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="field-hint" style="margin-top:6px;">Materiais com a <b>mesma letra</b> não diferem entre si pelo teste de Tukey a 5%. Valores críticos exatos (amplitude estudentizada); agrupamento por letras pelo método dos grupos máximos. Para laudo formal, confirme em software estatístico (SISVAR, R/agricolae).</p>`;
}
function tplEstabilidade(campos, varKey){
  varKey = varKey || 'scHa';
  const V = VARS[varKey], est = estabilidadeVar(campos, varKey);
  if(!est) return `<div class="field-hint" style="margin-top:14px;">Estabilidade: precisa de pelo menos 3 locais com 2 ou mais materiais colhidos.</div>`;
  return `
    <div class="section-title">📊 Estabilidade e adaptabilidade — ${esc(V.label)}</div>
    <p class="field-hint" style="margin-bottom:8px;">${est.ambientes} locais como ambientes. <b>b</b> (Eberhart &amp; Russell): ≈ 1 adaptação ampla; &gt; 1 responde mais a ambientes bons; &lt; 1 mais estável em ambientes fracos. <b>R²</b> alto = comportamento previsível. <b>Wi</b> (Annicchiarico): % da média do ambiente que o material garante com 75% de confiança — quanto maior, menor o risco.</p>
    ${svgScatter(est.resultado.map(r=>({ x:r.media, y:r.b, label:r.nome })), { xLabel:`Média (${V.un})`, yLabel:'b (resposta ao ambiente)', refY:1, refX:est.mediaGeral, quadrantes:['Responde a ambiente bom','Ampla e produtivo','Pouco produtivo','Estável, ambiente fraco'] })}
    <div class="table-scroll"><table class="data-table">
      <thead><tr><th>Material</th><th>Média</th><th>Locais</th><th>b</th><th>R²</th><th>S²d</th><th>Wi (%)</th></tr></thead>
      <tbody>${est.resultado.map(r=>`<tr><td><b>${esc(r.nome)}</b></td><td>${fmtVar(r.media,varKey)}</td><td>${r.nAmbientes}</td><td>${fmt(r.b,2)}</td><td>${isNaN(r.r2)?'—':fmt(r.r2*100,0)+'%'}</td><td>${fmt(r.s2d,1)}</td><td><b>${fmt(r.wi,1)}</b></td></tr>`).join('')}</tbody>
    </table></div>
    <p class="field-hint" style="margin-top:6px;">Regressão centrada (válida mesmo quando nem todo material está em todos os locais). S²d sem descontar o erro experimental (precisaria das repetições dentro do local) — use como indicativo.</p>`;
}

/* ---- Gráficos SVG simples (sem biblioteca) ---- */
const COR_A = '#0AA759', COR_B = '#D9A400', COR_C = '#2453A8', COR_D = '#B24A7A';
function svgScatter(pts, o){
  pts = pts.filter(p=>!isNaN(p.x) && !isNaN(p.y));
  if(pts.length < 2) return '';
  o = o || {};
  const W=420, H=300, ml=44, mr=10, mt=22, mb=40;
  let xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  if(o.refX!=null && !isNaN(o.refX)) xs.push(o.refX); if(o.refY!=null) ys.push(o.refY);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const px=(x1-x0)||1, py=(y1-y0)||1; x0-=px*.08; x1+=px*.08; y0-=py*.12; y1+=py*.12;
  const X = v => ml + (v-x0)/(x1-x0)*(W-ml-mr), Y = v => H-mb - (v-y0)/(y1-y0)*(H-mt-mb);
  const ticks = (a,b,n)=>{ const st=(b-a)/n; return Array.from({length:n+1},(_,i)=>a+st*i); };
  let reg = '';
  if(o.regressao && pts.length>=3){
    const mx=media(pts.map(p=>p.x)), my=media(pts.map(p=>p.y));
    const sxx=pts.reduce((a,p)=>a+(p.x-mx)**2,0), sxy=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0), syy=pts.reduce((a,p)=>a+(p.y-my)**2,0);
    if(sxx>0){ const b=sxy/sxx, a=my-b*mx, r = syy>0 ? sxy/Math.sqrt(sxx*syy) : NaN;
      reg = `<line x1="${X(x0)}" y1="${Y(a+b*x0)}" x2="${X(x1)}" y2="${Y(a+b*x1)}" stroke="${COR_B}" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="${ml}" y="${mt-8}" font-size="11.5" fill="#8A6D00">r = ${fmt(r,2)} · R² = ${fmt(r*r,2)} · ${b>=0?'+':''}${fmt(b,3)} por unidade</text>`; }
  }
  const quad = o.quadrantes && o.refX!=null && o.refY!=null ? [[X(x0)+6,Y(y1)+14,'start',0],[X(x1)-6,Y(y1)+14,'end',1],[X(x0)+6,Y(y0)-6,'start',2],[X(x1)-6,Y(y0)-6,'end',3]]
    .map(([x,y,an,i])=>`<text x="${x}" y="${y}" text-anchor="${an}" font-size="10.5" fill="#9AA8A0">${esc(o.quadrantes[[0,1,2,3][i]])}</text>`).join('') : '';
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.yLabel||'')} × ${esc(o.xLabel||'')}">
    ${ticks(y0,y1,4).map(t=>`<line x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#E2E8E4"/><text x="${ml-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="#5A6B62">${fmt(t, Math.abs(y1-y0)<5?2:0)}</text>`).join('')}
    ${ticks(x0,x1,4).map(t=>`<text x="${X(t)}" y="${H-mb+16}" text-anchor="middle" font-size="11" fill="#5A6B62">${fmt(t, Math.abs(x1-x0)<5?2:0)}</text>`).join('')}
    ${o.refY!=null?`<line x1="${ml}" x2="${W-mr}" y1="${Y(o.refY)}" y2="${Y(o.refY)}" stroke="#5A6B62" stroke-dasharray="3 3"/>`:''}
    ${o.refX!=null&&!isNaN(o.refX)?`<line y1="${mt}" y2="${H-mb}" x1="${X(o.refX)}" x2="${X(o.refX)}" stroke="#5A6B62" stroke-dasharray="3 3"/>`:''}
    ${quad}${reg}
    ${pts.map(p=>`<g><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${p.cor||COR_A}" stroke="#fff" stroke-width="2"><title>${esc(p.label)}: ${fmt(p.x,1)} × ${fmt(p.y,2)}</title></circle>
      <text x="${X(p.x)>W*0.65 ? X(p.x)-8 : X(p.x)+8}" y="${Y(p.y)-8}" text-anchor="${X(p.x)>W*0.65?'end':'start'}" font-size="10.5" fill="#16241C">${esc(String(p.label).slice(0,16))}</text></g>`).join('')}
    <text x="${(ml+W-mr)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#16241C">${esc(o.xLabel||'')}</text>
    <text transform="translate(14 ${(mt+H-mb)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#16241C">${esc(o.yLabel||'')}</text>
  </svg>`;
}
// barras horizontais agrupadas: categorias × séries (ex.: material × safra)
function svgBarrasAgrupadas(cats, series, o){
  o = o || {};
  const vals = series.flatMap(s=>s.valores).filter(v=>!isNaN(v));
  if(!vals.length) return '';
  const max = Math.max(...vals), lab = 108, W = 420, barH = 13, gap = 2, grupo = series.length*(barH+gap)+12, topo = 10 + series.length*16;
  const H = cats.length*grupo + topo + 6, X = v => lab + v/max*(W-lab-46);
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img">
    ${series.map((s,i)=>`<rect x="${lab}" y="${4+i*16}" width="12" height="12" rx="3" fill="${s.cor}"/><text x="${lab+16}" y="${14+i*16}" font-size="12" fill="#16241C">${esc(s.nome)}</text>`).join('')}
    ${cats.map((c,ci)=>{ const y0 = topo + ci*grupo;
      return `<text x="${lab-6}" y="${y0+grupo/2-2}" text-anchor="end" font-size="11.5" fill="#16241C">${esc(String(c).slice(0,15))}</text>` +
        series.map((s,si)=>{ const v = s.valores[ci]; if(isNaN(v)) return ''; const y = y0 + si*(barH+gap);
          return `<rect x="${lab}" y="${y}" width="${Math.max(2,X(v)-lab)}" height="${barH}" rx="4" fill="${s.cor}"><title>${esc(c)} · ${esc(s.nome)}: ${fmt(v,o.casas??1)}</title></rect>
            <text x="${X(v)+4}" y="${y+barH-2}" font-size="10.5" fill="#5A6B62">${fmt(v,o.casas??1)}</text>`; }).join(''); }).join('')}
  </svg>`;
}
// colunas verticais (ex.: chuva por mês), 1 ou 2 séries
function svgColunas(rotulos, series, o){
  o = o || {};
  const vals = series.flatMap(s=>s.valores).filter(v=>!isNaN(v));
  if(!vals.length) return '';
  const W=420, H=230, ml=34, mr=6, mt=10+series.length*16, mb=26, max = Math.max(...vals)||1;
  const slot = (W-ml-mr)/rotulos.length, bw = Math.min(28, (slot-6)/series.length);
  const Y = v => H-mb - v/max*(H-mt-mb);
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img">
    ${series.map((s,i)=>`<rect x="${ml}" y="${4+i*16}" width="12" height="12" rx="3" fill="${s.cor}"/><text x="${ml+16}" y="${14+i*16}" font-size="12" fill="#16241C">${esc(s.nome)}</text>`).join('')}
    ${[0,.5,1].map(f=>`<line x1="${ml}" x2="${W-mr}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="#E2E8E4"/><text x="${ml-5}" y="${Y(max*f)+4}" text-anchor="end" font-size="10.5" fill="#5A6B62">${fmt(max*f,0)}</text>`).join('')}
    ${rotulos.map((r,i)=>{ const cx = ml + slot*i + slot/2;
      return series.map((s,si)=>{ const v = s.valores[i]; if(isNaN(v)) return ''; const x = cx - (series.length*bw)/2 + si*bw;
        return `<rect x="${x+1}" y="${Y(v)}" width="${bw-2}" height="${H-mb-Y(v)}" rx="3" fill="${s.cor}"><title>${esc(r)} · ${esc(s.nome)}: ${fmt(v,0)} ${esc(o.un||'')}</title></rect>`; }).join('') +
        `<text x="${cx}" y="${H-mb+15}" text-anchor="middle" font-size="10.5" fill="#5A6B62">${esc(r)}</text>`; }).join('')}
  </svg>`;
}
// barras divergentes (diferença A − B por local)
function svgDivergente(itens, o){

}

   15a) RODAPÉ PADRÃO DE TODOS OS PDFs — faixa verde com o logo
   "Urtigão no Campo" em todas as páginas + data e paginação.

const CABECALHO_PDF_ALTURA = 40;
function logoDataURL(){
  const img = document.querySelector('.topbar img') || document.querySelector('#gate img');
  return img ? img.src : null;
}
// Cabeçalho padrão de TODOS os PDFs: faixa verde no topo com o logo
// "Urtigão no Campo", data de geração e paginação (sem rodapé).
function rodapePDF(doc){
  const logo = logoDataURL();
  const total = doc.internal.getNumberOfPages();
  const W = doc.internal.pageSize.getWidth(), A = CABECALHO_PDF_ALTURA;
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    doc.setFillColor(14,35,24); doc.rect(0, 0, W, A, 'F');
    doc.setFillColor(252,226,59); doc.rect(0, A, W, 2.5, 'F');
    if(logo){ try{ doc.addImage(logo, 'PNG', 24, 6, 69, 28); }catch(e){ console.warn('logo no PDF', e); } }
    doc.setFontSize(7.5); doc.setTextColor(220,232,224); doc.setFont(undefined,'normal');
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')} · página ${i} de ${total}`, W-24, 24, { align:'right' });
  }
}

function exportarExcel(campos){

    desvioPadraoScHa: !isNaN(s.desvioPadraoScHa)?Number(s.desvioPadraoScHa.toFixed(1)):'',

    maxScHa: !isNaN(s.maxScHa)?Number(s.maxScHa.toFixed(1)):'',
    mediaEstabPct: !isNaN(s.mediaEstabPct)?Number(s.mediaEstabPct.toFixed(0)):'',
    mediaNotaEngalhamento: !isNaN(s.mediaNotaEngalhamento)?Number(s.mediaNotaEngalhamento.toFixed(1)):'',
    mediaNotaSanidade: !isNaN(s.mediaNotaSanidade)?Number(s.mediaNotaSanidade.toFixed(1)):'',
    mediaNotaAcamamento: !isNaN(s.mediaNotaAcamamento)?Number(s.mediaNotaAcamamento.toFixed(1)):''
  }));

  const wb = XLSX.utils.book_new();

}

// fotos de um material para o PDF: as das avaliações (todas as etapas) + as de sanidade
async function fotosDoMaterialPDF(campo, mat){
  const out = [];
  (await listarFotosAvaliacao(campo.id, mat.id)).forEach(f=>out.push({ b64:f.base64, legenda:`${ETAPA_FOTO_LABEL[f.etapa]||f.etapa}${f.criadoEm?' · '+fmtDate(f.criadoEm.slice(0,10)):''}` }));
  const sa = mat.sanidadeAltura||{};
  const dataSan = sa.data ? ' · '+fmtDate(sa.data) : '';
  for(const ref of (sa.fotos||[])){ const b = await buscarFotoBase64(ref); if(b) out.push({ b64:b, legenda:'Sanidade'+dataSan }); }
  for(const d of (sa.diagnosticos||[])){ if(!d.foto) continue; const b = await buscarFotoBase64(d.foto); if(b) out.push({ b64:b, legenda:`Sanidade · ${d.nome||d.item||'ocorrência'}${dataSan}` }); }
  return out;
}
function dimImagem(b64){
  return new Promise(res=>{ const im = new Image(); im.onload = ()=>res({ w:im.naturalWidth||1, h:im.naturalHeight||1 }); im.onerror = ()=>res(null); im.src = b64; });
}
async function paginasFotosPDF(doc, campo){
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const cols = 4, gap = 12, cw = (W - 60 - gap*(cols-1))/cols, ch = 118, rowH = ch + 34;
  let x = 30, y = 0, col = 0, total = 0, primeira = true;
  const novaPagina = ()=>{
    doc.addPage(); y = Y0; col = 0;
    doc.setFontSize(13); doc.setTextColor(11,89,48); doc.setFont(undefined,'bold');
    doc.text(`Fotos dos materiais — ${campo.fazenda||''}${primeira?'':' (continuação)'}`, 30, y);
    doc.setFont(undefined,'normal'); y += 14; primeira = false;
  };
  for(const mat of materiaisAtivos(campo)){
    const fotos = await fotosDoMaterialPDF(campo, mat);
    for(const f of fotos){
      if(total===0 || (col===0 && y + rowH > H - 30)) novaPagina();
      x = 30 + col*(cw+gap);
      const d = await dimImagem(f.b64);
      if(d){
        const esc_ = Math.min(cw/d.w, ch/d.h), iw = d.w*esc_, ih = d.h*esc_;
        doc.setFillColor(240,244,241); doc.rect(x, y, cw, ch, 'F');
        try{ doc.addImage(f.b64, 'JPEG', x+(cw-iw)/2, y+(ch-ih)/2, iw, ih); }catch(e){ console.warn('foto no PDF', e); }
      }
      doc.setFontSize(8.5); doc.setTextColor(20,20,20); doc.setFont(undefined,'bold');
      doc.text(doc.splitTextToSize(rotuloMaterial(campo, mat), cw)[0], x, y+ch+11);
      doc.setFont(undefined,'normal'); doc.setTextColor(90,107,98); doc.setFontSize(7.5);
      doc.text(doc.splitTextToSize(f.legenda, cw)[0], x, y+ch+21);
      total++; col++;
      if(col===cols){ col = 0; y += rowH; }
    }
  }
  return total;
}

    i+1, l.nome, fmt(l.scHa,1),
    l.pmsG!==''&&l.pmsG!=null?l.pmsG:'—',
    l.umidadePct!==''&&l.umidadePct!=null?l.umidadePct:'—',
    l.populacaoFinalHa!==''&&l.populacaoFinalHa!=null?fmtInt(l.populacaoFinalHa):'—'
  ]);

  doc.autoTable({
    head:[cols],
    body: rows.length ? rows : [["—","Nenhum material colhido ainda","—","—","—","—"]],
    startY:Y0+40, margin:MARGEM_PDF,
    styles:{ fontSize:9.5, cellPadding:4.5 },
    headStyles:{ fillColor:[11,89,48], textColor:255 },
    alternateRowStyles:{ fillColor:[231,247,239] }
  });

  let yChuva = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 100) + 22;
  if(linhas.length){
    doc.setFontSize(9.5); doc.setTextColor(11,89,48); doc.setFont(undefined,'bold');
    doc.text(`Média do campo: ${fmt(media(linhas.map(l=>l.scHa)),1)} sc/ha · ${linhas.length} material(is) na estatística`, 30, yChuva);
    doc.setFont(undefined,'normal'); yChuva += 16;
  }
  const foraEst = materiaisAtivos(campo).filter(m=>m.foraEstatistica);
  if(foraEst.length){
    doc.setFontSize(8.5); doc.setTextColor(150,60,60);
    doc.text(doc.splitTextToSize(`Fora da estatística final: ${foraEst.map(m=>m.nome+(m.motivoForaEstat?` (${m.motivoForaEstat})`:'')).join('; ')}`, 780), 30, yChuva);
    yChuva += 18;
  }
  if((campo.chuvas||[]).length){
    if(yChuva > 520){ doc.addPage(); yChuva = Y0; }
    doc.setFontSize(10); doc.setTextColor(11,89,48); doc.setFont(undefined,'bold');
    doc.text(`Chuva no campo: ${fmt(totalChuva(campo),0)} mm acumulados`, 30, yChuva);
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(60,60,60);
    doc.text(chuvaPorMes(campo.chuvas).map(m=>`${m.label}: ${fmt(m.mm,0)} mm`).join('   ·   '), 30, yChuva+14, { maxWidth:780 });
    yChuva += 20;
  }
  if(!opts.somenteTabela && opts.incluirAssinatura){
    let y = yChuva + 24;
    if(y > 470) { doc.addPage(); y = Y0; }
    doc.setFontSize(9.5);
    doc.setTextColor(40,40,40);
    const texto = "Autorizo a divulgação e o compartilhamento dos resultados deste campo/ensaio (dados agronômicos e de produtividade acima), nos termos da Lei Geral de Proteção de Dados (Lei nº 13.709/2018 — LGPD), para fins técnicos e comerciais da Urtigão / Grupo Guedin.";
    const linhasTexto = doc.splitTextToSize(texto, 740);
    doc.text(linhasTexto, 30, y);
    y += linhasTexto.length*13 + 36;
    doc.line(30, y, 320, y);
    doc.setFontSize(9);
    doc.text(`Assinatura do produtor (${campo.produtor||'—'})`, 30, y+14);

    doc.setFontSize(11); doc.setTextColor(20,20,20);
    doc.text(new Date().toLocaleDateString('pt-BR'), 400, y-4);
    doc.setFontSize(9); doc.setTextColor(40,40,40);
    doc.line(400, y, 640, y);
    doc.text("Data", 400, y+14);
  }

  if(opts.incluirFotos){
    try{ await paginasFotosPDF(doc, campo); }catch(e){ console.error(e); toast("Algumas fotos não entraram no PDF"); }
  }
  const nomeArquivo = `resultado_colheita_${(campo.fazenda||'campo').replace(/[^a-z0-9]+/gi,'_')}_${todayISO()}.pdf`;
  rodapePDF(doc);
  doc.save(nomeArquivo);
  toast("Relatório do campo gerado ✓");
}

/* ---------------------------------------------------------------
   15b2) RELATÓRIO DA REDE — PDF único com todos os locais (filtros da aba
   Resultados valem): resumo, gráfico, ranking com Tukey e estabilidade,
   tabela material × local, locais e metodologia.
------------------------------------------------------------------*/
function gerarRelatorioRedePDF(campos, difusao){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF não carregou — verifique sua conexão"); return; }
  const { tab, locais } = tabelaMatLocal(campos, 'scHa');
  const stats = statsVar(campos, 'scHa');
  if(!stats.length){ toast("Nenhuma colheita lançada ainda para o relatório"); return; }
  const anova = anovaVar(campos, 'scHa');
  const est = stats.length>=2 ? estabilidadeVar(campos, 'scHa') : null;
  const cLoc = locais.map(id=>campos.find(c=>c.id===id)).filter(Boolean)
    .sort((a,b)=>(a.fazenda||'').localeCompare(b.fazenda||'','pt-BR'));
  const mediaLoc = id => media(Object.keys(tab).map(n=>tab[n][id]).filter(v=>v!=null));
  const G = media(stats.flatMap(s=>Object.values(tab[s.nome])));
  const safras = Array.from(new Set(cLoc.map(c=>c.safra||STATE.safraAtual))).join(', ');
  const consultores = Array.from(new Set(cLoc.map(c=>c.consultor).filter(Boolean))).join(', ');
  const letra = nome => anova ? (anova.ranking.find(r=>r.nome===nome)?.letra||'') : '';
  const estDe = nome => est ? est.resultado.find(r=>r.nome===nome) : null;
  const mediaVar = (nome, key)=>{ const t = tabelaMatLocal(campos, key).tab[nome]; return t ? media(Object.values(t)) : NaN; };
  const numCat = nome => { const n = numeroCatalogo(nome); return n!=null ? n+' · ' : ''; };
  const curto = (t, n)=> { t = String(t||''); return t.length>n ? t.slice(0,n-1)+'…' : t; };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"pt" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const verde=[11,89,48], verdeClaro=[231,247,239], amarelo=[252,226,59], cinza=[90,107,98];
  const titulo = (t, y)=>{ doc.setFontSize(13); doc.setTextColor(...verde); doc.setFont(undefined,'bold'); doc.text(t, 30, y); doc.setFont(undefined,'normal'); };

  // ---- página 1: resumo + gráfico
  doc.setFontSize(17); doc.setTextColor(...verde); doc.setFont(undefined,'bold');
  doc.text(`Relatório da rede — ${difusao?'Campos de difusão':'Protocolo Urtigão'} · Safra ${safras}`, 30, Y0);
  doc.setFont(undefined,'normal'); doc.setFontSize(9.5); doc.setTextColor(...cinza);
  doc.text(`${cLoc.length} local(is) colhido(s) · ${stats.length} materiais · Consultores: ${consultores||'—'}`, 30, Y0+16);
  const filtros = Object.entries(STATE.filtro||{}).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}`).join(' · ');
  if(filtros) doc.text(`Filtros aplicados: ${filtros}`, 30, Y0+28);
  // cartões
  const cards = [
    [fmt(G,1)+' sc/ha','Média geral'],
    [stats[0] ? fmt(stats[0].media,1)+' sc/ha' : '—', 'Maior média: '+curto(stats[0]?.nome,22)],
    [anova && !isNaN(anova.cvExp) ? fmt(anova.cvExp,1)+'%' : '—', 'CV experimental'],
    [anova ? (anova.p<0.05 ? 'Sim (p '+fmtP(anova.p)+')' : 'Não (p '+fmtP(anova.p)+')') : '—', 'Diferença entre materiais (5%)']
  ];
  const cw = (W-60-3*10)/4;
  cards.forEach((c,i)=>{
    const x = 30 + i*(cw+10), y = Y0+40;
    doc.setFillColor(...verdeClaro); doc.roundedRect(x, y, cw, 46, 6, 6, 'F');
    doc.setFontSize(14); doc.setTextColor(...verde); doc.setFont(undefined,'bold'); doc.text(c[0], x+10, y+20);
    doc.setFont(undefined,'normal'); doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.text(c[1], x+10, y+36);
  });
  // gráfico de barras horizontais
  let gy = Y0+108;
  titulo('Produtividade média por material (sc/ha) — letras iguais não diferem pelo Tukey 5%', gy); gy += 10;
  const disp = H - 30 - gy, n = stats.length;
  const bh = Math.max(7, Math.min(16, disp/n - 3)), passo = bh + Math.min(4, Math.max(2, disp/n - bh));
  const xNome = 30, xBar = 210, wBar = W - 30 - xBar - 90;
  const maxV = Math.max(...stats.map(s=>s.media)) || 1;
  doc.setFontSize(Math.min(9, bh*0.75));
  stats.forEach((s,i)=>{
    const y = gy + 6 + i*passo;
    if(y + bh > H - 26) return;
    doc.setTextColor(30,30,30); doc.text(curto(`${i+1}º ${numCat(s.nome)}${s.nome}`, 38), xNome, y + bh*0.75);
    const w = Math.max(2, s.media/maxV*wBar);
    if(i<3) doc.setFillColor(...verde); else if(s.media>=G) doc.setFillColor(92,170,120); else doc.setFillColor(190,200,194);
    doc.rect(xBar, y, w, bh, 'F');
    doc.setTextColor(30,30,30); doc.text(`${fmt(s.media,1)}  ${letra(s.nome)}`, xBar + w + 5, y + bh*0.75);
  });
  // linha da média geral
  const xm = xBar + G/maxV*wBar;
  doc.setDrawColor(200,60,60); doc.setLineDashPattern([3,2],0); doc.line(xm, gy+2, xm, Math.min(H-26, gy+6+n*passo)); doc.setLineDashPattern([],0);
  doc.setFontSize(7.5); doc.setTextColor(200,60,60); doc.text(`média ${fmt(G,1)}`, xm+3, gy+4);

  // ---- página 2: ranking completo
  doc.addPage();
  titulo('Ranking geral — produtividade e demais características', Y0);
  const temEst = !!est;
  const head = ['Pos','Material','Média sc/ha','Tukey','% da média','Locais','Mín','Máx','PMS (g)','Ciclo (dias)'].concat(temEst?['Wi (75%)','b']:[]);
  const body = stats.map((s,i)=>{
    const e = estDe(s.nome);
    return [i+1, numCat(s.nome)+s.nome, fmt(s.media,1), letra(s.nome)||'—', fmt(s.media/G*100,0)+'%', s.n, fmt(s.min,1), fmt(s.max,1),
      fmtVar(mediaVar(s.nome,'pms'),'pms'), fmtVar(mediaVar(s.nome,'ciclo'),'ciclo')]
      .concat(temEst ? [e ? fmt(e.wi,1) : '—', e && !isNaN(e.b) ? fmt(e.b,2) : '—'] : []);
  });
  doc.autoTable({ head:[head], body, startY:Y0+10, margin:MARGEM_PDF,
    styles:{ fontSize:8.5, cellPadding:3.5 }, headStyles:{ fillColor:verde, textColor:255 },
    alternateRowStyles:{ fillColor:verdeClaro },
    didParseCell: d=>{ if(d.section==='body' && d.row.index<3) d.cell.styles.fontStyle='bold'; } });
  let y2 = doc.lastAutoTable.finalY + 16;
  doc.setFontSize(8.5); doc.setTextColor(...cinza);
  const notas = [];
  if(anova) notas.push(`ANOVA ${anova.modelo==='blocos'?'em blocos (cada local = um bloco)':'simples (nem todos os materiais estão em todos os locais)'}: F = ${fmt(anova.F,2)}, p = ${fmtP(anova.p)}, CV = ${fmt(anova.cvExp,1)}%. Médias seguidas da mesma letra não diferem entre si pelo teste de Tukey a 5%.`);
  if(temEst) notas.push(`Estabilidade em ${est.ambientes} locais: Wi (Annicchiarico, 75% de confiança) = desempenho relativo à média do local que se espera atingir em 3 de cada 4 ambientes (acima de 100 = acima da média); b (Eberhart & Russell) ≈ 1 adaptação ampla, > 1 responde a ambientes bons, < 1 mais rústico.`);
  const fora = campos.flatMap(c=>materiaisAtivos(c).filter(m=>m.foraEstatistica).map(m=>`${m.nome} em ${c.fazenda||'—'}${m.motivoForaEstat?` (${m.motivoForaEstat})`:''}`));
  if(fora.length) notas.push(`Fora da estatística: ${fora.join('; ')}.`);
  notas.forEach(t=>{ const l = doc.splitTextToSize(t, W-60); if(y2 + l.length*11 > H-30){ doc.addPage(); y2 = Y0; } doc.text(l, 30, y2); y2 += l.length*11 + 6; });

  // ---- página 3: material × local
  doc.addPage();
  titulo('Produtividade por local (sc/ha)', Y0);
  const POR_PAG = 9;
  for(let ini=0; ini<cLoc.length; ini+=POR_PAG){
    const grupo = cLoc.slice(ini, ini+POR_PAG);
    if(ini>0) doc.addPage();
    const headL = ['Material'].concat(grupo.map(c=>curto(c.fazenda||'—',16))).concat(ini+POR_PAG>=cLoc.length?['Média']:[]);
    const bodyL = stats.map(s=>[curto(numCat(s.nome)+s.nome,28)].concat(grupo.map(c=>{ const v = tab[s.nome][c.id]; return v!=null ? fmt(v,1) : '—'; }))
      .concat(ini+POR_PAG>=cLoc.length?[fmt(s.media,1)]:[]));
    bodyL.push(['Média do local'].concat(grupo.map(c=>fmt(mediaLoc(c.id),1))).concat(ini+POR_PAG>=cLoc.length?[fmt(G,1)]:[]));
    doc.autoTable({ head:[headL], body:bodyL, startY:(ini>0?Y0:Y0+10), margin:MARGEM_PDF,
      styles:{ fontSize:cLoc.length>6?7.5:8.5, cellPadding:3, halign:'center' }, columnStyles:{ 0:{ halign:'left' } },
      headStyles:{ fillColor:verde, textColor:255 }, alternateRowStyles:{ fillColor:verdeClaro },
      didParseCell: d=>{
        if(d.section==='body' && d.row.index===bodyL.length-1){ d.cell.styles.fontStyle='bold'; d.cell.styles.fillColor=[252,243,190]; }
        // destaca o melhor material de cada local
        if(d.section==='body' && d.column.index>0 && d.column.index<=grupo.length && d.row.index<stats.length){
          const c = grupo[d.column.index-1], vals = stats.map(s=>tab[s.nome][c.id]).filter(v=>v!=null);
          if(vals.length && tab[stats[d.row.index].nome][c.id]===Math.max(...vals)){ d.cell.styles.fontStyle='bold'; d.cell.styles.textColor=verde; }
        }
      } });
  }

  // ---- página 4: locais
  doc.addPage();
  titulo('Locais da rede', Y0);
  doc.autoTable({ head:[['Fazenda','Produtor','Consultor','Plantio','Potencial','Chuva (mm)','Materiais','Média sc/ha','Melhor material']],
    body: cLoc.map(c=>{
      const melhor = stats.map(s=>({ nome:s.nome, v:tab[s.nome][c.id] })).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v)[0];
      const ch = totalChuva(c);
      return [c.fazenda||'—', c.produtor||'—', c.consultor||'—', c.dataPlantio?fmtDate(c.dataPlantio):'—', labelPotencialProdutivo(c.potencialProdutivo)||'—',
        ch>0?fmt(ch,0):'—', stats.filter(s=>tab[s.nome][c.id]!=null).length, fmt(mediaLoc(c.id),1), melhor ? `${melhor.nome} (${fmt(melhor.v,1)})` : '—'];
    }),
    startY:Y0+10, margin:MARGEM_PDF, styles:{ fontSize:8.5, cellPadding:3.5 }, headStyles:{ fillColor:verde, textColor:255 }, alternateRowStyles:{ fillColor:verdeClaro } });
  let y4 = doc.lastAutoTable.finalY + 18;
  if(y4 > H-80){ doc.addPage(); y4 = Y0; }
  doc.setFontSize(8.5); doc.setTextColor(...cinza);
  doc.text(doc.splitTextToSize(`Metodologia: produtividade corrigida conforme o método escolhido na colheita (padrão ${UMIDADE_BASE_PADRAO}% de umidade) e calculada sobre a área colhida de cada parcela. Materiais marcados como "fora da estatística" não entram nas médias, no Tukey nem na estabilidade. Relatório gerado pelo app Urtigão no Campo.`, W-60), 30, y4);

  rodapePDF(doc);
  doc.save(`relatorio_rede_${(safras||'safra').replace(/[^0-9a-z]+/gi,'-')}_${todayISO()}.pdf`);
  toast("Relatório da rede gerado ✓");
}

/* ---------------------------------------------------------------
   15c) CROQUI DO PLANTIO (PDF para enviar ao produtor)
   Dados do plantio + desenho das faixas (largura proporcional ao
   número de linhas de cada material, na ordem do nº) + tabela.
------------------------------------------------------------------*/
function gerarCroquiPDF(campo){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF não carregou — verifique sua conexão"); return; }
  const mats = materiaisAtivos(campo);
  if(mats.length===0){ toast("Selecione os materiais do campo antes de gerar o croqui"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"pt", format:"a4" });
  const W = doc.internal.pageSize.getWidth(), M = 36;
  const verde=[11,89,48], verdeClaro=[231,247,239], amarelo=[252,226,59], cinza=[90,107,98];

  // Título (o logo vai no cabeçalho padrão, aplicado no final)
  doc.setTextColor(...verde); doc.setFontSize(17); doc.setFont(undefined,'bold');
  doc.text("Croqui do plantio", M, Y0+4);
  doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.setTextColor(...cinza);
  doc.text(`${ehDifusao(campo)?'Campo de difusão':'Protocolo de avaliação de materiais'} · Safra ${campo.safra||'—'}`, M, Y0+20);

  // Quadro de informações
  const espac = num(campo.espacamentoCm);
  const info = [
    ["Fazenda", campo.fazenda||'—'],
    ["Produtor", campo.produtor||'—'],
    ["Data do plantio", fmtDate(campo.dataPlantio)],
    ["Consultor", campo.consultor||'—'],
    ["Adubação", [campo.adubacaoFormulacao, campo.adubacaoDose?`${fmt(campo.adubacaoDose,0)} kg/ha`:''].filter(Boolean).join(' · ')||'—'],
    ["Sementes por metro", campo.sementesPorMetroPadrao?`${fmt(campo.sementesPorMetroPadrao,1)} sem/m`:'—'],
    ["Espaçamento", !isNaN(espac)?`${fmt(espac,0)} cm`:'—'],
    ["Localização", campo.lat!=null?`${fmt(campo.lat,5)}, ${fmt(campo.lng,5)}`:'—']
  ];
  let y = Y0+34;
  const colW = (W-2*M)/2;
  doc.setDrawColor(226,232,228);
  info.forEach((it,i)=>{
    const col = i%2, row = Math.floor(i/2);
    const x = M + col*colW, yy = y + row*34;
    doc.setFillColor(...(row%2===0?verdeClaro:[255,255,255])); doc.rect(x, yy, colW, 34, 'F');
    doc.setFontSize(8); doc.setTextColor(...cinza); doc.text(it[0].toUpperCase(), x+8, yy+12);
    doc.setFontSize(11); doc.setTextColor(22,36,28); doc.setFont(undefined,'bold');
    doc.text(doc.splitTextToSize(String(it[1]), colW-16)[0], x+8, yy+27);
    doc.setFont(undefined,'normal');
  });
  y += Math.ceil(info.length/2)*34 + 22;

  // Desenho do croqui: faixas lado a lado, largura proporcional às linhas
  doc.setFontSize(12); doc.setTextColor(...verde); doc.setFont(undefined,'bold');
  doc.text("Disposição dos materiais no campo", M, y); doc.setFont(undefined,'normal');
  y += 10;
  const linhasDe = m => (num(m.numeroLinhas)>0 ? num(m.numeroLinhas) : 0);
  const totalLinhas = mats.reduce((a,m)=>a+linhasDe(m),0);
  const semLinhas = mats.filter(m=>!linhasDe(m)).length;
  const larguraUtil = W-2*M, alturaFaixa = 150;
  const pesoDe = m => linhasDe(m) || (totalLinhas ? totalLinhas/Math.max(1,mats.length-semLinhas) : 1);
  const pesoTotal = mats.reduce((a,m)=>a+pesoDe(m),0);
  let x = M;
  mats.forEach((m,i)=>{
    const w = larguraUtil * pesoDe(m)/pesoTotal;
    doc.setFillColor(...(i%2===0?[214,240,224]:[255,246,196]));
    doc.setDrawColor(11,89,48); doc.setLineWidth(.6);
    doc.rect(x, y, w, alturaFaixa, 'FD');
    const n = numeroMaterial(campo, m);
    doc.setTextColor(...verde); doc.setFont(undefined,'bold');
    doc.setFontSize(w>=18?10:7);
    doc.text(n!=null?String(n):String(i+1), x+w/2, y+13, { align:'center' });
    doc.setFont(undefined,'normal');
    if(w>=11){
      // nome do material na vertical, dentro da faixa
      const fs = Math.max(6, Math.min(9, w*0.55));
      doc.setFontSize(fs); doc.setTextColor(22,36,28);
      const nome = doc.splitTextToSize(m.nome||'', alturaFaixa-34)[0];
      doc.text(nome, x+w/2+fs*0.35, y+alturaFaixa-8, { angle:90 });
    }
    doc.setFontSize(6.5); doc.setTextColor(...cinza);
    if(w>=16 && linhasDe(m)) doc.text(`${linhasDe(m)}L`, x+w/2, y+24, { align:'center' });
    x += w;
  });
  y += alturaFaixa + 12;
  doc.setFontSize(8); doc.setTextColor(...cinza);
  doc.text(`Faixas na ordem do nº do material, largura proporcional às linhas plantadas (L).${semLinhas?` ${semLinhas} material(is) sem nº de linhas informado — desenhado(s) com largura média.`:''}`, M, y, { maxWidth: larguraUtil });
  y += 18;

  // Tabela
  const rows = mats.map((m,i)=>{
    const larg = calcLarguraM(m.numeroLinhas, campo.espacamentoCm);
    const area = areaParcela(campo, m);
    const compP = comprimentoParcela(campo, m);
    const n = numeroMaterial(campo, m);
    return [ n!=null?n:'—', m.nome||'—', m.numeroLinhas?fmtInt(m.numeroLinhas):'—',
      !isNaN(larg)?fmt(larg,2):'—', !isNaN(compP)?fmt(compP,1):'—',
      !isNaN(area)?fmt(area*10000,0):'—', m.sementesPorMetro!=null?fmt(m.sementesPorMetro,1):'—' ];
  });
  const areaTot = areaTotalCampo(campo);
  const largTot = calcLarguraM(totalLinhas, campo.espacamentoCm);
  doc.autoTable({
    head:[["Nº","Material","Linhas","Largura (m)","Compr. (m)","Área (m2)","Sem/m"]],
    body: rows,
    foot: [["", `Total — ${mats.length} materiais`, totalLinhas?fmtInt(totalLinhas):'—', !isNaN(largTot)?fmt(largTot,1):'—', "", areaTot>0?fmt(areaTot*10000,0):'—', ""]],
    startY: y, margin:{ left:M, right:M, top:MARGEM_PDF.top, bottom:MARGEM_PDF.bottom },
    styles:{ fontSize:9, cellPadding:4 },
    headStyles:{ fillColor:verde, textColor:255 },
    footStyles:{ fillColor:verdeClaro, textColor:[11,89,48], fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[247,251,249] },
    columnStyles:{ 0:{ halign:'center', cellWidth:30 }, 2:{ halign:'center' }, 3:{ halign:'right' }, 4:{ halign:'right' }, 5:{ halign:'right' }, 6:{ halign:'right' } }
  });
  y = doc.lastAutoTable.finalY + 20;
  if(campo.observacoes){
    if(y>760){ doc.addPage(); y=Y0; }
    doc.setFontSize(9); doc.setTextColor(40,40,40);
    const obs = doc.splitTextToSize(`Observações: ${campo.observacoes}`, larguraUtil);
    doc.text(obs, M, y); y += obs.length*12 + 10;
  }
  if(y>740){ doc.addPage(); y=Y0+20; }
  y = Math.max(y+30, 0);
  doc.setDrawColor(150); doc.line(M, y, M+200, y); doc.line(W-M-200, y, W-M, y);
  doc.setFontSize(8.5); doc.setTextColor(...cinza);
  doc.text(`Consultor: ${campo.consultor||''}`, M, y+12);
  doc.text(`Produtor: ${campo.produtor||''}`, W-M-200, y+12);
  doc.setFontSize(10); doc.setTextColor(30,30,30);
  doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, W/2, y+12, { align:'center' });
  rodapePDF(doc);
  doc.save(`croqui_${(campo.fazenda||'campo').replace(/[^a-z0-9]+/gi,'_')}_${todayISO()}.pdf`);
  toast("Croqui gerado ✓");
}

/* ---------------------------------------------------------------
   16) MODAL GENÉRICO
------------------------------------------------------------------*/
function openModal(html, opts){
  opts = opts || {};
  document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop ${opts.full?'full':''}" id="modalBackdrop"><div class="modal ${opts.wide?'wide':''} ${opts.full?'full':''}">${html}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', e=>{
    if(e.target.id==='modalBackdrop') closeModal();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ""; }

/* ---------------------------------------------------------------
   17) INICIALIZAÇÃO
------------------------------------------------------------------*/
initGate();

</script></html>
