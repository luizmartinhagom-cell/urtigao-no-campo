/* ---------------------------------------------------------------
   13) ESTATÍSTICAS POR MATERIAL (agregando entre todos os campos)
------------------------------------------------------------------*/
function statsPorMaterial(campos){
  const grupos = {};
  campos.forEach(campo=>{
    materiaisAtivos(campo).forEach(mat=>{
      if(!mat.nome) return;
      const r = materialResumo(campo, mat);
      if(!grupos[mat.nome]) grupos[mat.nome] = { nome: mat.nome, scHaList:[], estabList:[], notaEngList:[], notaSanList:[], notaAcamList:[], locais:new Set() };
      grupos[mat.nome].locais.add(campo.id);
      if(r.produtividadeScHa !== '') grupos[mat.nome].scHaList.push(r.produtividadeScHa);
      if(r.percEstabelecimento !== '') grupos[mat.nome].estabList.push(r.percEstabelecimento);
      if(r.notaEngalhamento !== '') grupos[mat.nome].notaEngList.push(r.notaEngalhamento);
      if(r.notaSanidade !== '') grupos[mat.nome].notaSanList.push(r.notaSanidade);
      if(r.notaAcamamento !== '') grupos[mat.nome].notaAcamList.push(r.notaAcamamento);
    });
  });
  const arr = Object.values(grupos).map(g=>{
    const m = media(g.scHaList);
    const sd = desvioPadrao(g.scHaList, m);
    const cv = (g.scHaList.length>1 && m) ? (sd/m*100) : NaN;
    return {
      nome: g.nome,
      totalLocais: g.locais.size,
      repeticoesColhidas: g.scHaList.length,
      mediaScHa: m,
      desvioPadraoScHa: sd,
      cvPct: cv,
      minScHa: g.scHaList.length?Math.min(...g.scHaList):NaN,
      maxScHa: g.scHaList.length?Math.max(...g.scHaList):NaN,
      mediaEstabPct: media(g.estabList),
      mediaNotaEngalhamento: media(g.notaEngList),
      mediaNotaSanidade: media(g.notaSanList),
      mediaNotaAcamamento: media(g.notaAcamList)
    };
  });
  arr.sort((a,b)=>{
    const av = isNaN(a.mediaScHa) ? -Infinity : a.mediaScHa;
    const bv = isNaN(b.mediaScHa) ? -Infinity : b.mediaScHa;
    return bv-av;
  });
  return arr;
}

/* ---------------------------------------------------------------
   13b) TUKEY 5% (aproximado) E ANÁLISE DE ESTABILIDADE
   Estes dois cálculos são fornecidos como apoio à decisão, não como
   substituto de um software estatístico dedicado (SISVAR, Genes, R,
   Assistat) — ver avisos no próprio modal de Estatísticas.
------------------------------------------------------------------*/

// Tabela de amplitude estudentizada (Tukey, alpha=5%) — valores padrão de
// literatura estatística. Combinações fora da tabela usam o valor mais
// próximo (df menor / k maior disponível), o que torna o teste mais
// conservador — por isso ele é tratado como uma aproximação no app.
const TUKEY_DF_ROWS = [5,6,7,8,9,10,12,15,20,24,30,40,60,120,999];
const TUKEY_K_COLS  = [2,3,4,5,6,7,8,9,10,12,15,20];
const TUKEY_Q05 = {
  5:  [3.64,4.60,5.22,5.67,6.03,6.33,6.58,6.80,6.99,7.32,7.72,8.21],
  6:  [3.46,4.34,4.90,5.31,5.63,5.90,6.12,6.32,6.49,6.79,7.14,7.59],
  7:  [3.34,4.16,4.68,5.06,5.36,5.61,5.82,6.00,6.16,6.43,6.76,7.17],
  8:  [3.26,4.04,4.53,4.89,5.17,5.40,5.60,5.77,5.92,6.18,6.48,6.87],
  9:  [3.20,3.95,4.41,4.76,5.02,5.24,5.43,5.59,5.74,5.98,6.28,6.64],
  10: [3.15,3.88,4.33,4.65,4.91,5.12,5.30,5.46,5.60,5.83,6.11,6.47],
  12: [3.08,3.77,4.20,4.51,4.75,4.95,5.12,5.27,5.39,5.62,5.88,6.21],
  15: [3.01,3.67,4.08,4.37,4.59,4.78,4.94,5.08,5.20,5.40,5.65,5.95],
  20: [2.95,3.58,3.96,4.23,4.45,4.62,4.77,4.90,5.01,5.20,5.43,5.71],
  24: [2.92,3.53,3.90,4.17,4.37,4.54,4.68,4.81,4.92,5.10,5.32,5.59],
  30: [2.89,3.49,3.85,4.10,4.30,4.46,4.60,4.72,4.82,5.00,5.21,5.47],
  40: [2.86,3.44,3.79,4.04,4.23,4.39,4.52,4.63,4.73,4.90,5.11,5.36],
  60: [2.83,3.40,3.74,3.98,4.16,4.31,4.44,4.55,4.65,4.81,5.00,5.24],
  120:[2.80,3.36,3.68,3.92,4.10,4.24,4.36,4.47,4.56,4.71,4.90,5.13],
  999:[2.77,3.31,3.63,3.86,4.03,4.17,4.29,4.39,4.47,4.62,4.80,5.01]
};
function tukeyQ(k, df){
  let kIdx = TUKEY_K_COLS.findIndex(c=>c>=k);
  if(kIdx===-1) kIdx = TUKEY_K_COLS.length-1;
  const dfLinha = TUKEY_DF_ROWS.find(d=>d>=df) ?? 999;
  return TUKEY_Q05[dfLinha][kIdx];
}

function calcTukeyHSD(mediaA, nA, mediaB, nB, msw, q){
  if(isNaN(msw) || msw<=0) return { hsd: NaN, diferente: false };
  const hsd = q * Math.sqrt((msw/2)*(1/nA + 1/nB));
  return { hsd, diferente: Math.abs(mediaA-mediaB) > hsd };
}

// Bron-Kerbosch simples (sem pivô) — encontra todos os grupos máximos de
// materiais mutuamente "não diferentes" no grafo de adjacência. Viável aqui
// porque o número de materiais por comparação é sempre pequeno (dezenas, não
// milhares).
function maximalCliques(n, adj){
  const cliques = [];
  function bk(R, P, X){
    if(P.length===0 && X.length===0){ cliques.push(R.slice()); return; }
    let Pw = P.slice(), Xw = X.slice();
    for(const v of P.slice()){
      const Nv = adj[v];
      bk(R.concat([v]), Pw.filter(u=>Nv.has(u)), Xw.filter(u=>Nv.has(u)));
      Pw = Pw.filter(u=>u!==v);
      Xw = Xw.concat([v]);
    }
  }
  bk([], Array.from({length:n},(_,i)=>i), []);
  return cliques;
}

// Agrupamento por letras (compact letter display): monta o grafo de pares
// que NÃO diferem estatisticamente entre si (Tukey) e encontra todos os
// grupos máximos de materiais mutuamente não-diferentes — cada grupo máximo
// vira uma letra, e um material que participa de mais de um grupo (ex: não
// difere do de cima nem do de baixo) recebe as duas letras (ex: "ab"). É uma
// implementação simplificada do mesmo princípio usado em pacotes como o
// multcompView (R) — ver aviso na tela.
function atribuirLetrasTukey(ranking, msw, q){
  const n = ranking.length;
  const adj = ranking.map(()=>new Set());
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      if(!calcTukeyHSD(ranking[i].media, ranking[i].n, ranking[j].media, ranking[j].n, msw, q).diferente){
        adj[i].add(j); adj[j].add(i);
      }
    }
  }
  // n muito grande é raro aqui (materiais por safra), mas protege contra
  // explosão combinatória num grafo quase-completo.
  const grupos = n<=60 ? maximalCliques(n, adj) : ranking.map((_,i)=>[i]);
  grupos.sort((a,b)=> Math.min(...a) - Math.min(...b));
  const letras = "abcdefghijklmnopqrstuvwxyz";
  const letrasPorMaterial = ranking.map(()=>[]);
  grupos.forEach((g,idx)=>{
    const letra = letras[idx] || `g${idx+1}`;
    g.forEach(i=>letrasPorMaterial[i].push(letra));
  });
  return letrasPorMaterial.map(ls=>ls.sort().join(''));
}

function calcAnovaTukey(campos){
  const grupos = {};
  campos.forEach(campo=>{
    materiaisAtivos(campo).forEach(mat=>{
      if(!mat.nome || !mat.colheita?.pesoColhidoKg) return;
      const r = materialResumo(campo, mat);
      if(r.produtividadeScHa===''||isNaN(r.produtividadeScHa)) return;
      if(!grupos[mat.nome]) grupos[mat.nome] = [];
      grupos[mat.nome].push(r.produtividadeScHa);
    });
  });
  const nomes = Object.keys(grupos);
  const todosValores = nomes.flatMap(n=>grupos[n]);
  const N = todosValores.length, k = nomes.length;
  if(k<2 || (N-k)<1) return null;
  const grandMean = media(todosValores);
  let ssb=0, ssw=0;
  nomes.forEach(n=>{
    const vals = grupos[n], m = media(vals);
    ssb += vals.length*Math.pow(m-grandMean,2);
    vals.forEach(v=> ssw += Math.pow(v-m,2));
  });
  const dfb = k-1, dfw = N-k;
  const msb = ssb/dfb, msw = dfw>0 ? ssw/dfw : NaN;
  const F = (msw>0) ? msb/msw : NaN;
  const q = tukeyQ(k, dfw);
  const ranking = nomes.map(n=>({ nome:n, media:media(grupos[n]), n:grupos[n].length }))
    .sort((a,b)=>b.media-a.media);
  const top = ranking[0];
  ranking.forEach(r=>{
    if(r===top || isNaN(msw) || msw<=0){ r.difDoMelhor=false; r.hsd=NaN; return; }
    const { hsd, diferente } = calcTukeyHSD(top.media, top.n, r.media, r.n, msw, q);
    r.hsd = hsd;
    r.difDoMelhor = diferente;
  });
  const letras = atribuirLetrasTukey(ranking, msw, q);
  ranking.forEach((r,i)=>{ r.letra = letras[i]; });
  return { k, N, dfb, dfw, msb, msw, F, q, ranking };
}

function calcEstabilidade(campos){
  const porCampo = {};
  const nomesSet = new Set();
  campos.forEach(campo=>{
    materiaisAtivos(campo).forEach(mat=>{
      if(!mat.nome || !mat.colheita?.pesoColhidoKg) return;
      const r = materialResumo(campo, mat);
      if(r.produtividadeScHa===''||isNaN(r.produtividadeScHa)) return;
      if(!porCampo[campo.id]) porCampo[campo.id] = {};
      porCampo[campo.id][mat.nome] = r.produtividadeScHa;
      nomesSet.add(mat.nome);
    });
  });
  const ambientes = Object.keys(porCampo).filter(cid=>Object.keys(porCampo[cid]).length>=2);
  if(ambientes.length<3) return null;
  const mediaAmbiente = {};
  ambientes.forEach(cid=>{ mediaAmbiente[cid] = media(Object.values(porCampo[cid])); });
  const grandMean = media(ambientes.map(cid=>mediaAmbiente[cid]));
  const indiceAmbiente = {};
  ambientes.forEach(cid=>{ indiceAmbiente[cid] = mediaAmbiente[cid]-grandMean; });
  const resultado = [];
  nomesSet.forEach(nome=>{
    const pontos = ambientes.filter(cid=>porCampo[cid][nome]!=null)
      .map(cid=>({ I:indiceAmbiente[cid], Y:porCampo[cid][nome] }));
    if(pontos.length<3) return;
    const mediaMaterial = media(pontos.map(p=>p.Y));
    const somaIY = pontos.reduce((a,p)=>a+p.I*p.Y,0);
    const somaI2 = pontos.reduce((a,p)=>a+p.I*p.I,0);
    const b = somaI2!==0 ? somaIY/somaI2 : NaN;
    let ssdi = 0;
    pontos.forEach(p=>{ const previsto = mediaMaterial+b*p.I; ssdi += Math.pow(p.Y-previsto,2); });
    const s2di = pontos.length>2 ? ssdi/(pontos.length-2) : NaN;
    resultado.push({ nome, media:mediaMaterial, b, s2di, nAmbientes:pontos.length });
  });
  resultado.sort((a,b)=>b.media-a.media);
  return { ambientes: ambientes.length, resultado };
}

function tplTukey(campos){
  const anova = calcAnovaTukey(campos);
  if(!anova) return `<div class="field-hint" style="margin-top:14px;">Teste de Tukey: aguardando pelo menos 2 materiais colhidos com dados suficientes.</div>`;
  return `
    <div class="section-title">🧪 Teste de Tukey a 5% (aproximado)</div>
    <p class="field-hint" style="margin-bottom:8px;">Cada campo/local conta como uma repetição. Materiais que compartilham a <b>mesma letra</b> não diferem estatisticamente entre si (não há indício de diferença real de produtividade); letras diferentes = a diferença entre as médias é maior que a Diferença Mínima Significativa (DMS/HSD) daquele par. F = ${!isNaN(anova.F)?fmt(anova.F,2):'—'} (k=${anova.k} materiais, ${anova.N} observações).</p>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>#</th><th>Material</th><th>Média sc/ha</th><th>Repetições</th><th>Grupo (Tukey)</th><th>DMS vs 1º</th></tr></thead>
        <tbody>
          ${anova.ranking.map((r,i)=>`
            <tr>
              <td>${i+1}º</td>
              <td><b>${esc(r.nome)}</b></td>
              <td>${fmt(r.media,1)}</td>
              <td>${r.n}</td>
              <td><span class="badge ${i===0?'badge-colheita':(r.difDoMelhor?'badge-danger':'badge-implantacao')}">${esc(r.letra||'—')}</span></td>
              <td>${!isNaN(r.hsd)?fmt(r.hsd,1):'—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <p class="field-hint" style="margin-top:6px;color:var(--danger);">⚠️ Aproximação: usa uma tabela padrão de valores críticos de Tukey (q) com interpolação pelo valor mais próximo, e um algoritmo simplificado de agrupamento por letras (compact letter display) — pode não coincidir exatamente com o agrupamento de um software estatístico dedicado em casos de fronteira. Para uma análise estatística formal/publicável, confirme em um software dedicado (SISVAR, Genes, R/agricolae, Assistat).</p>
  `;
}

function tplEstabilidade(campos){
  const est = calcEstabilidade(campos);
  if(!est) return `<div class="field-hint" style="margin-top:14px;">Análise de estabilidade: aguardando pelo menos 3 campos colhidos com 2+ materiais cada, para calcular o índice ambiental.</div>`;
  return `
    <div class="section-title">📊 Análise de estabilidade (regressão de Eberhart &amp; Russell, aproximada)</div>
    <p class="field-hint" style="margin-bottom:8px;">Usa ${est.ambientes} campo(s) como "ambientes" para calcular um índice de ambiente (quão favorável cada campo foi, em relação à média geral) e regride a produtividade de cada material contra esse índice. <b>b ≈ 1</b>: resposta média aos ambientes (estabilidade geral). <b>b &gt; 1</b>: mais responsivo a ambientes favoráveis (maior risco/retorno). <b>b &lt; 1</b>: mais estável, inclusive em ambientes de baixo potencial. <b>S²di</b> menor = desempenho mais previsível (menos desvio da tendência).</p>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Material</th><th>Média sc/ha</th><th>Ambientes</th><th>b (resposta)</th><th>S²di (desvio)</th></tr></thead>
        <tbody>
          ${est.resultado.map(r=>`
            <tr>
              <td><b>${esc(r.nome)}</b></td>
              <td>${fmt(r.media,1)}</td>
              <td>${r.nAmbientes}</td>
              <td>${!isNaN(r.b)?fmt(r.b,2):'—'}</td>
              <td>${!isNaN(r.s2di)?fmt(r.s2di,1):'—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <p class="field-hint" style="margin-top:6px;color:var(--danger);">⚠️ Aproximação: o índice de ambiente é calculado com os materiais disponíveis em cada campo (nem sempre os mesmos em todos os campos), o que é uma adaptação do método original de Eberhart &amp; Russell (pensado para ensaios balanceados). Use como indicativo, não como resultado publicável.</p>
  `;
}

    <p class="field-hint" style="margin-bottom:10px;">Agrega os dados de um mesmo material em todos os campos onde ele aparece (com os filtros atuais do dashboard). Produtividade em sc/ha corrigida a ${UMIDADE_BASE_PADRAO}% de umidade (ou pela tabela de desconto, quando usada). CV% = coeficiente de variação (desvio padrão ÷ média) — quanto menor, mais consistente o material entre locais. Notas de engalhamento/sanidade/acamamento na escala 1 (ruim) a 5 (excelente).</p>
    ${stats.length===0 ? `<div class="empty-state">Nenhum material cadastrado com os filtros atuais.</div>` : `
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr>
            <th>#</th><th>Material</th><th>Locais</th><th>Colhidos</th>
            <th>Média sc/ha</th><th>Desvio padrão</th><th>CV%</th>
            <th>Mín</th><th>Máx</th><th>% estab. médio</th>
            <th>Nota engalh.</th><th>Nota sanidade</th><th>Nota acam.</th>
          </tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
      ${semColheita ? `<p class="field-hint" style="margin-top:8px;">Ainda não há materiais colhidos — assim que a colheita for lançada, o ranking de produtividade aparece aqui.</p>` : ''}

  `, { wide:true });
  document.getElementById('btnFecharEstatisticas').addEventListener('click', closeModal);
}

function exportarExcel(campos){
  if(typeof XLSX==="undefined"){ toast("Biblioteca de Excel não carregou — verifique sua conexão"); return; }
  const linhas = todasLinhasResumo(campos);
  if(linhas.length===0){ toast("Nenhum material para exportar"); return; }
  const wsResumo = XLSX.utils.json_to_sheet(linhas);
  wsResumo['!cols'] = Object.keys(linhas[0]||{}).map(()=>({wch:16}));

  const statsRows = statsPorMaterial(campos).map(s=>({
    material: s.nome, totalLocais: s.totalLocais, repeticoesColhidas: s.repeticoesColhidas,
    mediaScHa: !isNaN(s.mediaScHa)?Number(s.mediaScHa.toFixed(1)):'',
    desvioPadraoScHa: !isNaN(s.desvioPadraoScHa)?Number(s.desvioPadraoScHa.toFixed(1)):'',
    cvPct: !isNaN(s.cvPct)?Number(s.cvPct.toFixed(1)):'',
    minScHa: !isNaN(s.minScHa)?Number(s.minScHa.toFixed(1)):'',
    maxScHa: !isNaN(s.maxScHa)?Number(s.maxScHa.toFixed(1)):'',
    mediaEstabPct: !isNaN(s.mediaEstabPct)?Number(s.mediaEstabPct.toFixed(0)):'',
    mediaNotaEngalhamento: !isNaN(s.mediaNotaEngalhamento)?Number(s.mediaNotaEngalhamento.toFixed(1)):'',
    mediaNotaSanidade: !isNaN(s.mediaNotaSanidade)?Number(s.mediaNotaSanidade.toFixed(1)):'',
    mediaNotaAcamamento: !isNaN(s.mediaNotaAcamamento)?Number(s.mediaNotaAcamamento.toFixed(1)):''
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsResumo, "Materiais");
  if(statsRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(statsRows), "Estatísticas");

  const nomeArquivo = `urtigao_no_campo_${todayISO()}.xlsx`;
  XLSX.writeFile(wb, nomeArquivo);
  toast("Excel exportado ✓");
}

function exportarPDF(campos){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF não carregou — verifique sua conexão"); return; }
  const linhas = todasLinhasResumo(campos);
  if(linhas.length===0){ toast("Nenhum material para exportar"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"pt" });

  doc.setFontSize(16);
  doc.setTextColor(11,89,48);
  doc.text("Urtigão no Campo — Relatório de avaliação de materiais", 30, 30);
  doc.setFontSize(9);
  doc.setTextColor(90,107,98);
  doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')} — ${campos.length} campo(s), ${linhas.length} material(is)`, 30, 46);

  const cols = [
    "Material","Fazenda","Produtor","Consultor","Safra","Etapa",
    "Cultura antecessora","Potencial",
    "Área impl. (m²)","Pop. obtida/ha","% estab.","Nota engalh.",
    "Altura cm","Nota sanidade","Nota acam.","PMS (g)","Umidade %","Produt. sc/ha"
  ];
  const rows = linhas.map(r=>[
    r.material,r.fazenda,r.produtor,r.consultor,r.safra,r.etapa,
    r.culturaAntecessora||'—', r.potencialProdutivo||'—',
    r.areaImplantadaM2,r.populacaoObtidaHa,r.percEstabelecimento!==''?r.percEstabelecimento+'%':'',
    r.notaEngalhamento!==''?r.notaEngalhamento+'/5':'—',
    r.alturaCm, r.notaSanidade!==''?r.notaSanidade+'/5':'—', r.notaAcamamento!==''?r.notaAcamamento+'/5':'—',
    r.pmsG, r.umidadePct, r.produtividadeScHa
  ]);

  doc.autoTable({
    head:[cols], body:rows, startY:58, styles:{ fontSize:7.5, cellPadding:3 },
    headStyles:{ fillColor:[11,89,48], textColor:255 },
    alternateRowStyles:{ fillColor:[231,247,239] }
  });

  const stats = statsPorMaterial(campos);
  if(stats.length){
    doc.addPage();
    doc.setFontSize(14);
    doc.setTextColor(11,89,48);
    doc.text("Estatísticas por material (todos os locais)", 30, 30);
    const statsCols = ["#","Material","Locais","Colhidos","Média sc/ha","Desvio padrão","CV%","Mín","Máx","% estab. médio"];
    const statsRows = stats.map((s,i)=>[
      i+1, s.nome, s.totalLocais, s.repeticoesColhidas,
      fmt(s.mediaScHa,1), fmt(s.desvioPadraoScHa,1), !isNaN(s.cvPct)?fmt(s.cvPct,1)+'%':'—',
      fmt(s.minScHa,1), fmt(s.maxScHa,1),
      !isNaN(s.mediaEstabPct)?fmt(s.mediaEstabPct,0)+'%':'—'
    ]);
    doc.autoTable({
      head:[statsCols], body:statsRows, startY:46, styles:{ fontSize:8, cellPadding:3.5 },
      headStyles:{ fillColor:[11,89,48], textColor:255 },
      alternateRowStyles:{ fillColor:[231,247,239] }
    });
  }

  doc.save(`urtigao_no_campo_${todayISO()}.pdf`);
  toast("PDF exportado ✓");
}

    ${linhas.length===0?`<div class="field-hint" style="color:var(--danger);margin-bottom:8px;">Nenhum material colhido ainda neste campo — o relatório fica mais completo depois da colheita, mas ainda é possível gerar com os dados disponíveis.</div>`:''}
    <div class="field">
      <label class="hstack" style="gap:8px;font-size:13px;align-items:flex-start;">
        <input type="checkbox" id="rc_somenteTabela" style="margin-top:3px;">
        <span>Gerar somente a planilha de resultados (sem espaço de assinatura)</span>
      </label>
    </div>
    <div class="field">
      <label class="hstack" style="gap:8px;font-size:13px;align-items:flex-start;">
        <input type="checkbox" id="rc_assinatura" checked style="margin-top:3px;">

      </label>
    </div>
    <button class="btn btn-primary btn-block" id="btnGerarRelatorioCampo">Gerar PDF</button>
    <button class="btn btn-block" style="margin-top:8px;" id="btnFecharRelatorioCampo">Fechar</button>
  `);
  document.getElementById('btnFecharRelatorioCampo').addEventListener('click', closeModal);
  const chkSomente = document.getElementById('rc_somenteTabela');
  const chkAssinatura = document.getElementById('rc_assinatura');
  chkSomente.addEventListener('change', ()=>{
    chkAssinatura.disabled = chkSomente.checked;

    else chkAssinatura.checked = true;
  });
  document.getElementById('btnGerarRelatorioCampo').addEventListener('click', ()=>{
    gerarRelatorioCampoPDF(campo, {
      somenteTabela: chkSomente.checked,
      incluirAssinatura: chkAssinatura.checked && !chkSomente.checked
    });
    closeModal();
  });
}

function gerarRelatorioCampoPDF(campo, opts){
  if(typeof window.jspdf==="undefined"){ toast("Biblioteca de PDF não carregou — verifique sua conexão"); return; }
  opts = opts || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"pt" });
  const linhas = rankingCampo(campo);

  doc.setFontSize(16);
  doc.setTextColor(11,89,48);
  doc.text(`Urtigão no Campo — Relatório do campo: ${campo.fazenda||'(sem nome)'}`, 30, 30);
  doc.setFontSize(9);
  doc.setTextColor(90,107,98);
  doc.text(`Produtor: ${campo.produtor||'—'} · Safra: ${campo.safra||'—'} · Gerado em ${new Date().toLocaleString('pt-BR')}`, 30, 46);
  const culturaAntecessoraTxt = campo.culturaAntecessora==='Outros' ? (campo.culturaAntecessoraOutra||'Outros') : (campo.culturaAntecessora||'—');
  doc.text(`Cultura antecessora: ${culturaAntecessoraTxt} · Potencial produtivo: ${labelPotencialProdutivo(campo.potencialProdutivo)||'—'}`, 30, 58);

  const cols = ["#","Material","Produtividade (sc/ha)","PMS (g)","Umidade %","População final (plantas/ha)"];
  const rows = linhas.map((l,i)=>[
    i+1, l.nome, fmt(l.scHa,1),
    l.pmsG!==''&&l.pmsG!=null?l.pmsG:'—',
    l.umidadePct!==''&&l.umidadePct!=null?l.umidadePct:'—',
    l.populacaoFinalHa!==''&&l.populacaoFinalHa!=null?fmtInt(l.populacaoFinalHa):'—'
  ]);

  doc.autoTable({
    head:[cols],
    body: rows.length ? rows : [["—","Nenhum material colhido ainda","—","—","—","—"]],
    startY:72,
    styles:{ fontSize:9.5, cellPadding:4.5 },
    headStyles:{ fillColor:[11,89,48], textColor:255 },
    alternateRowStyles:{ fillColor:[231,247,239] }
  });

  if(!opts.somenteTabela && opts.incluirAssinatura){
    let y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 100) + 34;
    if(y > 500) { doc.addPage(); y = 40; }
    doc.setFontSize(9.5);
    doc.setTextColor(40,40,40);
    const texto = "Autorizo a divulgação e o compartilhamento dos resultados deste campo/ensaio (dados agronômicos e de produtividade acima), nos termos da Lei Geral de Proteção de Dados (Lei nº 13.709/2018 — LGPD), para fins técnicos e comerciais da Urtigão / Grupo Guedin.";
    const linhasTexto = doc.splitTextToSize(texto, 740);
    doc.text(linhasTexto, 30, y);
    y += linhasTexto.length*13 + 36;
    doc.line(30, y, 320, y);
    doc.setFontSize(9);
    doc.text(`Assinatura do produtor (${campo.produtor||'—'})`, 30, y+14);
    doc.line(400, y, 640, y);
    doc.text("Data", 400, y+14);
  }

  const nomeArquivo = `relatorio_campo_${(campo.fazenda||'campo').replace(/[^a-z0-9]+/gi,'_')}_${todayISO()}.pdf`;
  doc.save(nomeArquivo);
  toast("Relatório do campo gerado ✓");
}
